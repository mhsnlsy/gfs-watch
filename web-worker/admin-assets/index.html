<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İstanbul Havası — Admin</title>
<style>
html,body{background:#081827;color:#dce8f1;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{padding:22px;line-height:1.55}
main{max-width:900px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}
.muted{color:#7893a3;font-size:11px}
pre{white-space:pre-wrap;margin:18px 0 0;font-size:13px}
#error{color:#ff9b9b;margin-top:20px}
</style>
</head>
<body>
<main>
<h1>İSTANBUL HAVASI — ADMIN</h1>
<div class="muted" id="updated">Veri yükleniyor…</div>
<pre id="report"></pre>
<div id="error"></div>
</main>
<script>
(function(){
  var report=document.getElementById("report"), error=document.getElementById("error");
  function pct(n,total){return total?((n*100/total).toFixed(1)+"%"):"0.0%";}
  function section(title,rows){
    var out=title+"\n";
    rows.forEach(function(r){out+=r[0]+": "+r[1]+(r[2]?" ("+pct(r[1],r[2])+")":"")+"\n";});
    return out+"\n";
  }
  function render(d){
    var t=d.today||{}, live=d.live||{}, out="";
    out+="ANLIK\nAktif ziyaretçi: "+(live.active_visitors||0)+"\n";
    out+="Aktif sayfalar:\n";
    (live.pages||[]).forEach(function(r){out+="  "+r.path+": "+r.count+"\n";});
    out+="\nBUGÜN\n";
    out+="Tekil ziyaretçi: "+(t.unique_visitors||0)+"\n";
    out+="Sayfa görüntüleme: "+(t.pageviews||0)+"\n";
    out+="Yeni ziyaretçi: "+(t.new_visitors||0)+"\n";
    out+="Tekrar gelen: "+(t.returning_visitors||0)+"\n\n";
    out+=section("CİHAZ",t.devices||[]);
    out+=section("İŞLETİM SİSTEMİ",t.os||[]);
    out+=section("TARAYICI",t.browsers||[]);
    out+=section("KAYNAK",t.sources||[]);
    out+=section("ŞEHİRLER",t.cities||[]);
    out+=section("EN ÇOK AÇILAN SAYFALAR",t.pages||[]);
    out+="SON ZİYARETLER\n";
    (t.recent||[]).forEach(function(r){
      out+=r.time+" — "+(r.city||"—")+" — "+(r.device||"—")+" — "+(r.browser||"—")+" — "+r.path+"\n";
    });
    out+="\n7 GÜN\n";
    (d.days||[]).forEach(function(r){out+=r.day+" — "+r.visitors+" ziyaretçi — "+r.pageviews+" sayfa\n";});
    out+="\n30 GÜN\n";
    (d.month||[]).forEach(function(r){out+=r.day+" — "+r.visitors+" ziyaretçi — "+r.pageviews+" sayfa\n";});
    report.textContent=out;
    document.getElementById("updated").textContent="Son güncelleme: "+new Date().toLocaleString("tr-TR");
  }
  function load(){
    fetch("/api/admin/analytics",{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    }).then(render).catch(function(e){error.textContent="Veri alınamadı: "+e.message;});
  }
  load();
  setInterval(load,30000);
})();
</script>
</body>
</html>
