plugins { id 'com.android.application' }

android {
    namespace 'com.istanbulunhavasi.widget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.istanbulunhavasi.widget'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
