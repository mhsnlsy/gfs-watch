# GFS Watch - always-on background worker
app = 'gfs-watch'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[processes]
  worker = "python -u main.py"

[[mounts]]
  source = "gfs_data"
  destination = "/data"
  initial_size = "1GB"

[[vm]]
  processes = ["worker"]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
