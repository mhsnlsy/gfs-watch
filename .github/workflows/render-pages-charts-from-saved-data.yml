name: Re-render latest Pages charts from saved data

on:
  push:
    branches: [main]
    paths:
      - "scripts/rebuild_latest_pages_charts_from_saved_data.py"
      - ".github/workflows/render-pages-charts-from-saved-data.yml"

permissions:
  contents: write

concurrency:
  group: render-pages-charts-from-saved-data
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          path: source
      - name: Check out published GFS state
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: state
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
      - name: Install Python dependencies
        working-directory: source
        run: python -m pip install -r requirements.txt
      - name: Render four charts from saved SQLite data only
        working-directory: source
        env:
          DB_PATH: ${{ github.workspace }}/state/gfs_watch.db
          PUBLIC_DATA_DIR: ${{ github.workspace }}/state/public
        run: python scripts/rebuild_latest_pages_charts_from_saved_data.py
      - name: Publish only chart images and notification manifest
        working-directory: state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/notifications/media public/notifications/latest.json
          if git diff --cached --quiet; then
            echo 'Rendered charts are unchanged.'
            exit 0
          fi
          git commit -m 'Apply larger typography to latest Pages charts'
          for attempt in 1 2 3; do
            if git push origin HEAD:gfs-watch-state; then
              echo 'Updated chart PNGs published.'
              exit 0
            fi
            git fetch origin gfs-watch-state
            git rebase origin/gfs-watch-state
          done
          echo 'Could not publish chart images after three attempts.'
          exit 1
