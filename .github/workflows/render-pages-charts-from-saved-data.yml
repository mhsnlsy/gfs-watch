name: Re-render latest Pages charts from saved data
# Rebuild after full chart-layout reset; preserve the existing typography.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: render-pages-charts-from-saved-data
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          path: source
      - name: Check out published GFS state
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: state
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Install Python dependencies
        working-directory: source
        run: python -m pip install -r requirements.txt
      - name: Render four charts from saved SQLite data only
        working-directory: source
        env:
          DB_PATH: ${{ github.workspace }}/state/gfs_watch.db
          PUBLIC_DATA_DIR: ${{ github.workspace }}/state/public
        run: python scripts/rebuild_latest_pages_charts_from_saved_data.py
      - name: Publish only chart images and notification manifest
        working-directory: state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/notifications/media public/notifications/latest.json
          if git diff --cached --quiet; then
            echo 'Rendered charts are unchanged.'
            exit 0
          fi
          git commit -m 'Backfill 850 hPa data and rebuild Pages charts'

          # NOAA backfill updates the local SQLite file, but only chart assets and
          # the notification manifest are published by this workflow. Stash those
          # temporary DB changes before rebasing over concurrent state-branch pushes.
          git stash push --quiet -m 'temporary NOAA backfill database changes' || true

          for attempt in 1 2 3; do
            if git push origin HEAD:gfs-watch-state; then
              echo 'Updated chart PNGs published.'
              git stash drop --quiet || true
              exit 0
            fi

            echo "Push attempt $attempt raced with another state-branch update; rebasing."
            git fetch origin gfs-watch-state
            if ! git rebase origin/gfs-watch-state; then
              git rebase --abort || true
              git stash drop --quiet || true
              echo 'Chart publication rebase failed; no unrelated state files were overwritten.'
              exit 1
            fi
          done

          git stash drop --quiet || true
          echo 'Could not publish chart images after three attempts.'
          exit 1

