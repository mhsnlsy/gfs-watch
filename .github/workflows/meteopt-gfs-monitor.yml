name: MeteoPT GFS Cycle Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      resend_charts:
        description: Son dört döngünün grafiklerini beyaz yazıyla yeniden gönder
        type: boolean
        default: false
      manual_run_id:
        description: Tek seferlik Telegram raporu için UTC GFS döngüsü (örn. 2026-11-02T18:00:00+00:00)
        type: string
        required: false
      manual_media_only:
        description: Metin daha önce gönderildiyse yalnızca eksik görsel ve sesi gönder
        type: boolean
        default: false
      manual_image_only:
        description: Tek seferlik düzeltme için yalnızca karşılaştırma görselini gönder
        type: boolean
        default: false
  repository_dispatch:
    types: [gfs-watch-backup]

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  check-gfs:
    name: Discover, prefetch and report every completed GFS cycle
    concurrency:
      group: gfs-watch-run-v6
      cancel-in-progress: false
    outputs:
      gfs_updated: ${{ steps.report.outputs.gfs_updated }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore GFS run and Pages notification history
        run: |
          git fetch origin gfs-watch-state
          if git cat-file -e origin/gfs-watch-state:gfs_watch.db 2>/dev/null; then
            git show origin/gfs-watch-state:gfs_watch.db > gfs_watch.db
          fi
          if git cat-file -e origin/gfs-watch-state:public/latest.json 2>/dev/null; then
            git archive origin/gfs-watch-state public | tar -x -C .
            echo "Previous Pages forecast, run archive and notification media restored."
          else
            mkdir -p public
            echo "No previous Pages forecast exists; the next completed GFS cycle will create it."
          fi
      - name: Record latest processed GFS cycle and public-data fingerprint
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import sqlite3
          try:
              with sqlite3.connect("file:gfs_watch.db?mode=ro", uri=True) as db:
                  row = db.execute("SELECT MAX(run_name) FROM gfs_runs_v3").fetchone()
                  run_id = row[0] or "none"
          except sqlite3.Error:
              run_id = "none"
          digest = hashlib.sha256()
          root = pathlib.Path("public")
          if root.exists():
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  digest.update(path.relative_to(root).as_posix().encode())
                  digest.update(path.read_bytes())
          fingerprint = digest.hexdigest()
          with open(os.path.join(os.environ["RUNNER_TEMP"], "gfs-before-run.txt"), "w") as output:
              output.write(run_id)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "gfs-before-public.txt"), "w") as output:
              output.write(fingerprint)
          print(f"Previously processed latest GFS cycle: {run_id}")
          print(f"Previously published public-data fingerprint: {fingerprint}")
          PY
      - name: Announce source-discovery cadence
        run: |
          echo "MeteoPT is queried for its active GFS run on every 10-minute scheduled invocation."
      - name: Confirm this is a scheduled or watchdog dispatch
        run: |
          echo "Trigger event: ${{ github.event_name }}"
          echo "Workflow ref: ${{ github.ref }}"
          echo "Workflow SHA: ${{ github.sha }}"
      - name: Watch active MeteoPT cycle; publish f180 to Pages and Telegram
        id: check-gfs
        env:
          GFS_SOURCE: meteopt
          GFS_TELEGRAM: "1"
          GFS_WATCH_ONCE: "1"
          GFS_WATCH_CONTINUOUS: "0"
          GFS_WATCH_WINDOW_MINUTES: "1"
          GFS_WATCH_POLL_SECONDS: "600"
          GFS_WATCH_TARGET_RUN_ID: ""
          GFS_WATCH_RESEND_CHARTS: ${{ github.event_name == 'workflow_dispatch' && inputs.resend_charts && '1' || '0' }}
          GFS_WATCH_MANUAL_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_run_id || '' }}
          GFS_WATCH_MANUAL_MEDIA_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_media_only || false }}
          GFS_WATCH_MANUAL_IMAGE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_image_only || false }}
          DB_PATH: gfs_watch.db
          PUBLIC_DATA_DIR: public
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python -u main.py
      - name: Rebuild missing Pages weather report from the current GFS cycle
        if: steps.check-gfs.outcome == 'success'
        env:
          DB_PATH: gfs_watch.db
          PUBLIC_DATA_DIR: public
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path("public/latest.json").read_text(encoding="utf-8"))
          manifest_path = Path("public/notifications/latest.json")
          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              items = manifest.get("items", [])
              item = items[0] if items else {}
              valid = (
                  manifest.get("schema") == "gfs-watch.notifications.v1"
                  and item.get("run_id_utc") == latest.get("run_id_utc")
                  and bool(item.get("summary", "").strip())
                  and bool(item.get("report_text", "").strip())
              )
          except (OSError, ValueError, TypeError, AttributeError):
              valid = False
          print("Current Pages report is valid." if valid else "Pages report missing/stale; rebuilding.")
          raise SystemExit(0 if valid else 1)
          PY
          then
            echo "No report repair needed."
          else
            python -u scripts/rebuild_missing_pages_report.py
          fi
      - name: Detect newly generated GFS report
        id: report
        if: always() && steps.check-gfs.outcome == 'success'
        run: |
          before="$(cat "$RUNNER_TEMP/gfs-before-run.txt")"
          after="$(python - <<'PY'
          import sqlite3
          try:
              with sqlite3.connect("file:gfs_watch.db?mode=ro", uri=True) as db:
                  row = db.execute("SELECT MAX(run_name) FROM gfs_runs_v3").fetchone()
                  print(row[0] or "none")
          except sqlite3.Error:
              print("none")
          PY
          )"
          public_before="$(cat "$RUNNER_TEMP/gfs-before-public.txt")"
          public_after="$(python - <<'PY'
          import hashlib
          import pathlib
          digest = hashlib.sha256()
          root = pathlib.Path("public")
          if root.exists():
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  digest.update(path.relative_to(root).as_posix().encode())
                  digest.update(path.read_bytes())
          print(digest.hexdigest())
          PY
          )"
          if [ "$after" != "none" ] && [ "$after" != "$before" ]; then
            echo "gfs_updated=true" >> "$GITHUB_OUTPUT"
            echo "New GFS cycle processed: $after"
          elif [ "$public_after" != "$public_before" ]; then
            echo "gfs_updated=true" >> "$GITHUB_OUTPUT"
            echo "Public forecast/report payload changed; Pages deployment is required."
          else
            echo "gfs_updated=false" >> "$GITHUB_OUTPUT"
            echo "No new GFS cycle or public forecast payload was generated in this session."
          fi
      - name: Save GFS run history
        if: always()
        run: |
          if [ ! -f gfs_watch.db ]; then
            echo "GFS database missing; nothing to save."
            exit 0
          fi
          cp gfs_watch.db "$RUNNER_TEMP/gfs_watch.db"
          if [ -d public/staging ]; then
            mkdir -p "$RUNNER_TEMP/gfs-staging"
            cp -a public/staging/. "$RUNNER_TEMP/gfs-staging/"
          fi
          mkdir -p "$RUNNER_TEMP/public"
          report_ok=0
          if [ "${{ steps.check-gfs.outcome }}" = "success" ] && [ -d public ]; then
            cp -a public/. "$RUNNER_TEMP/public/"
            report_ok=1
          else
            echo "Report step failed; keeping the previously published Pages forecast and notification archive."
          fi
          rm -rf public
          git checkout -B gfs-watch-state origin/gfs-watch-state
          mkdir -p public/runs
          if [ "$report_ok" = "1" ]; then
            if [ -d "$RUNNER_TEMP/public/notifications" ]; then
              rm -rf public/notifications
            fi
            cp -a "$RUNNER_TEMP/public/." public/
          fi
          find public/runs -type f -name '*.json' -mtime +16 -delete
          cp "$RUNNER_TEMP/gfs_watch.db" gfs_watch.db
          if [ -d "$RUNNER_TEMP/gfs-staging" ]; then
            mkdir -p public/staging
            cp -a "$RUNNER_TEMP/gfs-staging/." public/staging/
          fi
          git add -f gfs_watch.db public
          if git diff --cached --quiet; then
            echo "GFS run history has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GFS run history"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin gfs-watch-state
            if git push origin gfs-watch-state; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish GFS run history after five attempts."
          exit 1
