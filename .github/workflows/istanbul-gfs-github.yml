name: Istanbul GFS · MeteoPT

on:
  push:
    branches: [main]
  # Poll every 5 minutes so a newly available F180 is published immediately.
  # The fetcher checks all four GFS cycles and publishes only the newest
  # previously unpublished F180-ready cycle.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: istanbul-gfs-canonical-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Fetch, build and publish one canonical GFS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out application source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Check out canonical GFS data branch
        uses: actions/checkout@v5
        with:
          ref: istanbul-gfs-data
          path: gfs-state
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install report and Telegram dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore canonical GFS history
        run: |
          set -euo pipefail
          mkdir -p gfs
          if [ -d gfs-state/gfs ]; then
            cp -a gfs-state/gfs/. gfs/
          fi
          mkdir -p gfs/runs gfs/notifications/telegram-sent

      - name: Validate GFS publisher code and architecture contracts
        run: |
          python -m py_compile \
            scripts/fetch_istanbul_gfs_meteopt.py \
            scripts/build_istanbul_gfs_publication.py \
            scripts/send_canonical_istanbul_gfs_telegram.py
          python scripts/test_notification_pipeline.py

      - name: Check MeteoPT cycles and apply F180 gate
        id: fetch
        run: python scripts/fetch_istanbul_gfs_meteopt.py

      - name: Commit new F72 milestone independently
        if: steps.fetch.outputs.f72_publish == 'true'
        working-directory: gfs-state
        env:
          GFS_RUN_ID: ${{ steps.fetch.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p gfs/milestones/f72
          cp -a "${GITHUB_WORKSPACE}/gfs/milestones/f72/." gfs/milestones/f72/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfs/milestones/f72
          if git diff --cached --quiet; then
            echo "F72 milestone already archived."
          else
            git commit -m "Publish Istanbul GFS F72 milestone ${GFS_RUN_ID}"
            git push origin HEAD:istanbul-gfs-data
          fi

      - name: Build report, four comparison PNGs and Pages bundle
        if: steps.fetch.outputs.publish == 'true'
        run: python scripts/build_istanbul_gfs_publication.py

      - name: Commit canonical GFS archive before notification
        if: steps.fetch.outputs.publish == 'true'
        working-directory: gfs-state
        env:
          GFS_RUN_ID: ${{ steps.fetch.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p gfs
          rsync -a "${GITHUB_WORKSPACE}/gfs/" gfs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfs
          if git diff --cached --quiet; then
            echo "Canonical GFS branch already contains this publication."
          else
            git commit -m "Publish Istanbul GFS bundle ${GFS_RUN_ID}"
            git push origin HEAD:istanbul-gfs-data
          fi

      - name: Send the exact canonical report and four PNGs to Telegram
        if: steps.fetch.outputs.publish == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -euo pipefail
          python scripts/send_canonical_istanbul_gfs_telegram.py
          test -s "gfs/notifications/telegram-sent/${{ steps.fetch.outputs.run_id }}.json"

      - name: Commit Telegram delivery marker
        if: steps.fetch.outputs.publish == 'true'
        working-directory: gfs-state
        env:
          GFS_RUN_ID: ${{ steps.fetch.outputs.run_id }}
        run: |
          set -euo pipefail
          cp -a "${GITHUB_WORKSPACE}/gfs/notifications/telegram-sent/." gfs/notifications/telegram-sent/
          git add gfs/notifications/telegram-sent
          if git diff --cached --quiet; then
            echo "Telegram delivery marker already present."
          else
            git commit -m "Mark Istanbul GFS Telegram delivery ${GFS_RUN_ID}"
            git push origin HEAD:istanbul-gfs-data
          fi

      - name: Trigger the single GitHub Pages publisher
        if: steps.fetch.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-live-site.yml --ref main

      - name: Trigger Pages for a new F72 milestone
        if: steps.fetch.outputs.f72_publish == 'true' && steps.fetch.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-live-site.yml --ref main

      - name: Report no-op poll
        if: steps.fetch.outputs.publish != 'true' && steps.fetch.outputs.f72_publish != 'true'
        run: |
          echo "No new F72/F180 milestone. Existing Pages and Telegram publication remain unchanged."
          echo "Reason: ${{ steps.fetch.outputs.reason }}"
