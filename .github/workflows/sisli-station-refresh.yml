name: MGM Şişli Station Refresh

# Independent five-minute polling chain. This workflow owns only Şişli files.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sisli-station-refresh.yml"
      - "scripts/sisli_weather.mjs"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sisli-weather-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out published station data
        uses: actions/checkout@v4
        with:
          ref: sisli-state
          path: forecast-data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch MGM Şişli 18401 observation
        id: scrape
        run: |
          set -euo pipefail
          mkdir -p public forecast-data/public
          node scripts/sisli_weather.mjs
          test -s public/sisli-station-observation.json
          AGE=$(jq -r '.station_observation.age_minutes // 999' public/sisli-station-observation.json)
          TEMP=$(jq -r '.station_observation.temperature_2m_c' public/sisli-station-observation.json)
          echo "MGM Şişli 18401: $AGE min · $TEMP C"
          if [ "$AGE" -gt 20 ]; then
            echo "Şişli observation stale; previous published data will be preserved."
            exit 1
          fi
          if [ "$TEMP" = "null" ]; then
            echo "Şişli temperature missing; previous published data will be preserved."
            exit 1
          fi
        env:
          SISLI_TEMPERATURE_HISTORY_PATH: forecast-data/public/sisli-station-temperature-history.json
          SISLI_RAIN_HISTORY_PATH: forecast-data/public/sisli-station-rain-history.json

      - name: Publish only Şişli observation and history
        id: publish
        if: steps.scrape.outcome == 'success'
        run: |
          set -euo pipefail
          cp -f public/sisli-station-observation.json forecast-data/public/
          # History files are written directly into forecast-data/public by the scraper.
          test -s forecast-data/public/sisli-station-temperature-history.json
          test -s forecast-data/public/sisli-station-rain-history.json
          cd forecast-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sisli-station-observation.json public/sisli-station-temperature-history.json public/sisli-station-rain-history.json
          if git diff --cached --quiet; then
            echo "No Şişli data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unexpected="$(git diff --cached --name-only | grep -Ev '^(public/sisli-station-observation\.json|public/sisli-station-temperature-history\.json|public/sisli-station-rain-history\.json)
          git push origin HEAD:sisli-state
          echo "Şişli data pushed to dedicated sisli-state."
          echo "changed=true" >> "$GITHUB_OUTPUT"
 || true)"
          if [ -n "$unexpected" ]; then
            echo "Şişli publication contains files outside its allowlist:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git commit -m "Refresh MGM Şişli station observation [$(date -u +%H:%M)]"
          git push origin HEAD:sisli-state
          echo "Şişli data pushed to dedicated sisli-state."
          echo "changed=true" >> "$GITHUB_OUTPUT"
