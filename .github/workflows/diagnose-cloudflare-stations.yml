name: Diagnose Cloudflare Station API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cloudflare-stations.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Inspect remote D1 table schemas
        working-directory: station-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          D1_ID="$(node - "$RUNNER_TEMP/d1-list.json" <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          function find(value) {
            if (!value) return null;
            if (Array.isArray(value)) {
              for (const item of value) { const found = find(item); if (found) return found; }
              return null;
            }
            if (typeof value !== "object") return null;
            const name = value.name || value.database_name || value.databaseName;
            const id = value.uuid || value.database_id || value.databaseId;
            if (name === "gfs-watch-stations" && id) return String(id);
            for (const child of Object.values(value)) { const found = find(child); if (found) return found; }
            return null;
          }
          const id = find(data);
          if (id) process.stdout.write(id);
          NODE
          )"
          test -n "$D1_ID"
          node - "$D1_ID" wrangler.jsonc <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const binding = (config.d1_databases || []).find(item => item.database_name === "gfs-watch-stations");
          if (!binding) throw new Error("STATIONS_DB binding not found");
          binding.database_id = process.argv[2];
          fs.writeFileSync(process.argv[3], JSON.stringify(config, null, 2));
          NODE
          echo "===== station_history schema ====="
          wrangler d1 execute gfs-watch-stations --remote --config wrangler.jsonc --command "PRAGMA table_info(station_history);" --json
          echo "===== station_current schema ====="
          wrangler d1 execute gfs-watch-stations --remote --config wrangler.jsonc --command "PRAGMA table_info(station_current);" --json

      - name: Inspect ENKA WeatherLink Current Values HTML
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://w.enka.com/weather/currentvalues.html?_diag=" + Date.now(), {
            headers: { "User-Agent": "Mozilla/5.0", "Cache-Control": "no-cache" }
          });
          const html = await response.text();
          console.log("ENKA HTTP:", response.status, "| bytes:", html.length);
          const strip = value => value.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, " ")
            .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, " ")
            .replace(/<[^>]+>/g, " ").replace(/&nbsp;|&#160;/gi, " ")
            .replace(/&deg;|&#176;/gi, "°").replace(/&amp;/gi, "&")
            .replace(/\s+/g, " ").trim();
          const rows = [...html.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)].map(match =>
            [...match[1].matchAll(/<(?:td|th)\b[^>]*>([\s\S]*?)<\/(?:td|th)>/gi)].map(cell => strip(cell[1]))
          ).filter(row => row.length);
          for (const row of rows) {
            const value = row.join(" | ");
            if (/Current Value|Day Temperature|Barometer|Humidity|Wind\b|As of/i.test(value)) {
              console.log("ENKA TABLE ROW:", value.slice(0, 500));
            }
          }
          const plain = strip(html);
          for (const label of ["As of", "Day Temperature", "Barometer", "Humidity", "Wind"]) {
            const index = plain.toLowerCase().indexOf(label.toLowerCase());
            console.log("ENKA TEXT", label, "=>", index < 0 ? "NOT FOUND" : plain.slice(Math.max(0,index-60),index+240));
          }
          NODE
      - name: Read Cloudflare station API health
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 15 "https://gfs-watch-stations.muhsin-ulusoy.workers.dev/api/health?diagnostic=$(date +%s)" | tee "$RUNNER_TEMP/health.json"
          node - "$RUNNER_TEMP/health.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("Worker:", doc.service, "| storage:", doc.storage, "| cron:", doc.cron, "| pressure-fallback-check:", new Date().toISOString());
          for (const station of doc.stations || []) {
            console.log(station.key, "|", station.status, "| success:", station.last_success_utc,
              "| attempt:", station.last_attempt_utc, "| error:", station.last_error || "none");
          }
          NODE

          for key in enka eyupsultan sisli; do
            echo "===== D1 72-hour history: $key ====="
            curl --silent --show-error --fail --max-time 15 "https://gfs-watch-stations.muhsin-ulusoy.workers.dev/api/history/$key?hours=72&diagnostic=$(date +%s)" |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s);console.log(JSON.stringify({ok:d.ok,station_key:d.station_key,count:d.count,first:d.samples?.[0]?.observed_at_utc,last:d.samples?.at(-1)?.observed_at_utc,first_temperature:d.samples?.[0]?.temperature_c,last_temperature:d.samples?.at(-1)?.temperature_c}));});'
          done

          echo "===== Current station values ====="
          curl --silent --show-error --fail --max-time 15 "https://gfs-watch-stations.muhsin-ulusoy.workers.dev/api/stations?diagnostic=$(date +%s)" |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s);for(const x of d.stations||[])console.log(JSON.stringify({station_key:x.station_key,status:x.status,observed_at_utc:x.observed_at_utc,temperature_c:x.temperature_c,humidity_percent:x.humidity_percent,pressure_hpa:x.pressure_hpa,wind_speed_kmh:x.wind_speed_kmh,wind_direction_cardinal:x.wind_direction_cardinal,rain_1h_mm:x.rain_1h_mm,last_error:x.last_error}));});'
