name: Diagnose Cloudflare Station API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cloudflare-stations.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Inspect remote D1 table schemas
        working-directory: station-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "===== station_history schema ====="
          wrangler d1 execute gfs-watch-stations --remote --command "PRAGMA table_info(station_history);" --json
          echo "===== station_current schema ====="
          wrangler d1 execute gfs-watch-stations --remote --command "PRAGMA table_info(station_current);" --json

      - name: Read Cloudflare station API health
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 15 "https://gfs-watch-stations.muhsin-ulusoy.workers.dev/api/health?diagnostic=$(date +%s)" | tee "$RUNNER_TEMP/health.json"
          node - "$RUNNER_TEMP/health.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("Worker:", doc.service, "| storage:", doc.storage, "| cron:", doc.cron);
          for (const station of doc.stations || []) {
            console.log(station.key, "|", station.status, "| success:", station.last_success_utc,
              "| attempt:", station.last_attempt_utc, "| error:", station.last_error || "none");
          }
          NODE
