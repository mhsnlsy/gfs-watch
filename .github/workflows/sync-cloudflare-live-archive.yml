name: Sync Live Archives to Cloudflare R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-live-archive-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Upload changed data branch assets to R2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out shared forecast archive
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/gfs-watch-state'
        uses: actions/checkout@v5
        with:
          ref: gfs-watch-state
          path: forecast-data
          fetch-depth: 1

      - name: Check out Istanbul GFS archive
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/istanbul-gfs-data'
        uses: actions/checkout@v5
        with:
          ref: istanbul-gfs-data
          path: istanbul-gfs-data
          fetch-depth: 1

      - name: Check out Köy GFS archive
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/koy-gfs-data'
        uses: actions/checkout@v5
        with:
          ref: koy-gfs-data
          path: koy-data
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Ensure R2 bucket and upload archives
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: gfs-watch-live-archive
        run: |
          set -euo pipefail

          if ! wrangler r2 bucket list > "$RUNNER_TEMP/r2-buckets.txt"; then
            echo "::error::Create GitHub secret CLOUDFLARE_R2_API_TOKEN using an account-scoped Cloudflare API token with Workers R2 Storage: Edit permission."
            exit 1
          fi
          if ! grep -Fq "$R2_BUCKET" "$RUNNER_TEMP/r2-buckets.txt"; then
            wrangler r2 bucket create "$R2_BUCKET"
          fi

          uploaded=0
          upload_tree() {
            local source="$1"
            local prefix="$2"
            local file relative key mime cache_control
            [ -d "$source" ] || return 0
            while IFS= read -r -d '' file; do
              relative="${file#"$source"/}"
              key="$prefix/$relative"
              mime="$(file --brief --mime-type "$file")"
              cache_control="public, max-age=3600, s-maxage=86400"
              case "$key" in
                *.json|*/latest.json|*/comparison.json)
                  cache_control="no-store, max-age=0"
                  ;;
              esac
              wrangler r2 object put "$R2_BUCKET/$key" \
                --file "$file" \
                --remote \
                --content-type "$mime" \
                --cache-control "$cache_control" \
                --force
              uploaded=$((uploaded + 1))
            done < <(find "$source" -type f -print0)
          }

          upload_file() {
            local source="$1"
            local key="$2"
            [ -s "$source" ] || return 0
            local mime cache_control
            mime="$(file --brief --mime-type "$source")"
            cache_control="no-store, max-age=0"
            wrangler r2 object put "$R2_BUCKET/$key" \
              --file "$source" \
              --remote \
              --content-type "$mime" \
              --cache-control "$cache_control" \
              --force
            uploaded=$((uploaded + 1))
          }

          upload_tree "forecast-data/public/ecmwf" "data/ecmwf"
          upload_file "istanbul-gfs-data/gfs/latest.json" "data/istanbul-gfs-latest.json"
          upload_file "istanbul-gfs-data/gfs/comparison.json" "data/istanbul-gfs-comparison.json"
          upload_tree "istanbul-gfs-data/gfs/notifications" "data/notifications"
          upload_tree "koy-data/gfs" "koy-data/gfs"

          if [ "$uploaded" -eq 0 ]; then
            echo "::error::No archive files were uploaded. Check the selected branch and source directories."
            exit 1
          fi
          echo "Uploaded $uploaded archive files to $R2_BUCKET."

          # Verify a representative key whenever the relevant source was checked out.
          if [ -s "forecast-data/public/ecmwf/latest.json" ]; then
            wrangler r2 object get "$R2_BUCKET/data/ecmwf/latest.json" \
              --file "$RUNNER_TEMP/ecmwf-latest.json" --remote
            cmp -s "forecast-data/public/ecmwf/latest.json" "$RUNNER_TEMP/ecmwf-latest.json"
            echo "Verified ECMWF latest.json byte-for-byte in R2."
          fi
          if [ -s "istanbul-gfs-data/gfs/latest.json" ]; then
            wrangler r2 object get "$R2_BUCKET/data/istanbul-gfs-latest.json" \
              --file "$RUNNER_TEMP/istanbul-gfs-latest.json" --remote
            cmp -s "istanbul-gfs-data/gfs/latest.json" "$RUNNER_TEMP/istanbul-gfs-latest.json"
            echo "Verified Istanbul GFS latest.json byte-for-byte in R2."
          fi
