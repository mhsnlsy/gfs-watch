name: Radar Monitor 10m (manual diagnostic)

# Scheduled execution is handled by radar-monitor.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Manual radar diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow numpy
      - name: Run Istanbul radar check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RADAR_STATE_PATH: ${{ github.workspace }}/radar_state.json
          RADAR_ALERT_STATE_PATH: ${{ github.workspace }}/radar_alert_state.json
          RADAR_CHECK_LOG_PATH: ${{ github.workspace }}/radar_checks.jsonl
        run: python -u radar_monitor.py
