name: Daily Tomorrow Weather Web Push

on:
  schedule:
    # 19:45 Europe/Istanbul = 16:45 UTC (Türkiye is UTC+3).
    - cron: "45 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-tomorrow-weather-push
  cancel-in-progress: false

jobs:
  send:
    if: ${{ vars.PUSH_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out application code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build tomorrow weather notification from 12Z GFS
        env:
          TOMORROW_NOTIFICATION_FEED: tmp/tomorrow-weather-notification.json
        run: node scripts/build_tomorrow_weather_notification.mjs

      - name: Install Web Push sender
        working-directory: push-worker
        run: npm install --no-package-lock --ignore-scripts

      - name: Send Web Push
        working-directory: push-worker
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NOTIFICATION_FEED_PATH: ../tmp/tomorrow-weather-notification.json
          VAPID_SUBJECT: "https://gfs-watch-web.muhsin-ulusoy.workers.dev/"
        run: node send-notification.mjs