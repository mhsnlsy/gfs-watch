name: Deploy Cloudflare Platform

on:
  push:
    branches: [main, istanbul-gfs-data, gfs-watch-state, koy-mgm-data]
    paths:
      - ".github/workflows/deploy-cloudflare-platform.yml"
      - "site/**"
      - "web-worker/**"
      - "gfs/notifications/**"
      - "!gfs/notifications/telegram-sent/**"
      - "public/ecmwf/**"
      - "mgm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-platform-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare website + Static Assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out application source
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Check out Istanbul GFS publication archive
        uses: actions/checkout@v5
        with:
          ref: istanbul-gfs-data
          path: istanbul-gfs-data
          fetch-depth: 1

      - name: Check out shared forecast cache
        uses: actions/checkout@v5
        with:
          ref: gfs-watch-state
          path: forecast-data
          fetch-depth: 1

      - name: Check out Köy GFS archive
        uses: actions/checkout@v5
        with:
          ref: koy-gfs-data
          path: koy-data
          fetch-depth: 1

      - name: Check out Köy MGM archive
        uses: actions/checkout@v5
        with:
          ref: koy-mgm-data
          path: koy-mgm-data
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Assemble production static assets
        working-directory: source
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
        run: |
          set -euo pipefail
          rm -rf web-worker/public
          mkdir -p web-worker/public/data
          cp -a site/. web-worker/public/

          # Keep the existing public forecast-verification and ECMWF assets.
          if [ -d "$GITHUB_WORKSPACE/forecast-data/public" ]; then
            cp -a "$GITHUB_WORKSPACE/forecast-data/public/." web-worker/public/data/
          fi

          # Keep the latest archived report and its image files available on the
          # existing notification URLs while live GFS values move to D1.
          if [ -s "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/latest.json" ]; then
            cp "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/latest.json" web-worker/public/data/istanbul-gfs-latest.json
          elif [ -s web-worker/public/data/latest.json ]; then
            cp web-worker/public/data/latest.json web-worker/public/data/istanbul-gfs-latest.json
          fi
          if [ -d "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" ]; then
            rm -rf web-worker/public/data/notifications
            cp -a "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" web-worker/public/data/
          fi

          # Do not ship station snapshots; station observations are API-only.
          rm -f \
            web-worker/public/data/station-observation.json \
            web-worker/public/data/station-temperature-history.json \
            web-worker/public/data/eyupsultan-station-observation.json \
            web-worker/public/data/eyupsultan-station-temperature-history.json \
            web-worker/public/data/eyupsultan-station-rain-history.json \
            web-worker/public/data/sisli-station-observation.json \
            web-worker/public/data/sisli-station-temperature-history.json \
            web-worker/public/data/sisli-station-rain-history.json

          mkdir -p web-worker/public/koy-data
          if [ -d "$GITHUB_WORKSPACE/koy-data/gfs" ]; then
            cp -a "$GITHUB_WORKSPACE/koy-data/gfs" web-worker/public/koy-data/
          fi
          if [ -d "$GITHUB_WORKSPACE/koy-mgm-data/mgm" ]; then
            mkdir -p web-worker/public/koy-data/mgm
            cp -a "$GITHUB_WORKSPACE/koy-mgm-data/mgm/." web-worker/public/koy-data/mgm/
          fi

          printf '{"apiBaseUrl":"%s"}' "$PUSH_API_URL" > web-worker/public/push-config.json
          touch web-worker/public/.nojekyll
          test -s web-worker/public/index.html
          test -s web-worker/public/koy.html
          test -s web-worker/public/gfs-cycle-compare.html
          echo "Static asset count: $(find web-worker/public -type f | wc -l)"

      - name: Deploy Cloudflare Worker + Static Assets
        working-directory: source/web-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Verify Cloudflare website and proxied APIs
        env:
          WEB: https://gfs-watch-web.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 "$WEB/__health?check=$(date +%s)" -o "$RUNNER_TEMP/web-health.json"
          node - "$RUNNER_TEMP/web-health.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (doc.ok !== true || doc.service !== "gfs-watch-web" ||
              doc.delivery !== "Cloudflare Workers Static Assets" ||
              doc.api_gateway !== "Cloudflare Service Bindings" ||
              Object.values(doc.bindings || {}).some(value => value !== true)) {
            throw new Error("Cloudflare web Worker/static assets/service bindings health contract failed");
          }
          console.log(JSON.stringify(doc));
          NODE

          for path in / /koy.html /gfs-cycle-compare.html /gfs-api-config.js /data/ecmwf/latest.json; do
            curl --silent --show-error --fail --max-time 20 "$WEB$path" -o /dev/null
            echo "OK $path"
          done

          echo "Checking Istanbul GFS through internal Service Binding..."
          curl --silent --show-error --fail --max-time 45 "$WEB/gfs/latest?check=$(date +%s)" -o "$RUNNER_TEMP/web-gfs.json"
          echo "Checking Köy GFS through internal Service Binding..."
          curl --silent --show-error --fail --max-time 45 "$WEB/api/koy-gfs/f72?check=$(date +%s)" -o "$RUNNER_TEMP/web-koy.json"
          echo "Checking station D1 health through internal Service Binding..."
          curl --silent --show-error --fail --max-time 20 "$WEB/api/stations/health?check=$(date +%s)" -o "$RUNNER_TEMP/web-stations-health.json"
          curl --silent --show-error --fail --max-time 20 "$WEB/api/stations?check=$(date +%s)" -o "$RUNNER_TEMP/web-stations.json"
          curl --silent --show-error --fail --max-time 20 "$WEB/api/history/canakci?hours=72&check=$(date +%s)" -o "$RUNNER_TEMP/web-station-history.json"
          node - "$RUNNER_TEMP/web-gfs.json" "$RUNNER_TEMP/web-koy.json" "$RUNNER_TEMP/web-stations-health.json" "$RUNNER_TEMP/web-stations.json" "$RUNNER_TEMP/web-station-history.json" <<'NODE'
          const fs = require("fs");
          const [gfs, koy, health, stations, history] = process.argv.slice(2).map(file => JSON.parse(fs.readFileSync(file, "utf8")));
          if (gfs.schema !== "gfs-watch.forecast.v1" || !Array.isArray(gfs.comparison_runs) ||
              !Array.isArray(gfs.forecast_6_hourly) || gfs.forecast_6_hourly.length < 40) {
            throw new Error("Istanbul GFS gateway failed");
          }
          if (!Array.isArray(koy.forecast_6_hourly) || koy.forecast_6_hourly.length < 12) throw new Error("Köy GFS gateway failed");
          if (health.ok !== true || health.storage !== "D1" || health.cron !== "*/2 * * * *") throw new Error("Station D1 health gateway failed");
          if (stations.ok !== true || !Array.isArray(stations.stations) || stations.stations.length < 4) throw new Error("Station current values gateway failed");
          if (history.ok !== true || !Array.isArray(history.samples)) throw new Error("Station history gateway failed");
          console.log(JSON.stringify({
            istanbul_run: gfs.run_id_utc,
            istanbul_comparison_runs: gfs.comparison_runs.length,
            koy_run: koy.run_id_utc,
            koy_points: koy.forecast_6_hourly.length,
            station_count: stations.stations.length,
            canakci_history_samples: history.samples.length
          }));
          NODE
