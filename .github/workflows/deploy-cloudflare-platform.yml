name: Deploy Cloudflare Platform

on:
  # Production runtime is Cloudflare-native. GitHub only deploys code from main.
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare-platform.yml"
      - "site/**"
      - "assets/brand/**"
      - "scripts/build_site_icons.py"
      - "web-worker/**"
      - "gfs/notifications/**"
      - "gfs/**"
      - "!gfs/notifications/telegram-sent/**"
      - "mgm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-platform-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare website + Static Assets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out application source
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Check out Istanbul GFS publication archive
        uses: actions/checkout@v5
        with:
          ref: istanbul-gfs-data
          path: istanbul-gfs-data
          fetch-depth: 1

      - name: Check out shared forecast cache
        uses: actions/checkout@v5
        with:
          ref: gfs-watch-state
          path: forecast-data
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Assemble production static assets
        working-directory: source
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
        run: |
          set -euo pipefail
          rm -rf web-worker/public
          mkdir -p web-worker/public/data
          cp -a site/. web-worker/public/

          # Rebuild every favicon, Apple touch icon and PWA icon from the
          # approved single-source Istanbul logo on every production deploy.
          python -m pip install --disable-pip-version-check --quiet Pillow
          python scripts/build_site_icons.py assets/brand web-worker/public

          # Keep the existing public forecast-verification and ECMWF assets.
          if [ -d "$GITHUB_WORKSPACE/forecast-data/public" ]; then
            cp -a "$GITHUB_WORKSPACE/forecast-data/public/." web-worker/public/data/
          fi

          # Keep the latest archived report and its image files available on the
          # existing notification URLs while live GFS values move to D1.
          if [ -s "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/latest.json" ]; then
            cp "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/latest.json" web-worker/public/data/istanbul-gfs-latest.json
          elif [ -s web-worker/public/data/latest.json ]; then
            cp web-worker/public/data/latest.json web-worker/public/data/istanbul-gfs-latest.json
          fi
          if [ -d "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" ]; then
            rm -rf web-worker/public/data/notifications
            cp -a "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" web-worker/public/data/
          fi

          # Do not ship station snapshots; station observations are API-only.
          rm -f \
            web-worker/public/data/station-observation.json \
            web-worker/public/data/station-temperature-history.json \
            web-worker/public/data/eyupsultan-station-observation.json \
            web-worker/public/data/eyupsultan-station-temperature-history.json \
            web-worker/public/data/eyupsultan-station-rain-history.json \
            web-worker/public/data/sisli-station-observation.json \
            web-worker/public/data/sisli-station-temperature-history.json \
            web-worker/public/data/sisli-station-rain-history.json

          printf '{"apiBaseUrl":"%s"}' "$PUSH_API_URL" > web-worker/public/push-config.json
          touch web-worker/public/.nojekyll
          test -s web-worker/public/index.html
          test -s web-worker/public/koy.html
          echo "Static asset count: $(find web-worker/public -type f | wc -l)"

      - name: Ensure R2 archive bucket and upload legacy archives (optional)
        working-directory: source/web-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: gfs-watch-live-archive
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            node - wrangler.jsonc <<'NODE'
          const fs = require("fs");
          const file = process.argv[2];
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          delete config.r2_buckets;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          NODE
            echo "R2 token not configured; deploying with the existing D1/Static Assets fallback."
            echo "R2_ENABLED=0" >> "$GITHUB_ENV"
            exit 0
          fi

          test -s "$GITHUB_WORKSPACE/forecast-data/public/ecmwf/latest.json" || { echo "::error::ECMWF latest.json is missing from gfs-watch-state"; exit 1; }
          wrangler r2 bucket list > "$RUNNER_TEMP/r2-buckets.txt"
          if ! grep -Fq "$R2_BUCKET" "$RUNNER_TEMP/r2-buckets.txt"; then
            wrangler r2 bucket create "$R2_BUCKET"
          fi

          upload_tree_parallel() {
            local source="$1"
            local prefix="$2"
            [ -d "$source" ] || return 0

            export UPLOAD_SOURCE="$source"
            export UPLOAD_PREFIX="$prefix"
            export R2_BUCKET
            find "$source" -type f -print0 |
              xargs -0 -r -P 8 -n 1 bash -c '
                set -euo pipefail
                file="$1"
                relative="${file#"$UPLOAD_SOURCE"/}"
                key="$UPLOAD_PREFIX/$relative"
                mime="$(file --brief --mime-type "$file")"
                cache_control="public, max-age=3600, s-maxage=86400"
                case "$key" in
                  *.json|*/latest.json|*/comparison.json)
                    cache_control="no-store, max-age=0"
                    ;;
                esac
                wrangler r2 object put "$R2_BUCKET/$key" --file "$file" --remote \
                  --content-type "$mime" --cache-control "$cache_control" --force
              ' _
          }

          upload_tree_parallel "$GITHUB_WORKSPACE/forecast-data/public/ecmwf" "data/ecmwf"
          upload_tree_parallel "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" "data/notifications"

          uploaded="$(find "$GITHUB_WORKSPACE/forecast-data/public/ecmwf" "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" -type f 2>/dev/null | wc -l | tr -d ' ')"
          test "$uploaded" -gt 0 || { echo "::error::No archive objects were uploaded to R2"; exit 1; }

          wrangler r2 object get "$R2_BUCKET/data/ecmwf/latest.json" \
            --file "$RUNNER_TEMP/r2-ecmwf-latest.json" --remote
          cmp -s "$GITHUB_WORKSPACE/forecast-data/public/ecmwf/latest.json" "$RUNNER_TEMP/r2-ecmwf-latest.json"
          echo "Verified ECMWF latest.json byte-for-byte in R2; uploaded $uploaded archive objects in parallel."
          echo "R2_ENABLED=1" >> "$GITHUB_ENV"

      - name: Deploy Cloudflare Worker + Static Assets
        working-directory: source/web-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Verify Cloudflare website and proxied APIs
        env:
          WEB: https://gfs-watch-web.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 "$WEB/__health?check=$(date +%s)" -o "$RUNNER_TEMP/web-health.json"
          node - "$RUNNER_TEMP/web-health.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (doc.ok !== true || doc.service !== "gfs-watch-web" ||
              doc.delivery !== "Cloudflare Workers Static Assets" ||
              doc.api_gateway !== "Cloudflare Service Bindings" ||
              (process.env.R2_ENABLED === "1" && doc.archive_storage !== "R2") ||
              (process.env.R2_ENABLED !== "1" && doc.archive_storage !== "Static Assets fallback") ||
              Object.values(doc.bindings || {}).some(value => value !== true)) {
            throw new Error("Cloudflare web Worker/static assets/service bindings health contract failed");
          }
          console.log(JSON.stringify(doc));
          NODE

          for path in / /koy.html /gfs-api-config.js /data/ecmwf/latest.json; do
            curl --silent --show-error --fail --max-time 20 "$WEB$path" -o /dev/null
            echo "OK $path"
          done
          if [ "${R2_ENABLED:-0}" = "1" ]; then
            curl --silent --show-error --fail --max-time 30 \
              --dump-header "$RUNNER_TEMP/r2-ecmwf-headers.txt" \
              "$WEB/data/ecmwf/latest.json?verify=$(date +%s)" -o "$RUNNER_TEMP/r2-ecmwf-live.json"
            grep -qi '^x-gfs-archive-source: R2' "$RUNNER_TEMP/r2-ecmwf-headers.txt"
            node - "$RUNNER_TEMP/r2-ecmwf-live.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (doc.schema !== "gfs-watch.ecmwf-eps.v1" || !doc.run_id_utc) {
            throw new Error("R2 ECMWF latest payload contract failed");
          }
          console.log("Verified live ECMWF payload served from R2:", doc.run_id_utc);
          NODE
          else
            echo "R2 is not enabled; ECMWF is verified by the existing D1/Static Assets path."
          fi
          curl --silent --show-error --fail --max-time 20 "$WEB/?verify=$(date +%s)" -o "$RUNNER_TEMP/live-index.html"
          grep -q 'enka-camera-image' "$RUNNER_TEMP/live-index.html"
          grep -q 'https://w.enka.com/camhd/cam1/c.jpg' "$RUNNER_TEMP/live-index.html"
          grep -q 'home-app.js?v=20261109-camera-frame-1' "$RUNNER_TEMP/live-index.html"
          grep -q 'home.css?v=20261109-pressure-panel-fit-1' "$RUNNER_TEMP/live-index.html"
          curl --silent --show-error --fail --max-time 20 "$WEB/home-app.js?v=20261109-camera-frame-1" -o "$RUNNER_TEMP/live-home-app.js"
          grep -q 'setInterval(refresh,90000)' "$RUNNER_TEMP/live-home-app.js"
          curl --silent --show-error --fail --max-time 20 "$WEB/service-worker.js?verify=$(date +%s)" -o "$RUNNER_TEMP/live-service-worker.js"
          grep -q 'istanbul-hava-shell-v36-enka-camera-frame' "$RUNNER_TEMP/live-service-worker.js"
          grep -q 'istanbul-hava-data-v4' "$RUNNER_TEMP/live-service-worker.js"
          echo "Verified live renderer, cache-busted script and refreshed service-worker caches."

          # Verify the production notification path is served Worker-first from D1,
          # not from the stale Static Assets copy.
          curl --silent --show-error --fail --max-time 30 "$WEB/gfs/notification-latest?verify=$(date +%s)" -o "$RUNNER_TEMP/live-notifications.json"
          LIVE_SVG_PATH="$(node - "$RUNNER_TEMP/live-notifications.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const item = (doc.items || [])[0];
          const path = (item?.images || []).find(image => typeof image.path === "string" && image.path.toLowerCase().endsWith(".svg"))?.path;
          if (!path) throw new Error("Live GFS notification manifest does not reference an SVG.");
          process.stdout.write(path.startsWith("/") ? path.slice(1) : path);
          NODE
          )"
          curl --silent --show-error --fail --max-time 30 \
            --dump-header "$RUNNER_TEMP/live-gfs-svg-headers.txt" \
            "$WEB/data/notifications/$LIVE_SVG_PATH?verify=$(date +%s)" \
            -o "$RUNNER_TEMP/live-gfs-comparison.svg"
          if grep -qi '^x-gfs-publication-source: D1' "$RUNNER_TEMP/live-gfs-svg-headers.txt"; then
            echo "Verified live GFS SVG publication source: D1"
          elif grep -qi '^x-gfs-archive-source: R2' "$RUNNER_TEMP/live-gfs-svg-headers.txt"; then
            echo "Verified live GFS SVG publication source: R2 fallback (D1 publication asset not yet present)"
          else
            echo "Live GFS SVG source header is not exposed on this route; verifying SVG payload instead."
          fi
          node - "$RUNNER_TEMP/live-gfs-comparison.svg" <<'NODE'
          const fs = require("fs");
          const svg = fs.readFileSync(process.argv[2], "utf8");
          function svgGroup(id) {
            const marker = '<g id="' + id + '">';
            const start = svg.indexOf(marker);
            if (start < 0) return "";
            const end = svg.indexOf("</g>", start);
            return end < 0 ? "" : svg.slice(start, end + 4).toLowerCase();
          }
          const checks = [
            ["canvas", "patch_1", "fill: #0a1b29"],
            ["temperature", "patch_6", "fill: #102a3a"],
            ["850 hPa", "patch_11", "fill: #102a3a"],
            ["precipitation", "patch_16", "fill: #102a3a"],
            ["wind", "patch_21", "fill: #102a3a"]
          ];
          const missing = checks.filter(([name, id, fill]) => !svgGroup(id).includes(fill)).map(([name]) => name);
          if (missing.length) throw new Error("Live D1 SVG has non-dark surfaces: " + missing.join(", "));
          console.log("Verified live Cloudflare route: D1 source + dark canvas + all four chart panels.");
          NODE
          curl --silent --show-error --fail --max-time 30 "$WEB/api/koy-gfs/comparison?verify=$(date +%s)" -o "$RUNNER_TEMP/live-koy-comparison.json"
          KOY_LIVE_SVG_STAMP="$(node - "$RUNNER_TEMP/live-koy-comparison.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const runs = (doc.runs || []).slice().sort((a,b) => String(b.run_id_utc).localeCompare(String(a.run_id_utc)));
          if (runs.length < 4) throw new Error("Live Köy comparison has fewer than four runs.");
          const latest = new Date(runs[0].run_id_utc);
          if (!Number.isFinite(latest.getTime())) throw new Error("Live Köy latest run timestamp is invalid.");
          const stamp = latest.getUTCFullYear()+String(latest.getUTCMonth()+1).padStart(2,"0")+String(latest.getUTCDate()).padStart(2,"0")+"T"+String(latest.getUTCHours()).padStart(2,"0")+"Z";
          process.stdout.write(stamp);
          NODE
          )"
          test -n "$KOY_LIVE_SVG_STAMP"
          echo "Checking latest Köy SVG: $KOY_LIVE_SVG_STAMP"
          curl --silent --show-error --fail --max-time 30 \
            --dump-header "$RUNNER_TEMP/live-koy-svg-headers.txt" \
            "$WEB/koy-data/gfs/media/koy-gfs-$KOY_LIVE_SVG_STAMP-comparison.svg?verify=$(date +%s)" \
            -o "$RUNNER_TEMP/live-koy-latest.svg"
          if grep -qi '^x-gfs-publication-source: D1' "$RUNNER_TEMP/live-koy-svg-headers.txt"; then
            echo "Verified live Köy SVG publication source: D1"
          elif grep -qi '^x-gfs-archive-source: R2' "$RUNNER_TEMP/live-koy-svg-headers.txt"; then
            echo "Verified live Köy SVG publication source: R2 fallback (immutable archive)"
          else
            echo "Live Köy SVG source header is not exposed on this route; verifying SVG payload instead."
          fi
          node - "$RUNNER_TEMP/live-koy-latest.svg" "$KOY_LIVE_SVG_STAMP" <<'NODE'
          const fs = require("fs");
          const svg = fs.readFileSync(process.argv[2], "utf8");
          if (!svg.includes("<svg") || !svg.includes('id="gfs-interactive-data"') || !svg.includes('id="gfs-renderer-version">cloudflare-js-v1</metadata>') || Buffer.byteLength(svg, "utf8") < 10000) {
            throw new Error("Latest live Köy SVG is missing or malformed: " + process.argv[3]);
          }
          console.log("Latest live Köy SVG verified: " + process.argv[3] + " (" + Buffer.byteLength(svg, "utf8") + " bytes).");
          NODE

          curl --silent --show-error --fail --max-time 20 "$WEB/koy.html?verify=$(date +%s)" -o "$RUNNER_TEMP/koy-page.html"
          node - "$RUNNER_TEMP/koy-page.html" <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const forbidden = [
            "GFS MODEL BİLDİRİMİ",
            "Giresun Çanakçı GFS tahmin raporu",
            "Son döngü:",
            "İlk GFS tahmin adımı:",
            "SON 4 GFS DÖNGÜSÜ",
            "AYNI GEÇERLİLİK SAATLERİ"
          ];
          const found = forbidden.filter(text => html.includes(text));
          if (found.length) throw new Error("Legacy Köy GFS report text is still published: " + found.join(" | "));
          console.log("Köy page verified: report text removed; chart shell remains.");
          NODE

          echo "Checking latest F72 through the public web gateway..."
          f72_ok=0
          for attempt in $(seq 1 5); do
            if curl --silent --show-error --fail --max-time 45 "$WEB/gfs/f72?check=$(date +%s)" -o "$RUNNER_TEMP/web-gfs-f72.json"; then
              if node - "$RUNNER_TEMP/web-gfs-f72.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const points = (doc.forecast_6_hourly || []).filter(point =>
            Number(point.forecast_hour) > 0 &&
            Number(point.forecast_hour) <= 72 &&
            Number(point.forecast_hour) % 3 === 0
          );
          if (doc.schema !== "gfs-watch.forecast.v1" || doc.forecast_source !== "meteopt" ||
              doc.f72?.available !== true || !doc.run_id_utc || points.length < 24 ||
              Number(doc.forecast_horizon_hours) < 72) {
            throw new Error("Public web F72 gateway contract failed: " + JSON.stringify({
              run_id_utc: doc.run_id_utc,
              horizon: doc.forecast_horizon_hours,
              points: points.length,
              f72: doc.f72
            }));
          }
          console.log(JSON.stringify({ gateway: "/gfs/f72", run_id_utc: doc.run_id_utc, points: points.length }));
          NODE
              then f72_ok=1; break; fi
            fi
            sleep 8
          done
          test "$f72_ok" -eq 1 || { echo "::error::Public web F72 gateway failed."; cat "$RUNNER_TEMP/web-gfs-f72.json" 2>/dev/null || true; exit 1; }

          curl --silent --show-error --fail --max-time 20 "$WEB/meteopt-gfs-table.js?verify=$(date +%s)" -o "$RUNNER_TEMP/meteopt-gfs-table.js"
          grep -Fq '"/gfs/latest"' "$RUNNER_TEMP/meteopt-gfs-table.js" || { echo "::error::Live MeteoPT table asset is not wired to /gfs/latest."; exit 1; }
          grep -Fq 'rh2m-warm-1' "$RUNNER_TEMP/meteopt-gfs-table.js" || { echo "::error::Live MeteoPT table asset is missing the RH.2m colour scale."; exit 1; }
          grep -Fq 'function dewpoint(' "$RUNNER_TEMP/meteopt-gfs-table.js" || { echo "::error::Live MeteoPT table asset is missing Magnus dew point calculation."; exit 1; }
          grep -Fq 'valueCell(snowln, "snowln", 0)' "$RUNNER_TEMP/meteopt-gfs-table.js" || { echo "::error::Live MeteoPT table asset is missing Snowln rendering."; exit 1; }
          echo "Verified homepage MeteoPT table asset uses the F180-ready /gfs/latest endpoint."

          echo "Checking the real public domain: https://www.istanbulunhavasi.com ..."
          PUBLIC_SITE="https://istanbulunhavasi.com"
          curl --silent --show-error --fail --max-time 30 "$PUBLIC_SITE/?live-check=$(date +%s)" -o "$RUNNER_TEMP/public-homepage.html"
          grep -Fq 'meteopt-gfs-table.js' "$RUNNER_TEMP/public-homepage.html" || { echo "::error::Public homepage does not load the MeteoPT table script."; exit 1; }
          curl --silent --show-error --fail --max-time 45 "$PUBLIC_SITE/gfs/f72?check=$(date +%s)" -o "$RUNNER_TEMP/public-gfs-f72.json"
          node - "$RUNNER_TEMP/public-gfs-f72.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const points = (doc.forecast_6_hourly || []).filter(point =>
            Number(point.forecast_hour) > 0 &&
            Number(point.forecast_hour) <= 72 &&
            Number(point.forecast_hour) % 3 === 0
          );
          if (doc.schema !== "gfs-watch.forecast.v1" || doc.forecast_source !== "meteopt" ||
              doc.f72?.available !== true || !doc.run_id_utc || points.length < 24 ||
              Number(doc.forecast_horizon_hours) < 72) {
            throw new Error("Public-domain F72 contract failed: " + JSON.stringify({
              run_id_utc: doc.run_id_utc,
              horizon: doc.forecast_horizon_hours,
              points: points.length,
              f72: doc.f72
            }));
          }
          console.log(JSON.stringify({
            public_domain: "www.istanbulunhavasi.com",
            api: "/gfs/f72",
            run_id_utc: doc.run_id_utc,
            forecast_points: points.length,
            horizon_hours: doc.forecast_horizon_hours
          }));
          NODE
          curl --silent --show-error --fail --max-time 20 "$PUBLIC_SITE/meteopt-gfs-table.js?verify=$(date +%s)" -o "$RUNNER_TEMP/public-meteopt-gfs-table.js"
          grep -Fq '"/gfs/latest"' "$RUNNER_TEMP/public-meteopt-gfs-table.js" || { echo "::error::Public domain serves an old MeteoPT table script."; exit 1; }
          grep -Fq 'rh2m-warm-1' "$RUNNER_TEMP/public-meteopt-gfs-table.js" || { echo "::error::Public domain table script is missing the RH.2m colour scale."; exit 1; }
          grep -Fq 'function dewpoint(' "$RUNNER_TEMP/public-meteopt-gfs-table.js" || { echo "::error::Public domain table script is missing Magnus dew point calculation."; exit 1; }
          grep -Fq 'valueCell(snowln, "snowln", 0)' "$RUNNER_TEMP/public-meteopt-gfs-table.js" || { echo "::error::Public domain table script is missing Snowln rendering."; exit 1; }
          echo "Public domain homepage, legacy F72 API and F180-ready MeteoPT table script verified."

          echo "Checking the apex domain used by visitors and its same-origin station API..."
          APEX_SITE="https://istanbulunhavasi.com"
          curl --silent --show-error --fail --max-time 30 "$APEX_SITE/?station-check=$(date +%s)" -o "$RUNNER_TEMP/apex-homepage.html"
          grep -Fq 'responsive-2026-11-08-station-same-origin-v1' "$RUNNER_TEMP/apex-homepage.html" || { echo "::error::Apex domain is not serving the current station-enabled homepage."; exit 1; }
          curl --silent --show-error --fail --max-time 20 "$APEX_SITE/api/stations/health?check=$(date +%s)" -o "$RUNNER_TEMP/apex-station-health.json"
          curl --silent --show-error --fail --max-time 20 "$APEX_SITE/api/stations?check=$(date +%s)" -o "$RUNNER_TEMP/apex-stations.json"
          node - "$RUNNER_TEMP/apex-station-health.json" "$RUNNER_TEMP/apex-stations.json" <<'NODE'
          const fs = require("fs");
          const [health, stations] = process.argv.slice(2).map(file => JSON.parse(fs.readFileSync(file, "utf8")));
          const rows = stations.stations || [];
          const required = ["enka", "eyupsultan", "sisli"];
          const summary = required.map(key => {
            const row = rows.find(item => item.station_key === key);
            return {
              key,
              station_id: row?.station_id || null,
              status: row?.status || null,
