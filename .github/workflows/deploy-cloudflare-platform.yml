name: Deploy Cloudflare Platform

on:
  push:
    branches: [main, istanbul-gfs-data, gfs-watch-state, koy-mgm-data]
    paths:
      - ".github/workflows/deploy-cloudflare-platform.yml"
      - "site/**"
      - "web-worker/**"
      - "istanbul-gfs-worker/**"
      - "gfs/notifications/**"
      - "!gfs/notifications/telegram-sent/**"
      - "public/ecmwf/**"
      - "mgm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-platform-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Istanbul GFS API and Cloudflare website
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out application source
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Check out Istanbul GFS publication archive
        uses: actions/checkout@v5
        with:
          ref: istanbul-gfs-data
          path: istanbul-gfs-data
          fetch-depth: 1

      - name: Check out shared forecast cache
        uses: actions/checkout@v5
        with:
          ref: gfs-watch-state
          path: forecast-data
          fetch-depth: 1

      - name: Check out Köy GFS archive
        uses: actions/checkout@v5
        with:
          ref: koy-gfs-data
          path: koy-data
          fetch-depth: 1

      - name: Check out Köy MGM archive
        uses: actions/checkout@v5
        with:
          ref: koy-mgm-data
          path: koy-mgm-data
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Locate or create Istanbul GFS D1
        working-directory: source/istanbul-gfs-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          D1_ID="$(node - "$RUNNER_TEMP/d1-list.json" <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          function walk(value) {
            if (!value) return null;
            if (Array.isArray(value)) {
              for (const item of value) { const found = walk(item); if (found) return found; }
              return null;
            }
            if (typeof value !== "object") return null;
            const name = value.name || value.database_name || value.databaseName;
            const id = value.uuid || value.database_id || value.databaseId;
            if (name === "gfs-watch-istanbul-gfs" && id) return String(id);
            for (const child of Object.values(value)) { const found = walk(child); if (found) return found; }
            return null;
          }
          process.stdout.write(walk(data) || "");
          NODE
          )"
          if [ -z "$D1_ID" ]; then
            wrangler d1 create gfs-watch-istanbul-gfs --location eeur
            wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
            D1_ID="$(node - "$RUNNER_TEMP/d1-list.json" <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          function walk(value) {
            if (!value) return null;
            if (Array.isArray(value)) {
              for (const item of value) { const found = walk(item); if (found) return found; }
              return null;
            }
            if (typeof value !== "object") return null;
            const name = value.name || value.database_name || value.databaseName;
            const id = value.uuid || value.database_id || value.databaseId;
            if (name === "gfs-watch-istanbul-gfs" && id) return String(id);
            for (const child of Object.values(value)) { const found = walk(child); if (found) return found; }
            return null;
          }
          process.stdout.write(walk(data) || "");
          NODE
            )"
          fi
          test -n "$D1_ID" || { echo "::error::Could not resolve Istanbul GFS D1 ID"; exit 1; }
          node - "$D1_ID" wrangler.jsonc <<'NODE'
          const fs = require("fs");
          const id = process.argv[2];
          const file = process.argv[3];
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          const binding = (config.d1_databases || []).find(item => item.database_name === "gfs-watch-istanbul-gfs");
          if (!binding) throw new Error("GFS_DB binding missing");
          binding.database_id = id;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Apply Istanbul GFS D1 migrations
        working-directory: source/istanbul-gfs-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply gfs-watch-istanbul-gfs --remote --config wrangler.jsonc

      - name: Deploy autonomous Istanbul GFS Cron Worker
        working-directory: source/istanbul-gfs-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Verify Istanbul GFS Worker, D1 and four-cycle API
        env:
          ISTANBUL_GFS_API: https://gfs-watch-istanbul-gfs.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail
          health_ok=0
          for attempt in $(seq 1 8); do
            if curl --silent --show-error --fail --max-time 15 "$ISTANBUL_GFS_API/api/health?check=$(date +%s)" -o "$RUNNER_TEMP/istanbul-health.json"; then
              node - "$RUNNER_TEMP/istanbul-health.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (doc.ok !== true || doc.service !== "gfs-watch-istanbul-gfs" || doc.storage !== "D1" || doc.cron !== "*/10 * * * *") {
            throw new Error("Istanbul GFS health contract failed");
          }
          console.log(JSON.stringify(doc));
          NODE
              health_ok=1
              break
            fi
            sleep 8
          done
          test "$health_ok" -eq 1 || { cat "$RUNNER_TEMP/istanbul-health.json" 2>/dev/null || true; exit 1; }

          latest_ok=0
          for attempt in $(seq 1 5); do
            if curl --silent --show-error --fail --max-time 100 "$ISTANBUL_GFS_API/gfs/latest?check=$(date +%s)" -o "$RUNNER_TEMP/istanbul-latest.json"; then
              if node - "$RUNNER_TEMP/istanbul-latest.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const runs = doc.comparison_runs || [];
          if (doc.schema !== "gfs-watch.forecast.v1" || doc.f180?.available !== true ||
              !Array.isArray(doc.forecast_6_hourly) || doc.forecast_6_hourly.length < 40 ||
              !Array.isArray(runs) || runs.length < 1) {
            console.error(JSON.stringify({schema: doc.schema, run: doc.run_id_utc, f180: doc.f180, points: doc.forecast_6_hourly?.length, runs: runs.length}));
            process.exit(1);
          }
          console.log(JSON.stringify({
            run_id_utc: doc.run_id_utc,
            forecast_points: doc.forecast_6_hourly.length,
            comparison_runs: runs.length,
            first_valid_time_utc: doc.forecast_6_hourly[0]?.valid_time_utc,
            last_valid_time_utc: doc.forecast_6_hourly.at(-1)?.valid_time_utc
          }));
          NODE
              then latest_ok=1; break; fi
            fi
            sleep 10
          done
          test "$latest_ok" -eq 1 || { echo "::error::Istanbul GFS API did not return a validated F180 forecast."; cat "$RUNNER_TEMP/istanbul-latest.json" 2>/dev/null || true; exit 1; }

      - name: Assemble production static assets
        working-directory: source
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
        run: |
          set -euo pipefail
          rm -rf web-worker/public
          mkdir -p web-worker/public/data
          cp -a site/. web-worker/public/

          # Keep the existing public forecast-verification and ECMWF assets.
          if [ -d "$GITHUB_WORKSPACE/forecast-data/public" ]; then
            cp -a "$GITHUB_WORKSPACE/forecast-data/public/." web-worker/public/data/
          fi

          # Keep the latest archived report and its image files available on the
          # existing notification URLs while live GFS values move to D1.
          if [ -s "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/latest.json" ]; then
            cp "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/latest.json" web-worker/public/data/istanbul-gfs-latest.json
          elif [ -s web-worker/public/data/latest.json ]; then
            cp web-worker/public/data/latest.json web-worker/public/data/istanbul-gfs-latest.json
          fi
          if [ -d "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" ]; then
            rm -rf web-worker/public/data/notifications
            cp -a "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" web-worker/public/data/
          fi

          # Do not ship station snapshots; station observations are API-only.
          rm -f \
            web-worker/public/data/station-observation.json \
            web-worker/public/data/station-temperature-history.json \
            web-worker/public/data/eyupsultan-station-observation.json \
            web-worker/public/data/eyupsultan-station-temperature-history.json \
            web-worker/public/data/eyupsultan-station-rain-history.json \
            web-worker/public/data/sisli-station-observation.json \
            web-worker/public/data/sisli-station-temperature-history.json \
            web-worker/public/data/sisli-station-rain-history.json

          mkdir -p web-worker/public/koy-data
          if [ -d "$GITHUB_WORKSPACE/koy-data/gfs" ]; then
            cp -a "$GITHUB_WORKSPACE/koy-data/gfs" web-worker/public/koy-data/
          fi
          if [ -d "$GITHUB_WORKSPACE/koy-mgm-data/mgm" ]; then
            mkdir -p web-worker/public/koy-data/mgm
            cp -a "$GITHUB_WORKSPACE/koy-mgm-data/mgm/." web-worker/public/koy-data/mgm/
          fi

          printf '{"apiBaseUrl":"%s"}' "$PUSH_API_URL" > web-worker/public/push-config.json
          touch web-worker/public/.nojekyll
          test -s web-worker/public/index.html
          test -s web-worker/public/koy.html
          test -s web-worker/public/gfs-cycle-compare.html
          echo "Static asset count: $(find web-worker/public -type f | wc -l)"

      - name: Deploy Cloudflare Worker + Static Assets
        working-directory: source/web-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Verify Cloudflare website and proxied APIs
        env:
          WEB: https://gfs-watch-web.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 "$WEB/__health?check=$(date +%s)" -o "$RUNNER_TEMP/web-health.json"
          node - "$RUNNER_TEMP/web-health.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (doc.ok !== true || doc.service !== "gfs-watch-web" || doc.delivery !== "Cloudflare Workers Static Assets") {
            throw new Error("Cloudflare web Worker health contract failed");
          }
          console.log(JSON.stringify(doc));
          NODE

          for path in / /koy.html /gfs-cycle-compare.html /gfs-api-config.js /data/ecmwf/latest.json; do
            curl --silent --show-error --fail --max-time 20 "$WEB$path" -o /dev/null
            echo "OK $path"
          done

          curl --silent --show-error --fail --max-time 45 "$WEB/gfs/latest?check=$(date +%s)" -o "$RUNNER_TEMP/web-gfs.json"
          curl --silent --show-error --fail --max-time 45 "$WEB/api/koy-gfs/f72?check=$(date +%s)" -o "$RUNNER_TEMP/web-koy.json"
          curl --silent --show-error --fail --max-time 20 "$WEB/api/stations/health?check=$(date +%s)" -o "$RUNNER_TEMP/web-stations.json"
          node - "$RUNNER_TEMP/web-gfs.json" "$RUNNER_TEMP/web-koy.json" "$RUNNER_TEMP/web-stations.json" <<'NODE'
          const fs = require("fs");
          const [gfs, koy, stations] = process.argv.slice(2).map(file => JSON.parse(fs.readFileSync(file, "utf8")));
          if (gfs.schema !== "gfs-watch.forecast.v1" || !Array.isArray(gfs.comparison_runs)) throw new Error("Istanbul GFS gateway failed");
          if (!Array.isArray(koy.forecast_6_hourly) || koy.forecast_6_hourly.length < 12) throw new Error("Köy GFS gateway failed");
          if (stations.ok !== true || stations.storage !== "D1") throw new Error("Station D1 gateway failed");
          console.log(JSON.stringify({
            istanbul_run: gfs.run_id_utc,
            istanbul_comparison_runs: gfs.comparison_runs.length,
            koy_run: koy.run_id_utc,
            koy_points: koy.forecast_6_hourly.length,
            stations: stations.stations?.map(item => ({key: item.key, status: item.status}))
          }));
          NODE
