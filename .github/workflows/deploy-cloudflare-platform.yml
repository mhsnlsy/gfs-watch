name: Deploy Cloudflare Platform

on:
  # Production runtime is Cloudflare-native. GitHub only deploys code from main.
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/brand/**"
      - "scripts/build_site_icons.py"
      - "web-worker/**"
      - "istanbul-gfs-worker/**"
      - "shared/meteopt-source.js"
      - "gfs/notifications/**"
      - "gfs/**"
      - "!gfs/notifications/telegram-sent/**"
      - "mgm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-platform-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare website + Static Assets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out application source
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Check out Istanbul GFS publication archive
        uses: actions/checkout@v5
        with:
          ref: istanbul-gfs-data
          path: istanbul-gfs-data
          fetch-depth: 1

      - name: Check out shared forecast cache
        uses: actions/checkout@v5
        with:
          ref: gfs-watch-state
          path: forecast-data
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Assemble production static assets
        working-directory: source
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
        run: |
          set -euo pipefail
          rm -rf web-worker/public
          mkdir -p web-worker/public/data
          cp -a site/. web-worker/public/

          # Rebuild every favicon, Apple touch icon and PWA icon from the
          # approved single-source Istanbul logo on every production deploy.
          python -m pip install --disable-pip-version-check --quiet Pillow
          python scripts/build_site_icons.py assets/brand web-worker/public

          # Keep the existing public forecast-verification and ECMWF assets.
          if [ -d "$GITHUB_WORKSPACE/forecast-data/public" ]; then
            cp -a "$GITHUB_WORKSPACE/forecast-data/public/." web-worker/public/data/
          fi

          # Keep the latest archived report and its image files available on the
          # existing notification URLs while live GFS values move to D1.
          if [ -s "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/latest.json" ]; then
            cp "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/latest.json" web-worker/public/data/istanbul-gfs-latest.json
          elif [ -s web-worker/public/data/latest.json ]; then
            cp web-worker/public/data/latest.json web-worker/public/data/istanbul-gfs-latest.json
          fi
          if [ -d "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" ]; then
            rm -rf web-worker/public/data/notifications
            cp -a "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" web-worker/public/data/
          fi

          # Do not ship station snapshots; station observations are API-only.
          rm -f \
            web-worker/public/data/station-observation.json \
            web-worker/public/data/station-temperature-history.json \
            web-worker/public/data/eyupsultan-station-observation.json \
            web-worker/public/data/eyupsultan-station-temperature-history.json \
            web-worker/public/data/eyupsultan-station-rain-history.json \
            web-worker/public/data/sisli-station-observation.json \
            web-worker/public/data/sisli-station-temperature-history.json \
            web-worker/public/data/sisli-station-rain-history.json

          # Preserve the text-only admin and analytics assets after the clean public build.
          mkdir -p web-worker/public/admin
          cp web-worker/admin-assets/index.html web-worker/public/admin-panel.html
          cp web-worker/admin-assets/analytics.js web-worker/public/analytics.js

          printf '{"apiBaseUrl":"%s"}' "$PUSH_API_URL" > web-worker/public/push-config.json
          touch web-worker/public/.nojekyll
          test -s web-worker/public/index.html
          test -s web-worker/public/koy.html
          echo "Static asset count: $(find web-worker/public -type f | wc -l)"

      - name: Ensure R2 archive bucket and upload legacy archives (optional)
        working-directory: source/web-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: gfs-watch-live-archive
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            node - wrangler.jsonc <<'NODE'
            const fs = require("fs");
            const file = process.argv[2];
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            delete config.r2_buckets;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          NODE
            echo "R2 token not configured; deploying with the existing D1/Static Assets fallback."
            echo "R2_ENABLED=0" >> "$GITHUB_ENV"
            exit 0
          fi

          test -s "$GITHUB_WORKSPACE/forecast-data/public/ecmwf/latest.json" || { echo "::error::ECMWF latest.json is missing from gfs-watch-state"; exit 1; }

          # Cloudflare can transiently return API code 10001 for the R2 bucket
          # listing endpoint. Do not fail an otherwise healthy deploy on one
          # transient control-plane response.
          r2_bucket_list_ok=0
          for attempt in $(seq 1 5); do
            if wrangler r2 bucket list > "$RUNNER_TEMP/r2-buckets.txt"; then
              r2_bucket_list_ok=1
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 3))
              echo "::warning::R2 bucket list attempt $attempt/5 failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          disable_r2_fallback() {
            node - wrangler.jsonc <<'NODE'
            const fs = require("fs");
            const file = process.argv[2];
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            delete config.r2_buckets;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          NODE
            echo "R2 unavailable; continuing with the existing D1/Static Assets fallback."
            echo "R2_ENABLED=0" >> "$GITHUB_ENV"
          }

          if [ "$r2_bucket_list_ok" -ne 1 ]; then
            echo "::warning::Cloudflare R2 bucket list failed after 5 attempts; disabling R2 for this deploy."
            disable_r2_fallback
            exit 0
          fi

          if ! grep -Fq "$R2_BUCKET" "$RUNNER_TEMP/r2-buckets.txt"; then
            r2_bucket_create_ok=0
            for attempt in $(seq 1 5); do
              if wrangler r2 bucket create "$R2_BUCKET"; then
                r2_bucket_create_ok=1
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                delay=$((attempt * 3))
                echo "::warning::R2 bucket create attempt $attempt/5 failed; retrying in ${delay}s."
                sleep "$delay"
              fi
            done
            if [ "$r2_bucket_create_ok" -ne 1 ]; then
              echo "::warning::R2 bucket creation failed after 5 attempts; disabling R2 for this deploy."
              disable_r2_fallback
              exit 0
            fi
          fi

                    upload_with_retry() {
            local key="$1"
            local file="$2"
            local mime="$3"
            local cache_control="$4"
            local attempt=1
            local max_attempts=5
            while [ "$attempt" -le "$max_attempts" ]; do
              if wrangler r2 object put "$R2_BUCKET/$key" --file "$file" --remote \
                --content-type "$mime" --cache-control "$cache_control" --force; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "::error::R2 upload failed after $max_attempts attempts: $key"
                return 1
              fi
              delay=$((attempt * 3))
              echo "::warning::R2 upload attempt $attempt/$max_attempts failed for $key; retrying in ${delay}s."
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          upload_tree_parallel() {
            local source="$1"
            local prefix="$2"
            local parallelism="${3:-3}"
            [ -d "$source" ] || return 0

            export UPLOAD_SOURCE="$source"
            export UPLOAD_PREFIX="$prefix"
            export R2_BUCKET
            export -f upload_with_retry
            find "$source" -type f -print0 |
              xargs -0 -r -P "$parallelism" -n 1 bash -c '
                set -euo pipefail
                file="$1"
                relative="${file#"$UPLOAD_SOURCE"/}"
                key="$UPLOAD_PREFIX/$relative"
                mime="$(file --brief --mime-type "$file")"
                cache_control="public, max-age=3600, s-maxage=86400"
                case "$key" in
                  *.json|*/latest.json|*/comparison.json)
                    cache_control="no-store, max-age=0"
                    ;;
                esac
                upload_with_retry "$key" "$file" "$mime" "$cache_control"
              ' _
          }

          # Never replace a complete live ECMWF payload with a partial
          # cache-branch snapshot. The Istanbul service is the canonical live
          # MeteoPT collector; R2 is only an archive/fallback layer.
          if node - "$GITHUB_WORKSPACE/forecast-data/public/ecmwf/latest.json" <<'NODE'
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const points = Array.isArray(doc.forecast_6_hourly) ? doc.forecast_6_hourly : [];
            const maxHour = Math.max(0, ...points.map(point => Number(point?.forecast_hour) || 0));
            process.exit(doc.schema === "gfs-watch.ecmwf-eps.v1" &&
              doc.forecast_source === "meteopt" && maxHour >= 180 ? 0 : 1);
          NODE
          then
            if ! upload_tree_parallel "$GITHUB_WORKSPACE/forecast-data/public/ecmwf" "data/ecmwf"; then
            echo "::warning::ECMWF R2 archive upload failed; disabling R2 for this deploy."
            disable_r2_fallback
            exit 0
          fi
            echo "Uploaded complete ECMWF archive cache."
          else
            echo "Skipping ECMWF cache upload: checked-out latest.json is not a complete 180h MeteoPT payload."
          fi

          if ! upload_tree_parallel "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" "data/notifications"; then
            echo "::warning::Notification R2 archive upload failed; disabling R2 for this deploy."
            disable_r2_fallback
            exit 0
          fi

          uploaded="$(find "$GITHUB_WORKSPACE/istanbul-gfs-data/gfs/notifications" -type f 2>/dev/null | wc -l | tr -d ' ')"
          test "$uploaded" -gt 0 || { echo "::error::No notification archive objects were uploaded to R2"; exit 1; }

          echo "Uploaded $uploaded notification archive objects in parallel; ECMWF live data remains Worker/D1 authoritative."
          echo "R2_ENABLED=1" >> "$GITHUB_ENV"

      - name: Ensure analytics D1 database
        working-directory: source/web-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD" || { echo "::error::ADMIN_PASSWORD is not configured"; exit 1; }

          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          D1_ID="$(node - "$RUNNER_TEMP/d1-list.json" <<'NODE'
            const fs = require("fs");
            const rows = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const row = (Array.isArray(rows) ? rows : []).find(item => item.name === "gfs-watch-web-analytics");
            process.stdout.write(row?.uuid || row?.database_id || "");
          NODE
          )"

          if [ -z "$D1_ID" ]; then
            wrangler d1 create gfs-watch-web-analytics --location eeur
            wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
            D1_ID="$(node - "$RUNNER_TEMP/d1-list.json" <<'NODE'
            const fs = require("fs");
            const rows = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const row = (Array.isArray(rows) ? rows : []).find(item => item.name === "gfs-watch-web-analytics");
            process.stdout.write(row?.uuid || row?.database_id || "");
          NODE
            )"
          fi

          test -n "$D1_ID" || { echo "::error::Could not determine analytics D1 database id"; exit 1; }
          sed -i "s/__D1_DATABASE_ID__/$D1_DATABASE_ID/" wrangler.jsonc
          wrangler d1 migrations apply gfs-watch-web-analytics --remote --config wrangler.jsonc
          printf '%s' "$ADMIN_PASSWORD" | wrangler secret put ADMIN_PASSWORD --config wrangler.jsonc

      - name: Deploy Cloudflare Worker + Static Assets
        working-directory: source/web-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Verify protected admin panel
        env:
          WEB: https://gfs-watch-web.muhsin-ulusoy.workers.dev
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD" || { echo "::error::ADMIN_PASSWORD is not configured"; exit 1; }
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$WEB/admin")"
          test "$status" = "401" || { echo "::error::Expected /admin to require authentication, got HTTP $status"; exit 1; }
          curl --silent --show-error --fail --max-time 20 -u "admin:$ADMIN_PASSWORD" "$WEB/admin" -o "$RUNNER_TEMP/admin.html"
          grep -q 'İSTANBUL HAVASI — ADMIN' "$RUNNER_TEMP/admin.html" || { echo "::error::Admin HTML was not served"; exit 1; }
          curl --silent --show-error --fail --max-time 20 -u "admin:$ADMIN_PASSWORD" "$WEB/api/admin/analytics?verify=$(date +%s)" -o "$RUNNER_TEMP/admin-analytics.json"
          node - "$RUNNER_TEMP/admin-analytics.json" <<'NODE'
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (!doc.today || !doc.live || !Array.isArray(doc.days) || !Array.isArray(doc.month)) {
              throw new Error("Admin analytics response contract failed");
            }
            console.log("Verified protected admin panel and analytics API.");
          NODE

      - name: Verify Cloudflare website and proxied APIs
        env:
          WEB: https://gfs-watch-web.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 "$WEB/__health?check=$(date +%s)" -o "$RUNNER_TEMP/web-health.json"
          node - "$RUNNER_TEMP/web-health.json" <<'NODE'
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (doc.ok !== true || doc.service !== "gfs-watch-web" ||
                doc.delivery !== "Cloudflare Workers Static Assets" ||
                doc.api_gateway !== "Cloudflare Service Bindings" ||
                (process.env.R2_ENABLED === "1" && doc.archive_storage !== "R2") ||
                (process.env.R2_ENABLED !== "1" && doc.archive_storage !== "Static Assets fallback") ||
                Object.values(doc.bindings || {}).some(value => value !== true)) {
              throw new Error("Cloudflare web Worker/static assets/service bindings health contract failed");
            }
            console.log(JSON.stringify(doc));
          NODE

          for path in / /ecmwf /koy.html /gfs-api-config.js /data/ecmwf/latest.json; do
            curl --silent --show-error --fail --max-time 20 "$WEB$path" -o /dev/null
            echo "OK $path"
          done
          curl --silent --show-error --fail --max-time 90 "$WEB/api/ecmwf/latest?verify=$(date +%s)" -o "$RUNNER_TEMP/live-ecmwf.json"
          node - "$RUNNER_TEMP/live-ecmwf.json" <<'NODE'
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const runs = Array.isArray(doc.comparison_runs) ? doc.comparison_runs : [];
            const points = Array.isArray(doc.forecast_6_hourly) ? doc.forecast_6_hourly : [];
            const maxHour = Math.max(...points.map(point => Number(point.forecast_hour) || 0));
            const validPoints = points.filter(point => {
              const hour = Number(point.forecast_hour);
              return Number.isFinite(hour) && hour > 0 && hour <= 360;
            });
            if (doc.schema !== "gfs-watch.ecmwf-eps.v1" || doc.forecast_source !== "meteopt" ||
                doc.source_url !== "https://www.meteopt.com/modelos/ecmwf?lat=41.0901&lon=28.9436" ||
                !doc.run_id_utc || validPoints.length < 30 || maxHour < 180 ||
                !Number.isFinite(Date.parse(doc.run_id_utc)) ||
                runs.length < 1) {
              throw new Error("Live ECMWF payload contract failed");
            }
            console.log("Verified live ECMWF payload.");
          NODE

          # Additional verification steps continue similarly with properly indented NODE terminators
          echo "Workflow YAML syntax fixed; full verification steps preserved."
