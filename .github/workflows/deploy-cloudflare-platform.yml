name: Deploy Cloudflare Platform

on:
  # Production runtime is Cloudflare-native. GitHub only deploys code from main.
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/brand/**"
      - "scripts/build_site_icons.py"
      - "web-worker/**"
      - "istanbul-gfs-worker/**"
      - "shared/meteopt-source.js"
      - "gfs/notifications/**"
      - "gfs/**"
      - "!gfs/notifications/telegram-sent/**"
      - "mgm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-platform-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare website + Static Assets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out application source
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 1
