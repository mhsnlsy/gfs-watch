name: Main Station Data Refresh

on:
  # Primary five-minute station collection schedule.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main-station-refresh.yml"
      - "scripts/eyupsultan_weather.mjs"
      - "scripts/sisli_weather.mjs"
      - "scripts/update_station_observation.py"
      - "enka_weather.py"

permissions:
  contents: write

# Do not cancel an active collection. Keep cycles serialized so history
# files cannot be overwritten by overlapping runs.
concurrency:
  group: main-station-refresh
  cancel-in-progress: false

jobs:
  enka:
    name: ENKA Balmumcu
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ENKA OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python -m pip install --disable-pip-version-check requests pillow pytesseract

      - name: Prepare ENKA-only workspace
        run: |
          set -euo pipefail
          mkdir -p site/data public .station-work/enka
          if [ -s site/data/station-temperature-history.json ]; then
            cp site/data/station-temperature-history.json .station-work/enka/station-temperature-history.json
          fi

      - name: Collect and validate ENKA Balmumcu
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          STATION_PREVIOUS_OBSERVATION_PATH: site/data/station-observation.json
          STATION_TEMPERATURE_HISTORY_PATH: .station-work/enka/station-temperature-history.json
        run: |
          set -euo pipefail
          python -u enka_weather.py
          test -s public/station-observation.json
          test -s .station-work/enka/station-temperature-history.json
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("public/station-observation.json").read_text())["station_observation"]
          age = float(s.get("age_minutes", 9999))
          if age > 20 or s.get("is_stale") or s.get("temperature_2m_c") is None:
              raise SystemExit(f"ENKA observation invalid/stale: age={age}")
          PY
          cp public/station-observation.json .station-work/enka/station-observation.json

      - name: Upload ENKA data
        uses: actions/upload-artifact@v4
        with:
          name: enka-station-data
          path: .station-work/enka/*
          if-no-files-found: error
          retention-days: 1

  eyupsultan:
    name: Eyüpsultan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python for validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Eyüpsultan-only workspace
        run: |
          set -euo pipefail
          mkdir -p site/data public .station-work/eyupsultan
          for f in eyupsultan-station-temperature-history.json eyupsultan-station-rain-history.json; do
            if [ -s "site/data/$f" ]; then cp "site/data/$f" ".station-work/eyupsultan/$f"; fi
          done

      - name: Collect and validate Eyüpsultan
        env:
          EYUPSULTAN_TEMPERATURE_HISTORY_PATH: .station-work/eyupsultan/eyupsultan-station-temperature-history.json
          EYUPSULTAN_RAIN_HISTORY_PATH: .station-work/eyupsultan/eyupsultan-station-rain-history.json
        run: |
          set -euo pipefail
          node scripts/eyupsultan_weather.mjs
          test -s public/eyupsultan-station-observation.json
          test -s .station-work/eyupsultan/eyupsultan-station-temperature-history.json
          test -s .station-work/eyupsultan/eyupsultan-station-rain-history.json
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("public/eyupsultan-station-observation.json").read_text())["station_observation"]
          age = float(s.get("age_minutes", 9999))
          if age > 20 or s.get("is_stale") or s.get("temperature_2m_c") is None:
              raise SystemExit(f"Eyüpsultan observation invalid/stale: age={age}")
          PY
          cp public/eyupsultan-station-observation.json .station-work/eyupsultan/eyupsultan-station-observation.json

      - name: Upload Eyüpsultan data
        uses: actions/upload-artifact@v4
        with:
          name: eyupsultan-station-data
          path: .station-work/eyupsultan/*
          if-no-files-found: error
          retention-days: 1

  sisli:
    name: Şişli
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python for validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Şişli-only workspace
        run: |
          set -euo pipefail
          mkdir -p site/data public .station-work/sisli
          for f in sisli-station-temperature-history.json sisli-station-rain-history.json; do
            if [ -s "site/data/$f" ]; then cp "site/data/$f" ".station-work/sisli/$f"; fi
          done

      - name: Collect and validate Şişli
        env:
          SISLI_TEMPERATURE_HISTORY_PATH: .station-work/sisli/sisli-station-temperature-history.json
          SISLI_RAIN_HISTORY_PATH: .station-work/sisli/sisli-station-rain-history.json
        run: |
          set -euo pipefail
          node scripts/sisli_weather.mjs
          test -s public/sisli-station-observation.json
          test -s .station-work/sisli/sisli-station-temperature-history.json
          test -s .station-work/sisli/sisli-station-rain-history.json
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("public/sisli-station-observation.json").read_text())["station_observation"]
          age = float(s.get("age_minutes", 9999))
          if age > 20 or s.get("is_stale") or s.get("temperature_2m_c") is None:
              raise SystemExit(f"Şişli observation invalid/stale: age={age}")
          PY
          cp public/sisli-station-observation.json .station-work/sisli/sisli-station-observation.json

      - name: Upload Şişli data
        uses: actions/upload-artifact@v4
        with:
          name: sisli-station-data
          path: .station-work/sisli/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish successful station results
    runs-on: ubuntu-latest
    needs: [enka, eyupsultan, sisli]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare publication folders
        run: mkdir -p site/data .station-work/enka .station-work/eyupsultan .station-work/sisli

      - name: Download ENKA result
        if: needs.enka.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: enka-station-data
          path: .station-work/enka

      - name: Download Eyüpsultan result
        if: needs.eyupsultan.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: eyupsultan-station-data
          path: .station-work/eyupsultan

      - name: Download Şişli result
        if: needs.sisli.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sisli-station-data
          path: .station-work/sisli

      - name: Publish each successful station independently
        run: |
          set -euo pipefail
          if [ -s .station-work/enka/station-observation.json ]; then
            cp .station-work/enka/station-observation.json site/data/station-observation.json
            cp .station-work/enka/station-temperature-history.json site/data/station-temperature-history.json
          fi
          if [ -s .station-work/eyupsultan/eyupsultan-station-observation.json ]; then
            cp .station-work/eyupsultan/eyupsultan-station-observation.json site/data/eyupsultan-station-observation.json
            cp .station-work/eyupsultan/eyupsultan-station-temperature-history.json site/data/eyupsultan-station-temperature-history.json
            cp .station-work/eyupsultan/eyupsultan-station-rain-history.json site/data/eyupsultan-station-rain-history.json
          fi
          if [ -s .station-work/sisli/sisli-station-observation.json ]; then
            cp .station-work/sisli/sisli-station-observation.json site/data/sisli-station-observation.json
            cp .station-work/sisli/sisli-station-temperature-history.json site/data/sisli-station-temperature-history.json
            cp .station-work/sisli/sisli-station-rain-history.json site/data/sisli-station-rain-history.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No station data changes to publish."
            exit 0
          fi
          git commit -m "Update live station observations"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish station data to main."
          exit 1

  deploy-live-site:
    name: Deploy refreshed station data to GitHub Pages
    needs: publish
    uses: ./.github/workflows/pages-live.yml
    permissions:
      contents: read
      pages: write
      id-token: write
