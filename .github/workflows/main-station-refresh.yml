name: Main Station Data Refresh

on:
  # Each collector re-arms its next five-minute run through workflow_dispatch.
  workflow_dispatch:
  push:
    branches: [main]
    # Wake on ordinary main-branch changes like Köy MGM, but never on station-output commits.
    paths-ignore:
      - "site/data/station-observation.json"
      - "site/data/station-temperature-history.json"
      - "site/data/eyupsultan-station-observation.json"
      - "site/data/eyupsultan-station-temperature-history.json"
      - "site/data/eyupsultan-station-rain-history.json"
      - "site/data/sisli-station-observation.json"
      - "site/data/sisli-station-temperature-history.json"
      - "site/data/sisli-station-rain-history.json"

permissions:
  actions: write
  contents: write

# Do not cancel an active collection. Keep cycles serialized so history
# files cannot be overwritten by overlapping runs.
concurrency:
  group: main-station-refresh
  cancel-in-progress: false

jobs:
  cycle-start:
    name: Stamp this independent five-minute cycle
    runs-on: ubuntu-latest
    outputs:
      started_epoch: ${{ steps.stamp.outputs.started_epoch }}
    steps:
      - name: Record cycle start time
        id: stamp
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  enka:
    needs: cycle-start
    name: ENKA Balmumcu
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ENKA OCR dependencies
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            if ! sudo apt-get install -y --no-install-recommends tesseract-ocr; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends tesseract-ocr
            fi
          fi
          python -m pip install --disable-pip-version-check requests pillow pytesseract
          tesseract --version

      - name: Prepare ENKA-only workspace
        run: |
          set -euo pipefail
          mkdir -p site/data public .station-work/enka
          if [ -s site/data/station-temperature-history.json ]; then
            cp site/data/station-temperature-history.json .station-work/enka/station-temperature-history.json
          fi

      - name: Collect and validate ENKA Balmumcu
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          STATION_PREVIOUS_OBSERVATION_PATH: site/data/station-observation.json
          STATION_TEMPERATURE_HISTORY_PATH: .station-work/enka/station-temperature-history.json
        run: |
          set -euo pipefail
          python -u enka_weather.py
          test -s public/station-observation.json
          test -s .station-work/enka/station-temperature-history.json
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("public/station-observation.json").read_text())["station_observation"]
          age = float(s.get("age_minutes", 9999))
          if age > 20 or s.get("is_stale") or s.get("temperature_2m_c") is None:
              raise SystemExit(f"ENKA observation invalid/stale: age={age}")
          PY
          cp public/station-observation.json .station-work/enka/station-observation.json

      - name: Upload ENKA data
        uses: actions/upload-artifact@v4
        with:
          name: enka-station-data
          path: .station-work/enka/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish successful station results
    runs-on: ubuntu-latest
    needs: [cycle-start, enka]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare publication folders
        run: mkdir -p site/data .station-work/enka

      - name: Download ENKA result
        if: needs.enka.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: enka-station-data
          path: .station-work/enka

      - name: Publish each successful station independently
        run: |
          set -euo pipefail
          if [ -s .station-work/enka/station-observation.json ]; then
            cp .station-work/enka/station-observation.json site/data/station-observation.json
            cp .station-work/enka/station-temperature-history.json site/data/station-temperature-history.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No station data changes to publish."
            exit 0
          fi
          git commit -m "Update live station observations"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish station data to main."
          exit 1

  deploy-live-site:
    if: ${{ always() && needs.publish.result == 'success' }}
    name: Deploy refreshed station data to GitHub Pages
    needs: publish
    uses: ./.github/workflows/pages-live.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  rearm-next-cycle:
    name: Queue next ENKA cycle
    needs: [cycle-start, publish]
    if: ${{ always() && needs.cycle-start.result == 'success' && needs['publish'].result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait until the next five-minute interval
        env:
          CYCLE_STARTED_EPOCH: ${{ needs.cycle-start.outputs.started_epoch }}
        run: |
          set -euo pipefail
          now="$(date +%s)"
          elapsed=$((now - CYCLE_STARTED_EPOCH))
          wait_seconds=$((300 - elapsed))
          if [ "$wait_seconds" -gt 0 ]; then
            echo "Waiting ${wait_seconds}s to maintain a five-minute cadence."
            sleep "$wait_seconds"
          else
            echo "Collection took five minutes or longer; rearming immediately."
          fi

      - name: Dispatch the next ENKA cycle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/main-station-refresh.yml/dispatches"
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.json" --write-out "%{http_code}" \
              --request POST "$url" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data '{"ref":"main"}')"
            if [ "$status" = "204" ]; then
              echo "Next ENKA cycle successfully queued."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed with HTTP $status."
            cat "$RUNNER_TEMP/dispatch-response.json"
            sleep 5
          done
          echo "Could not queue the next ENKA cycle."
          exit 1
