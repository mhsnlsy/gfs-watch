name: Deploy İstanbul'un Havası Live

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website source and live station data
        uses: actions/checkout@v5
        with:
          ref: main
          path: source

      - name: Check out GFS forecast data
        uses: actions/checkout@v5
        with:
          ref: gfs-watch-state
          path: forecast-data

      - name: Check out Köy GFS data
        uses: actions/checkout@v5
        with:
          ref: koy-gfs-data
          path: koy-data

      - name: Check out Köy MGM data
        uses: actions/checkout@v5
        with:
          ref: koy-mgm-data
          path: koy-mgm-data

      - name: Assemble live website
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp -a source/site/. _site/
          # GFS and station collectors are independent. A temporary GFS
          # outage must not prevent fresh station observations from reaching Pages.
          if [ -s forecast-data/public/latest.json ]; then
            cp -a forecast-data/public/. _site/data/
            echo "GFS forecast payload present; publishing it."
          else
            echo "GFS forecast payload unavailable; publishing station data independently."
          fi
          for file in station-observation.json station-temperature-history.json eyupsultan-station-observation.json eyupsultan-station-temperature-history.json eyupsultan-station-rain-history.json sisli-station-observation.json sisli-station-temperature-history.json sisli-station-rain-history.json; do
            if [ -s "source/site/data/$file" ]; then cp "source/site/data/$file" "_site/data/$file"; fi
          done
          printf '{"apiBaseUrl":"%s"}' "$PUSH_API_URL" > _site/push-config.json
          mkdir -p _site/koy-data
          if [ -d koy-data/gfs ]; then cp -a koy-data/gfs _site/koy-data/; fi
          if [ -d koy-mgm-data/mgm ]; then mkdir -p _site/koy-data/mgm; cp -a koy-mgm-data/mgm/. _site/koy-data/mgm/; fi
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/data/latest.json
          test -s _site/data/station-observation.json
          test -s _site/data/eyupsultan-station-observation.json
          test -s _site/data/sisli-station-observation.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
