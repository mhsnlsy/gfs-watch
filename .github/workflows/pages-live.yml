name: Deploy İstanbul'un Havası Live

on:
  workflow_call:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Check out published station and forecast data
        uses: actions/checkout@v4
        with:
          ref: gfs-watch-state
          path: forecast-data

      - name: Check out independent ENKA station data
        id: enka_data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: enka-state
          path: enka-data

      - name: Check out independent Eyüpsultan station data
        id: eyupsultan_data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: eyupsultan-state
          path: eyupsultan-data

      - name: Check out independent Şişli station data
        id: sisli_data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: sisli-state
          path: sisli-data

      - name: Check out Köy GFS data
        uses: actions/checkout@v4
        with:
          ref: koy-gfs-data
          path: koy-data

      - name: Check out Köy MGM data
        uses: actions/checkout@v4
        with:
          ref: koy-mgm-data
          path: koy-mgm-data

      - name: Assemble live website
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
        run: |
          set -euo pipefail
          test -s forecast-data/public/latest.json
          mkdir -p _site/data
          cp -a source/site/. _site/
          # GFS/forecast payloads come only from gfs-watch-state.
          cp -a forecast-data/public/. _site/data/
          # Station payloads come from their own branches and overwrite only
          # their own files. A station can never replace another station's data.
          if [ -s enka-data/public/station-observation.json ] && [ -s enka-data/public/station-temperature-history.json ]; then
            cp enka-data/public/station-observation.json _site/data/station-observation.json
            cp enka-data/public/station-temperature-history.json _site/data/station-temperature-history.json
            echo "ENKA dedicated payload applied."
          else
            echo "ENKA dedicated branch unavailable; retaining last GFS-state copy."
          fi
          if [ -s eyupsultan-data/public/eyupsultan-station-observation.json ] && [ -s eyupsultan-data/public/eyupsultan-station-temperature-history.json ] && [ -s eyupsultan-data/public/eyupsultan-station-rain-history.json ]; then
            cp eyupsultan-data/public/eyupsultan-station-observation.json _site/data/eyupsultan-station-observation.json
            cp eyupsultan-data/public/eyupsultan-station-temperature-history.json _site/data/eyupsultan-station-temperature-history.json
            cp eyupsultan-data/public/eyupsultan-station-rain-history.json _site/data/eyupsultan-station-rain-history.json
            echo "Eyüpsultan dedicated payload applied."
          else
            echo "Eyüpsultan dedicated branch unavailable; retaining last GFS-state copy."
          fi
          if [ -s sisli-data/public/sisli-station-observation.json ] && [ -s sisli-data/public/sisli-station-temperature-history.json ] && [ -s sisli-data/public/sisli-station-rain-history.json ]; then
            cp sisli-data/public/sisli-station-observation.json _site/data/sisli-station-observation.json
            cp sisli-data/public/sisli-station-temperature-history.json _site/data/sisli-station-temperature-history.json
            cp sisli-data/public/sisli-station-rain-history.json _site/data/sisli-station-rain-history.json
            echo "Şişli dedicated payload applied."
          else
            echo "Şişli dedicated branch unavailable; retaining last GFS-state copy."
          fi
          printf '{"apiBaseUrl":"%s"}' "$PUSH_API_URL" > _site/push-config.json

          mkdir -p _site/koy-data
          if [ -d koy-data/gfs ]; then cp -a koy-data/gfs _site/koy-data/; fi
          if [ -d koy-mgm-data/mgm ]; then
            mkdir -p _site/koy-data/mgm
            cp -a koy-mgm-data/mgm/. _site/koy-data/mgm/
          fi

          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/data/latest.json
          test -s _site/data/station-observation.json
          test -s _site/data/eyupsultan-station-observation.json
          test -s _site/data/sisli-station-observation.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
