name: Deploy Admin Panel

on:
  push:
    branches: [main]
    paths:
      - "web-worker/src/index.js"
      - "web-worker/admin-assets/**"
      - "web-worker/wrangler.jsonc"
      - "web-worker/migrations/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-panel-deploy
  cancel-in-progress: true

jobs:
  deploy-admin:
    name: Deploy Istanbul Havası Admin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Prepare D1 config
        working-directory: web-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          D1_LIST="$(wrangler d1 list 2>&1)"
          printf '%s\n' "$D1_LIST"

          D1_ID="$(printf '%s\n' "$D1_LIST" |
            grep 'gfs-watch-web-analytics' |
            grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' |
            head -n1 || true)"

          if [ -z "$D1_ID" ]; then
            echo "Creating gfs-watch-web-analytics..."
            D1_CREATE="$(wrangler d1 create gfs-watch-web-analytics 2>&1)"
            printf '%s\n' "$D1_CREATE"
            D1_ID="$(printf '%s\n' "$D1_CREATE" |
              grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' |
              head -n1 || true)"
          fi

          test -n "$D1_ID"
          sed -i "s/__D1_DATABASE_ID__/$D1_ID/g" wrangler.jsonc
          echo "D1_ID=$D1_ID"

      - name: Apply analytics migration
        working-directory: web-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 migrations apply gfs-watch-web-analytics --remote --config wrangler.jsonc

      - name: Set admin password
        working-directory: web-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          printf '%s' "$ADMIN_PASSWORD" |
            wrangler secret put ADMIN_PASSWORD --config wrangler.jsonc

      - name: Build static assets
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
        run: |
          set -euo pipefail
          rm -rf web-worker/public
          mkdir -p web-worker/public
          cp -a site/. web-worker/public/
          mkdir -p web-worker/public/admin
          cp web-worker/admin-assets/index.html web-worker/public/admin/index.html
          cp web-worker/admin-assets/analytics.js web-worker/public/analytics.js
          printf '{"apiBaseUrl":"%s"}' "$PUSH_API_URL" > web-worker/public/push-config.json
          touch web-worker/public/.nojekyll

          test -s web-worker/public/index.html
          test -s web-worker/public/admin/index.html
          test -s web-worker/public/analytics.js

      - name: Deploy admin-capable Worker
        working-directory: web-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.jsonc

      - name: Verify admin protection and endpoint
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          WEB="https://gfs-watch-web.muhsin-ulusoy.workers.dev"

          status="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$WEB/admin")"
          echo "Unauthenticated /admin HTTP status: $status"
          test "$status" = "401"

          admin_status="$(curl -sS -o /tmp/admin.html -w "%{http_code}" --max-time 20             -u "admin:$ADMIN_PASSWORD" "$WEB/admin")"
          echo "Authenticated /admin HTTP status: $admin_status"
          test "$admin_status" = "200"
          grep -Fq 'admin-build' /tmp/admin.html || {
            echo "Admin HTML marker missing; first 40 lines:"
            sed -n '1,40p' /tmp/admin.html
            exit 1
          }

          api_status="$(curl -sS -o /tmp/analytics.json -w "%{http_code}" --max-time 20             -u "admin:$ADMIN_PASSWORD" "$WEB/api/admin/analytics")"
          echo "Authenticated analytics API HTTP status: $api_status"
          test "$api_status" = "200"

          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/analytics.json","utf8"));if(d.ok!==true)process.exit(1);console.log("Admin analytics API OK")'

          echo "Admin deployment verified."
