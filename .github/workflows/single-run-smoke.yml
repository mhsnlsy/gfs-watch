name: Single Runs API smoke test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/single-run-smoke.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Inspect Open-Meteo GFS metadata and single run API
        run: |
          python - <<'PY'
          import requests

          for name in ("in-progress", "latest"):
              url = f"https://openmeteo.s3.amazonaws.com/data_spatial/ncep_gfs013/{name}.json"
              response = requests.get(url, headers={"Cache-Control": "no-cache"}, timeout=20)
              print(name, "HTTP:", response.status_code)
              response.raise_for_status()
              data = response.json()
              print(name, "keys:", sorted(data.keys()))
              print(name, "reference_time:", data.get("reference_time"))
              print(name, "valid_times count:", len(data.get("valid_times", [])))
              if data.get("valid_times"):
                  print(name, "first/last valid time:", data["valid_times"][0], data["valid_times"][-1])

          params = {
              "latitude": 41.014,
              "longitude": 28.950,
              "run": "2026-10-31T00:00",
              "models": "ncep_gfs_global",
              "hourly": "temperature_2m,precipitation",
              "forecast_hours": 181,
              "timezone": "Europe/Istanbul",
          }
          response = requests.get(
              "https://single-runs-api.open-meteo.com/v1/forecast",
              params=params,
              timeout=30,
          )
          print("Single Runs HTTP:", response.status_code)
          response.raise_for_status()
          data = response.json()
          times = data.get("hourly", {}).get("time", [])
          print("Single Runs first/last:", times[0] if times else "MISSING", times[-1] if times else "MISSING")
          print("Single Runs hourly rows:", len(times))
          assert len(times) >= 181, "Single Runs API did not return the requested 181 hours"
          print("SINGLE RUNS API SMOKE TEST PASSED")
          PY
