name: Deploy Cloudflare Köy GFS Service

on:
  push:
    branches: [main]
    paths:
      - "koy-gfs-worker/**"
      - "shared/**"
      - ".github/workflows/deploy-koy-gfs-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-koy-gfs-service
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Köy GFS Worker + D1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Create or locate production D1
        working-directory: koy-gfs-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"

          D1_ID="$(node - "$RUNNER_TEMP/d1-list.json" <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          function walk(value) {
            if (!value) return null;
            if (Array.isArray(value)) {
              for (const item of value) { const found = walk(item); if (found) return found; }
              return null;
            }
            if (typeof value !== "object") return null;
            const name = value.name || value.database_name || value.databaseName;
            const id = value.uuid || value.database_id || value.databaseId;
            if (name === "gfs-watch-koy-gfs" && id) return String(id);
            for (const child of Object.values(value)) { const found = walk(child); if (found) return found; }
            return null;
          }
          process.stdout.write(walk(data) || "");
          NODE

          )"

          if [ -z "$D1_ID" ]; then
            echo "Creating production D1 database..."
            wrangler d1 create gfs-watch-koy-gfs --location eeur
            wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
            D1_ID="$(node - "$RUNNER_TEMP/d1-list.json" <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          function walk(value) {
            if (!value) return null;
            if (Array.isArray(value)) {
              for (const item of value) { const found = walk(item); if (found) return found; }
              return null;
            }
            if (typeof value !== "object") return null;
            const name = value.name || value.database_name || value.databaseName;
            const id = value.uuid || value.database_id || value.databaseId;
            if (name === "gfs-watch-koy-gfs" && id) return String(id);
            for (const child of Object.values(value)) { const found = walk(child); if (found) return found; }
            return null;
          }
          process.stdout.write(walk(data) || "");
          NODE
            )"
          fi

          test -n "$D1_ID" || { echo "::error::Could not resolve gfs-watch-koy-gfs D1 database ID"; exit 1; }

          node - "$D1_ID" wrangler.jsonc <<'NODE'
          const fs = require("fs");
          const id = process.argv[2];
          const file = process.argv[3];
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          const binding = (config.d1_databases || []).find(item => item.database_name === "gfs-watch-koy-gfs");
          if (!binding) throw new Error("GFS_DB binding missing in wrangler config");
          binding.database_id = id;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Apply D1 migrations
        working-directory: koy-gfs-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply gfs-watch-koy-gfs --remote --config wrangler.jsonc

      - name: Deploy the ten-minute Köy GFS Worker
        working-directory: koy-gfs-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Verify live Köy GFS API and autonomous Cron
        env:
          KOY_GFS_API: https://gfs-watch-koy-gfs.muhsin-ulusoy.workers.dev/api
        run: |
          set -euo pipefail
          HEALTH_OK=0
          for attempt in $(seq 1 8); do
            if curl --silent --show-error --fail --max-time 15 "$KOY_GFS_API/health?check=$(date +%s)" -o "$RUNNER_TEMP/koy-health.json"; then
              if node - "$RUNNER_TEMP/koy-health.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (doc.ok !== true || doc.service !== "gfs-watch-koy-gfs" || doc.cron !== "*/10 * * * *") {
            throw new Error("Köy GFS Worker health contract failed");
          }
          if (doc.svg_renderer !== "cloudflare-js-v1") {
            throw new Error("Köy SVG renderer is not running in Cloudflare: " + doc.svg_renderer);
          }
          console.log(JSON.stringify(doc));
          NODE
              then
                HEALTH_OK=1
                break
              fi
            fi
            echo "Waiting for Köy GFS Worker deployment/health... ($attempt/8)"
            sleep 10
          done
          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "::error::Köy GFS Worker health endpoint did not become available or failed its contract."
            [ -s "$RUNNER_TEMP/koy-health.json" ] && cat "$RUNNER_TEMP/koy-health.json" || true
            exit 1
          fi

          echo "Testing live F72 collection..."
          curl --silent --show-error --fail --max-time 60 "$KOY_GFS_API/f72?check=$(date +%s)" -o "$RUNNER_TEMP/koy-f72.json"

      - name: Verify live F72 MeteoPT snow-line contract
        env:
          KOY_GFS_API: https://gfs-watch-koy-gfs.muhsin-ulusoy.workers.dev/api
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/koy-f72.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(doc.forecast_6_hourly) || doc.forecast_6_hourly.length < 12 || doc.forecast_source !== "meteopt") {
            console.error(JSON.stringify(doc, null, 2));
            throw new Error("Köy GFS F72 live payload is missing or incomplete");
          }
          const f72Points = doc.forecast_6_hourly.filter(point => {
            const hour = Number(point?.forecast_hour);
            return hour > 0 && hour <= 72;
          });
          const missingSnowln = f72Points.filter(point =>
            !Object.prototype.hasOwnProperty.call(point, "snowln")
          );
          if (!f72Points.length || missingSnowln.length) {
            throw new Error("Köy GFS F72 payload is missing MeteoPT snowln values on forecast points");
          }
          const numericSnowlnPoints = f72Points.filter(point =>
            point.snowln !== null && point.snowln !== undefined &&
            Number.isFinite(Number(point.snowln))
          );
          if (!numericSnowlnPoints.length) {
            throw new Error("MeteoPT snowln field exists but contains no numeric values; refusing to publish an empty column");
          }
          const numericHumidityPoints = f72Points.filter(point =>
            point.humidity_2m_percent !== null && point.humidity_2m_percent !== undefined &&
            Number.isFinite(Number(point.humidity_2m_percent))
          );
          if (numericHumidityPoints.length !== f72Points.length) {
            throw new Error("MeteoPT rh2m humidity is missing or non-numeric on one or more F72 steps; dew point column would be incomplete");
          }
          console.log(JSON.stringify({
            run_id_utc: doc.run_id_utc,
            forecast_source: doc.forecast_source,
            points: doc.forecast_6_hourly.length,
            snowln_field_points: f72Points.length,
            snowln_numeric_points: numericSnowlnPoints.length,
            humidity_numeric_points: numericHumidityPoints.length,
            first_valid_time_utc: doc.forecast_6_hourly[0]?.valid_time_utc || null,
            last_valid_time_utc: doc.forecast_6_hourly.at(-1)?.valid_time_utc || null
          }));
          NODE
          
          ARCHIVED_RUNS="$(node - "$RUNNER_TEMP/koy-health.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          process.stdout.write(String(Number(doc.archived_runs || 0)));
          NODE
          )"
          if [ "$ARCHIVED_RUNS" -ge 4 ]; then
            echo "Testing Worker-native four-panel SVG rendering and D1 persistence..."
            curl --silent --show-error --fail --max-time 45 \
              "$KOY_GFS_API/comparison.svg?deploy_check=$(date +%s)" \
              --dump-header "$RUNNER_TEMP/koy-svg-headers.txt" \
              --output "$RUNNER_TEMP/koy-comparison.svg"
            grep -qi '^x-gfs-publication-source: D1' "$RUNNER_TEMP/koy-svg-headers.txt"
            grep -q 'id="gfs-renderer-version">cloudflare-js-v1</metadata>' "$RUNNER_TEMP/koy-comparison.svg"
            grep -q 'id="gfs-interactive-data"' "$RUNNER_TEMP/koy-comparison.svg"
            echo "Worker-native Köy SVG is generated and stored in D1."
          else
            echo "::notice::Four archived cycles are not available yet; Köy SVG generation will activate automatically when D1 has four cycles."
          fi
