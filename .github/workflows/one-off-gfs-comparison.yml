name: One-off GFS Four-Cycle Comparison
# Re-run after adding date and Turkish weekday labels to every chart panel.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-off-gfs-comparison.yml"

permissions:
  contents: read

jobs:
  send-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore GFS run history (read only)
        run: |
          git fetch origin gfs-watch-state
          git show origin/gfs-watch-state:gfs_watch.db > gfs_watch.db
      - name: Send the 30 Oct 12Z to 31 Oct 06Z comparison once
        env:
          DB_PATH: gfs_watch.db
          GFS_WATCH_COMPARE_RUN_IDS: "2026-10-30T12:00:00+00:00,2026-10-30T18:00:00+00:00,2026-10-31T00:00:00+00:00,2026-10-31T06:00:00+00:00"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u main.py
