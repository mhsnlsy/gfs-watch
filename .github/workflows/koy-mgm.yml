name: Köy MGM

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: koy-mgm-independent
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last valid MGM snapshot and history
        run: |
          set -euo pipefail
          mkdir -p output
          git fetch origin refs/heads/koy-mgm-data:refs/remotes/origin/koy-mgm-data || true
          if git show-ref --verify --quiet refs/remotes/origin/koy-mgm-data; then
            for name in latest.json observation.json history.json rain-history-72h.json; do
              source="origin/koy-mgm-data:mgm/$name"
              if git cat-file -e "$source" 2>/dev/null; then
                git show "$source" > "output/$name"
              fi
            done
            echo "Previous valid MGM snapshot and archives restored."
          else
            echo "No previous MGM archive exists; first successful collection will initialize it."
          fi
      - name: Fetch optional MGM Giresun-Çanakçı forecast page
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = "https://mgm.gov.tr/tahmin/il-ve-ilceler.aspx?il=Giresun&ilce=%C3%87anak%C3%A7%C4%B1"
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; Koy-MGM/1.1)",
              "Accept": "text/html,application/xhtml+xml",
              "Cache-Control": "no-cache",
          }
          last_error = None
          for attempt in range(1, 2):
              try:
                  request = Request(url, headers=headers)
                  with urlopen(request, timeout=8) as response:
                      html = response.read().decode("utf-8", errors="replace")
                      status = response.status
                  if status != 200 or "Çanakçı" not in html:
                      raise RuntimeError(f"MGM Çanakçı page validation failed (HTTP {status})")
                  payload = {
                      "schema": "koy-mgm.page-snapshot.v1",
                      "location": {"province": "Giresun", "district": "Çanakçı"},
                      "source": "Meteoroloji Genel Müdürlüğü",
                      "source_url": url,
                      "fetched_at_utc": datetime.now(timezone.utc).isoformat(),
                      "http_status": status,
                      "html": html,
                  }
                  Path("output/latest.json").write_text(
                      json.dumps(payload, ensure_ascii=False), encoding="utf-8"
                  )
                  print(f"MGM Çanakçı optional page fetched: {len(html)} characters")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"MGM forecast page attempt {attempt}/1 failed: {type(exc).__name__}: {exc}")
          else:
              # The HTML forecast page is not used for live station metrics.
              # Keep the last known page snapshot and let the structured API run.
              previous = Path("output/latest.json")
              if previous.is_file() and previous.stat().st_size > 0:
                  print(f"WARNING: keeping previous optional MGM page snapshot: {last_error}")
              else:
                  payload = {
                      "schema": "koy-mgm.page-snapshot.v1",
                      "location": {"province": "Giresun", "district": "Çanakçı"},
                      "source": "Meteoroloji Genel Müdürlüğü",
                      "source_url": url,
                      "fetched_at_utc": None,
                      "http_status": None,
                      "html": None,
                      "fetch_error": f"{type(last_error).__name__}: {last_error}",
                  }
                  previous.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
                  print("WARNING: optional MGM page unavailable; initialized an empty snapshot.")
          PY
      - name: Fetch structured MGM station observation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen

          H = {
              "User-Agent": "Mozilla/5.0 (compatible; Koy-MGM/1.1)",
              "Accept": "application/json",
              "Origin": "https://www.mgm.gov.tr",
              "Referer": "https://www.mgm.gov.tr/",
              "Cache-Control": "no-cache",
          }

          def feels_like(temp_c, humidity, wind_kmh):
              try:
                  t=float(temp_c); rh=max(0.0,min(100.0,float(humidity)))
              except (TypeError, ValueError):
                  return None
              if t >= 20:
                  return round(-8.784 + 1.611*t + 2.338*rh - 0.146*t*rh - 0.0123*t*t - 0.0164*rh*rh + 0.00221*t*t*rh + 0.000725*t*rh*rh - 0.00000358*t*t*rh*rh, 1)
              if t <= 10 and wind_kmh is not None:
                  try:
                      w=max(0.0,float(wind_kmh))
                      return round(13.12 + 0.6215*t - 11.37*(w**0.16) + 0.3965*t*(w**0.16), 1)
                  except (TypeError, ValueError):
                      pass
              return round(t, 1)

          def get(url):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = Request(url, headers=H)
                      with urlopen(req, timeout=20) as response:
                          status = response.status
                          raw = response.read()
                      if status != 200:
                          raise RuntimeError(f"HTTP {status}")
                      return json.loads(raw.decode("utf-8-sig"))
                  except Exception as exc:
                      last_error = exc
                      print(
                          f"MGM API attempt {attempt}/3 failed for {url}: "
                          f"{type(exc).__name__}: {exc}"
                      )
                      if attempt < 3:
                          time.sleep(2 ** attempt)
              raise RuntimeError(
                  f"MGM API request failed after 3 attempts: {url}: "
                  f"{type(last_error).__name__}: {last_error}"
              ) from last_error

          try:
              centers = get("https://servis.mgm.gov.tr/web/merkezler?il=Giresun&ilce=Canakci")
              if not isinstance(centers, list) or not centers:
                  raise RuntimeError("MGM Çanakçı merkezi bulunamadı")
              center = next(
                  (x for x in centers if str(x.get("ilce", "")).casefold() == "çanakçı"),
                  centers[0],
              )
              merkez_id = center.get("merkezId")
              station_no = center.get("sondurumIstNo") or center.get("gunlukTahminIstNo")
              if not merkez_id:
                  raise RuntimeError("MGM Çanakçı merkezId bulunamadı")

              rows = get(f"https://servis.mgm.gov.tr/web/sondurumlar?merkezid={merkez_id}")
              if not isinstance(rows, list) or not rows:
                  raise RuntimeError("MGM Çanakçı son durum verisi boş")
              obs = rows[0]
              if not isinstance(obs, dict) or obs.get("sicaklik") is None or not obs.get("veriZamani"):
                  raise RuntimeError("MGM Çanakçı ölçüm verisi eksik veya zaman damgası yok")

              payload = {
                  "schema": "koy-mgm.station-observation.v1",
                  "station_id": str(station_no or obs.get("istNo") or merkez_id),
                  "station_name": "Çanakçı",
                  "center_id": merkez_id,
                  "latitude": center.get("enlem"),
                  "longitude": center.get("boylam"),
                  "elevation_m": center.get("yukseklik"),
                  "observed_at_utc": obs.get("veriZamani"),
                  "fetched_at_utc": datetime.now(timezone.utc).isoformat(),
                  "temperature_2m_c": obs.get("sicaklik"),
                  "humidity_percent": obs.get("nem"),
                  "feels_like_c": feels_like(obs.get("sicaklik"), obs.get("nem"), obs.get("ruzgarHiz")),
                  "wind_speed_10m_kmh": obs.get("ruzgarHiz"),
                  "wind_direction_deg": obs.get("ruzgarYon"),
                  "pressure_hpa": obs.get("aktuelBasinc"),
                  "sea_level_pressure_hpa": obs.get("denizeIndirgenmisBasinc"),
                  "precipitation_10m_mm": obs.get("yagis10Dk"),
                  "precipitation_1h_mm": obs.get("yagis1Saat"),
                  "precipitation_6h_mm": obs.get("yagis6Saat"),
                  "precipitation_12h_mm": obs.get("yagis12Saat"),
                  "precipitation_24h_mm": obs.get("yagis24Saat"),
                  "condition_code": obs.get("hadiseKodu"),
              }
              Path("output/observation.json").write_text(
                  json.dumps(payload, ensure_ascii=False), encoding="utf-8"
              )
              print("MGM Çanakçı fresh observation:", json.dumps(payload, ensure_ascii=False))
          except Exception as exc:
              # A brief MGM outage must not erase the last real measurement or stop
              # publication of its archives. Never fabricate a new observed_at time.
              cached_path = Path("output/observation.json")
              if not cached_path.is_file() or cached_path.stat().st_size == 0:
                  raise
              cached = json.loads(cached_path.read_text(encoding="utf-8"))
              cached["fetch_status"] = "stale_cached"
              cached["fetch_error"] = f"{type(exc).__name__}: {exc}"
              cached["last_fetch_attempt_at_utc"] = datetime.now(timezone.utc).isoformat()
              cached_path.write_text(
                  json.dumps(cached, ensure_ascii=False), encoding="utf-8"
              )
              print(
                  "WARNING: MGM did not respond after retries; "
                  "keeping the last valid observation without inventing a new measurement time. "
                  + cached["fetch_error"]
              )
          PY

      - name: Build independent MGM station history
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone, timedelta
          obs=json.loads(pathlib.Path("output/observation.json").read_text(encoding="utf-8"))
          history_path=pathlib.Path("output/history.json")
          if history_path.exists():
              doc=json.loads(history_path.read_text(encoding="utf-8"))
          else:
              doc={"schema":"koy-mgm.station-history.v1","station_id":obs["station_id"],"station_name":"Çanakçı","sampling_interval_minutes":5,"samples":[]}
          samples=doc.get("samples",[])
          samples=[s for s in samples if s.get("logged_at_utc")!=obs.get("fetched_at_utc")]
          samples.append({
              "observed_at_utc":obs.get("observed_at_utc"),
              "logged_at_utc":obs.get("fetched_at_utc"),
              "temperature_2m_c":obs.get("temperature_2m_c"),
              "feels_like_c":obs.get("feels_like_c"),
              "precipitation_10m_mm":obs.get("precipitation_10m_mm"),
              "precipitation_1h_mm":obs.get("precipitation_1h_mm"),
              "precipitation_6h_mm":obs.get("precipitation_6h_mm"),
              "humidity_percent":obs.get("humidity_percent"),
              "pressure_hpa":obs.get("pressure_hpa"),
              "wind_speed_10m_kmh":obs.get("wind_speed_10m_kmh")
          })
          cutoff=datetime.now(timezone.utc)-timedelta(days=7)
          kept=[]
          for s in samples:
              try:
                  t=datetime.fromisoformat(str(s.get("logged_at_utc")).replace("Z","+00:00"))
                  if t>=cutoff: kept.append(s)
              except Exception: pass
          kept.sort(key=lambda x:x.get("logged_at_utc",""))
          for s in kept:
              if s.get("feels_like_c") is None:
                  s["feels_like_c"]=feels_like(s.get("temperature_2m_c"), s.get("humidity_percent"), s.get("wind_speed_10m_kmh"))
          doc["samples"]=kept
          doc["updated_at_utc"]=obs.get("fetched_at_utc")
          cutoff_24h=datetime.now(timezone.utc)-timedelta(hours=24)
          recent_feels=[]
          for s in kept:
              stamp=s.get("observed_at_utc") or s.get("logged_at_utc")
              try:
                  when=datetime.fromisoformat(str(stamp).replace("Z","+00:00"))
                  if when >= cutoff_24h and s.get("feels_like_c") is not None:
                      recent_feels.append(float(s["feels_like_c"]))
              except Exception:
                  continue
          if recent_feels:
              doc["feels_like_24h_min_c"]=round(min(recent_feels),1)
              doc["feels_like_24h_max_c"]=round(max(recent_feels),1)
          else:
              doc["feels_like_24h_min_c"]=None
              doc["feels_like_24h_max_c"]=None
          pathlib.Path("output/history.json").write_text(json.dumps(doc,ensure_ascii=False),encoding="utf-8")
          print(f"MGM Çanakçı history: {len(kept)} samples")
          PY

      - name: Build virtual Köy Ev station at 363 m
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, math
          from datetime import datetime, timezone, timedelta

          obs=json.loads(pathlib.Path("output/observation.json").read_text(encoding="utf-8"))
          history=json.loads(pathlib.Path("output/history.json").read_text(encoding="utf-8"))
          HOME_ELEVATION_M=363.0
          # MGM Çanakçı center metadata currently reports 0 m, but the agreed
          # reference elevation for the real Çanakçı station is 146 m.
          # Keep the virtual-station correction tied to the physical reference,
          # not to the unreliable center metadata.
          station_elevation=146.0
          DELTA_M=HOME_ELEVATION_M-station_elevation

          def lapse_rate_km(temp_c, rh):
              # Adaptive environmental lapse estimate. Standard 6.5 K/km is
              # blended with a humidity-aware moist lapse estimate and clamped
              # to a realistic near-surface range.
              try:
                  t=float(temp_c); h=max(1.0,min(100.0,float(rh)))
              except (TypeError,ValueError):
                  return 6.5
              tk=t+273.15
              es=6.112*math.exp(17.67*t/(t+243.5))
              q=max(0.001,min(0.02,0.622*(h/100*es)/(1013.25-(h/100*es))))
              # Moist-adiabatic lapse rate:
              # Γm = g(1 + Lv*q/(Rd*T)) / (cp + Lv²*q*eps/(Rd*T²))
              # q is specific humidity (kg/kg).
              Lv=2501000.0
              Rd=287.05
              cp=1005.0
              eps=0.622
              gamma_m=9.81*(1.0+Lv*q/(Rd*tk))/(cp+(Lv*Lv*q*eps)/(Rd*tk*tk))
              moist=max(4.0,min(7.5,gamma_m*1000.0))
              # Keep the local estimate close to the standard environmental
              # lapse rate while allowing humidity to move it realistically.
              return max(5.0,min(7.2,0.65*6.5+0.35*moist))

          def adjust(sample):
              t=sample.get("temperature_2m_c")
              rh=sample.get("humidity_percent")
              if t is None: return None
              rate=lapse_rate_km(t,rh)
              ev_t=float(t)-rate*DELTA_M/1000.0
              p=sample.get("pressure_hpa")
              ev_p=None
              if p is not None:
                  try:
                      tk=float(t)+273.15
                      tev=ev_t+273.15
                      L=rate/1000.0
                      ev_p=float(p)*(tev/tk)**(9.80665/(287.05*L))
                  except (ValueError,TypeError,ZeroDivisionError):
                      ev_p=None
              return {
                  "temperature_2m_c":round(ev_t,1),
                  "feels_like_c":None,
                  "pressure_hpa":round(ev_p,1) if ev_p is not None else None,
                  "humidity_percent":sample.get("humidity_percent"),
                  "wind_speed_10m_kmh":sample.get("wind_speed_10m_kmh"),
                  "wind_direction_deg":sample.get("wind_direction_deg"),
                  "precipitation_10m_mm":sample.get("precipitation_10m_mm"),
                  "precipitation_1h_mm":sample.get("precipitation_1h_mm"),
                  "precipitation_6h_mm":sample.get("precipitation_6h_mm"),
                  "precipitation_12h_mm":sample.get("precipitation_12h_mm"),
                  "precipitation_24h_mm":sample.get("precipitation_24h_mm"),
                  "lapse_rate_k_per_km":round(rate,2)
              }

          def feels_like(t,rh,wind):
              try:
                  T=float(t); H=float(rh)
              except (TypeError,ValueError):
                  return None
              if T>=20:
                  return round(-8.784+1.611*T+2.338*H-0.146*T*H-0.0123*T*T-0.0164*H*H+0.00221*T*T*H+0.000725*T*H*H-0.00000358*T*T*H*H,1)
              if T<=10 and wind is not None:
                  try:
                      W=max(0,float(wind))
                      return round(13.12+0.6215*T-11.37*(W**0.16)+0.3965*T*(W**0.16),1)
                  except (TypeError,ValueError):
                      pass
              return round(T,1)

          current=adjust(obs)
          if current:
              current["feels_like_c"]=feels_like(current["temperature_2m_c"],current["humidity_percent"],current["wind_speed_10m_kmh"])
          ev_obs={
              **obs,
              "schema":"koy-mgm.virtual-home-observation.v1",
              "station_id":"KOY-EV-363M",
              "station_name":"Köy Ev",
              "elevation_m":HOME_ELEVATION_M,
              "source_station_name":"Çanakçı",
              "source_station_elevation_m":station_elevation,
              "elevation_delta_m":DELTA_M,
              "virtual_station":True,
              "adjustment_method":"adaptive environmental lapse rate",
              **(current or {})
          }
          pathlib.Path("output/ev-observation.json").write_text(json.dumps(ev_obs,ensure_ascii=False,indent=2),encoding="utf-8")

          ev_samples=[]
          for s in history.get("samples",[]):
              a=adjust(s)
              if not a: continue
              a.update({"observed_at_utc":s.get("observed_at_utc"),"logged_at_utc":s.get("logged_at_utc")})
              a["feels_like_c"]=feels_like(a.get("temperature_2m_c"),a.get("humidity_percent"),a.get("wind_speed_10m_kmh"))
              ev_samples.append(a)
          cutoff=datetime.now(timezone.utc)-timedelta(days=7)
          ev_samples=[s for s in ev_samples if (lambda x:x>=cutoff)(datetime.fromisoformat(str(s.get("logged_at_utc")).replace("Z","+00:00")))]
          recent=[float(s["feels_like_c"]) for s in ev_samples if s.get("feels_like_c") is not None and datetime.fromisoformat(str(s.get("observed_at_utc") or s.get("logged_at_utc")).replace("Z","+00:00"))>=datetime.now(timezone.utc)-timedelta(hours=24)]
          ev_hist={
              "schema":"koy-mgm.virtual-home-history.v1",
              "station_id":"KOY-EV-363M",
              "station_name":"Köy Ev",
              "source_station_name":"Çanakçı",
              "source_station_elevation_m":station_elevation,
              "elevation_m":HOME_ELEVATION_M,
              "elevation_delta_m":DELTA_M,
              "adjustment_method":"adaptive environmental lapse rate",
              "updated_at_utc":obs.get("fetched_at_utc"),
              "sampling_interval_minutes":5,
              "feels_like_24h_min_c":round(min(recent),1) if recent else None,
              "feels_like_24h_max_c":round(max(recent),1) if recent else None,
              "samples":ev_samples
          }
          pathlib.Path("output/ev-history.json").write_text(json.dumps(ev_hist,ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"Köy Ev virtual station: {HOME_ELEVATION_M:.0f} m · delta {DELTA_M:.0f} m · {len(ev_samples)} samples")
          PY

      - name: Build dedicated 72-hour rainfall archive
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone, timedelta

          obs=json.loads(pathlib.Path("output/observation.json").read_text(encoding="utf-8"))
          archive_path=pathlib.Path("output/rain-history-72h.json")
          if archive_path.exists():
              try:
                  archive=json.loads(archive_path.read_text(encoding="utf-8"))
              except Exception:
                  archive={}
          else:
              archive={}
          samples=archive.get("samples",[]) if isinstance(archive.get("samples"),list) else []
          # Bootstrap the dedicated rainfall database from the already stored
          # seven-day station history, so the initial archive is backfilled.
          history_path=pathlib.Path("output/history.json")
          legacy=[]
          if history_path.exists():
              try:
                  legacy_doc=json.loads(history_path.read_text(encoding="utf-8"))
                  legacy=legacy_doc.get("samples",[]) if isinstance(legacy_doc.get("samples"),list) else []
              except Exception:
                  legacy=[]
          observed=obs.get("observed_at_utc")
          logged=obs.get("fetched_at_utc") or datetime.now(timezone.utc).isoformat()
          sample={
              "observed_at_utc":observed,
              "logged_at_utc":logged,
              "precipitation_10m_mm":obs.get("precipitation_10m_mm"),
              "precipitation_1h_mm":obs.get("precipitation_1h_mm"),
              "precipitation_6h_mm":obs.get("precipitation_6h_mm"),
              "precipitation_12h_mm":obs.get("precipitation_12h_mm"),
              "precipitation_24h_mm":obs.get("precipitation_24h_mm")
          }
          # One row per MGM observation timestamp; retries update rather than duplicate.
          by_time={}
          for item in legacy+samples:
              key=item.get("observed_at_utc") or item.get("logged_at_utc")
              if key:
                  merged=by_time.setdefault(key,{})
                  merged.update({k:v for k,v in item.items() if v is not None})
          key=observed or logged
          if key in by_time:
              old=by_time[key]
              old.update({k:v for k,v in sample.items() if v is not None})
              old["logged_at_utc"]=logged
              by_time[key]=old
          else:
              by_time[key]=sample
          now=datetime.now(timezone.utc)
          cutoff=now-timedelta(hours=72)
          kept=[]
          for item in by_time.values():
              stamp=item.get("observed_at_utc") or item.get("logged_at_utc")
              try:
                  when=datetime.fromisoformat(str(stamp).replace("Z","+00:00"))
                  if cutoff<=when<=now+timedelta(minutes=5):
                      kept.append(item)
              except Exception:
                  continue
          kept.sort(key=lambda x:x.get("observed_at_utc") or x.get("logged_at_utc") or "")
          kept=kept[-900:]
          document={
              "schema":"koy-mgm.rain-history.v1",
              "station_id":str(obs.get("station_id")),
              "station_name":"Çanakçı",
              "source":"MGM Giresun / Çanakçı",
              "retention_hours":72,
              "sampling_interval_minutes":5,
              "rainfall_fields":{
                  "precipitation_10m_mm":"MGM trailing 10-minute amount",
                  "precipitation_1h_mm":"MGM trailing 1-hour accumulation",
                  "precipitation_6h_mm":"MGM trailing 6-hour accumulation",
                  "precipitation_12h_mm":"MGM trailing 12-hour accumulation",
                  "precipitation_24h_mm":"MGM trailing 24-hour accumulation"
              },
              "updated_at_utc":logged,
              "samples":kept
          }
          archive_path.write_text(json.dumps(document,ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"MGM Çanakçı rainfall archive: {len(kept)} samples · 72 h retention")
          PY

      - name: Publish to the dedicated koy-mgm-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin koy-mgm-data || true
          if git show-ref --verify --quiet refs/remotes/origin/koy-mgm-data; then
            git checkout -B koy-mgm-data origin/koy-mgm-data
          else
            git checkout --orphan koy-mgm-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p mgm
          cp "$GITHUB_WORKSPACE/output/latest.json" mgm/latest.json
          cp "$GITHUB_WORKSPACE/output/observation.json" mgm/observation.json
          cp "$GITHUB_WORKSPACE/output/history.json" mgm/history.json
          cp "$GITHUB_WORKSPACE/output/rain-history-72h.json" mgm/rain-history-72h.json
          cp "$GITHUB_WORKSPACE/output/ev-observation.json" mgm/ev-observation.json
          cp "$GITHUB_WORKSPACE/output/ev-history.json" mgm/ev-history.json
          cp mgm/latest.json "mgm/$(date -u +%Y%m%dT%H%M%SZ).json"
          find mgm -type f -name '*.json' -mtime +14 -delete
          git add mgm
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update MGM Çanakçı forecast snapshot"
          git push origin koy-mgm-data
