name: Köy MGM

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: koy-mgm-independent
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch only the MGM Giresun-Çanakçı forecast page
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen

          url = "https://mgm.gov.tr/tahmin/il-ve-ilceler.aspx?il=Giresun&ilce=%C3%87anak%C3%A7%C4%B1"
          request = Request(url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; Koy-MGM/1.0)",
              "Accept": "text/html,application/xhtml+xml",
              "Cache-Control": "no-cache",
          })
          with urlopen(request, timeout=40) as response:
              html = response.read().decode("utf-8", errors="replace")
              status = response.status
          if status != 200 or "Çanakçı" not in html:
              raise SystemExit(f"MGM Çanakçı page validation failed (HTTP {status})")
          fetched = datetime.now(timezone.utc).isoformat()
          payload = {
              "schema": "koy-mgm.page-snapshot.v1",
              "location": {"province": "Giresun", "district": "Çanakçı"},
              "source": "Meteoroloji Genel Müdürlüğü",
              "source_url": url,
              "fetched_at_utc": fetched,
              "http_status": status,
              "html": html,
          }
          with open("output/latest.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          print(f"MGM Çanakçı page fetched: {len(html)} characters")
          PY
      - name: Fetch structured MGM station observation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone

          H={"User-Agent":"Mozilla/5.0 (compatible; Koy-MGM/1.0)","Accept":"application/json","Origin":"https://www.mgm.gov.tr"}
          def get(url):
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          centers=get("https://servis.mgm.gov.tr/web/merkezler?il=Giresun&ilce=Canakci")
          if not centers:
              raise SystemExit("MGM Çanakçı merkezi bulunamadı")
          center=next((x for x in centers if str(x.get("ilce","")).casefold()=="çanakçı"),centers[0])
          merkez_id=center.get("merkezId")
          station_no=center.get("sondurumIstNo") or center.get("gunlukTahminIstNo")
          if not merkez_id:
              raise SystemExit("MGM Çanakçı merkezId bulunamadı")

          rows=get(f"https://servis.mgm.gov.tr/web/sondurumlar?merkezid={merkez_id}")
          if not rows:
              raise SystemExit("MGM Çanakçı son durum verisi boş")
          obs=rows[0]
          payload={
            "schema":"koy-mgm.station-observation.v1",
            "station_id":str(station_no or obs.get("istNo") or merkez_id),
            "station_name":"Çanakçı",
            "center_id":merkez_id,
            "latitude":center.get("enlem"),
            "longitude":center.get("boylam"),
            "elevation_m":center.get("yukseklik"),
            "observed_at_utc":obs.get("veriZamani"),
            "fetched_at_utc":datetime.now(timezone.utc).isoformat(),
            "temperature_2m_c":obs.get("sicaklik"),
            "humidity_percent":obs.get("nem"),
            "wind_speed_10m_kmh":obs.get("ruzgarHiz"),
            "wind_direction_deg":obs.get("ruzgarYon"),
            "pressure_hpa":obs.get("aktuelBasinc"),
            "sea_level_pressure_hpa":obs.get("denizeIndirgenmisBasinc"),
            "precipitation_1h_mm":obs.get("yagis1Saat"),
            "precipitation_6h_mm":obs.get("yagis6Saat"),
            "precipitation_12h_mm":obs.get("yagis12Saat"),
            "precipitation_24h_mm":obs.get("yagis24Saat"),
            "condition_code":obs.get("hadiseKodu")
          }
          with open("output/observation.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False)
          print("MGM Çanakçı station:",json.dumps(payload,ensure_ascii=False))
          PY

      - name: Restore persistent MGM history from koy-mgm-data
        run: |
          set -euo pipefail
          git fetch origin koy-mgm-data || true
          if git show-ref --verify --quiet refs/remotes/origin/koy-mgm-data; then
            git show origin/koy-mgm-data:mgm/history.json > output/history.json || true
          fi

      - name: Build independent MGM station history
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone, timedelta
          obs=json.loads(pathlib.Path("output/observation.json").read_text(encoding="utf-8"))
          history_path=pathlib.Path("output/history.json")
          if history_path.exists():
              doc=json.loads(history_path.read_text(encoding="utf-8"))
          else:
              doc={"schema":"koy-mgm.station-history.v1","station_id":obs["station_id"],"station_name":"Çanakçı","sampling_interval_minutes":5,"samples":[]}
          samples=doc.get("samples",[])
          samples=[s for s in samples if s.get("logged_at_utc")!=obs.get("fetched_at_utc")]
          samples.append({
              "observed_at_utc":obs.get("observed_at_utc"),
              "logged_at_utc":obs.get("fetched_at_utc"),
              "temperature_2m_c":obs.get("temperature_2m_c"),
              "precipitation_1h_mm":obs.get("precipitation_1h_mm"),
              "precipitation_6h_mm":obs.get("precipitation_6h_mm"),
              "humidity_percent":obs.get("humidity_percent"),
              "pressure_hpa":obs.get("pressure_hpa"),
              "wind_speed_10m_kmh":obs.get("wind_speed_10m_kmh")
          })
          cutoff=datetime.now(timezone.utc)-timedelta(days=7)
          kept=[]
          for s in samples:
              try:
                  t=datetime.fromisoformat(str(s.get("logged_at_utc")).replace("Z","+00:00"))
                  if t>=cutoff: kept.append(s)
              except Exception: pass
          kept.sort(key=lambda x:x.get("logged_at_utc",""))
          doc["samples"]=kept
          doc["updated_at_utc"]=obs.get("fetched_at_utc")
          pathlib.Path("output/history.json").write_text(json.dumps(doc,ensure_ascii=False),encoding="utf-8")
          print(f"MGM Çanakçı history: {len(kept)} samples")
          PY

      - name: Publish to the dedicated koy-mgm-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin koy-mgm-data || true
          if git show-ref --verify --quiet refs/remotes/origin/koy-mgm-data; then
            git checkout -B koy-mgm-data origin/koy-mgm-data
          else
            git checkout --orphan koy-mgm-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p mgm
          cp "$GITHUB_WORKSPACE/output/latest.json" mgm/latest.json
          cp "$GITHUB_WORKSPACE/output/observation.json" mgm/observation.json
          cp "$GITHUB_WORKSPACE/output/history.json" mgm/history.json
          cp mgm/latest.json "mgm/$(date -u +%Y%m%dT%H%M%SZ).json"
          find mgm -type f -name '*.json' -mtime +14 -delete
          git add mgm
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update MGM Çanakçı forecast snapshot"
          git push origin koy-mgm-data
