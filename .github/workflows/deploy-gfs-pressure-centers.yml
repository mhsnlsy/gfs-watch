name: Deploy GFS Pressure Centers Container

on:
  workflow_dispatch:
  push:
    branches:
      - feat/pressure-centers-latest-main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/gfs-pressure-centers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/gfs-pressure-centers/package-lock.json

      - name: Install pinned Wrangler
        run: npm install

      - name: Show Wrangler version
        run: npx wrangler --version

      - name: Validate Container configuration and bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Deploy Container
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
