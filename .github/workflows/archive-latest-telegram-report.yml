name: Backfill latest Pages charts with 850 hPa wind

on:
  push:
    branches: [main]
    paths:
      - "scripts/archive_latest_telegram_report.py"
      - ".github/workflows/archive-latest-telegram-report.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-latest-telegram-report
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out GFS Watch source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source

      - name: Check out published GFS state
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: state

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev

      - name: Install Python dependencies
        working-directory: source
        run: python -m pip install -r requirements.txt

      - name: Rebuild latest forecast and four Pages images
        working-directory: source
        env:
          DB_PATH: ${{ github.workspace }}/state/gfs_watch.db
          PUBLIC_DATA_DIR: ${{ github.workspace }}/state/public
          NOAA_CACHE_DIR: ${{ github.workspace }}/source/noaa_cache_v2
          NOAA_RANGE_DOWNLOAD_WORKERS: '8'
        run: python scripts/archive_latest_telegram_report.py

      - name: Commit refreshed forecast and Pages media
        working-directory: state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          if git diff --cached --quiet; then
            echo 'Public forecast and notification media are already current.'
            exit 0
          fi
          git commit -m 'Backfill latest Pages charts with 850 hPa wind'
          for attempt in 1 2 3; do
            if git push origin HEAD:gfs-watch-state; then
              echo 'Four Pages charts and refreshed forecast published.'
              exit 0
            fi
            git fetch origin gfs-watch-state
            git rebase origin/gfs-watch-state
          done
          echo 'Could not publish refreshed Pages charts after three attempts.'
          exit 1
