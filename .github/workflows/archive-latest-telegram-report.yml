name: Archive latest Telegram report to Pages

on:
  push:
    branches: [main]
    paths:
      - "scripts/archive_latest_telegram_report.py"
      - ".github/workflows/archive-latest-telegram-report.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-latest-telegram-report
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out GFS Watch source and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source

      - name: Check out published GFS state
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: state

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: source/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev

      - name: Install Python dependencies
        working-directory: source
        run: python -m pip install -r requirements.txt

      - name: Load the original report generator
        working-directory: source
        env:
          LEGACY_SOURCE_SHA: "ec52ad4126398f44638239edee5f178c4746cd74"
        run: |
          git show "$LEGACY_SOURCE_SHA:main.py" > "$RUNNER_TEMP/legacy_main.py"
          test -s "$RUNNER_TEMP/legacy_main.py"

      - name: Rebuild and archive the latest Telegram media
        working-directory: source
        env:
          DB_PATH: ${{ github.workspace }}/state/gfs_watch.db
          PUBLIC_DATA_DIR: ${{ github.workspace }}/state/public
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          LEGACY_MAIN_PATH: ${{ runner.temp }}/legacy_main.py
          TARGET_RUN_ID: "2026-10-31T12:00:00+00:00"
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "GCP_SA_KEY secret is unavailable; audio cannot be recreated."
            exit 1
          fi
          python scripts/archive_latest_telegram_report.py

      - name: Commit media to the public state branch
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/notifications
          if git diff --cached --quiet; then
            echo "Notification media already archived."
            exit 0
          fi
          git commit -m "Archive latest Telegram report media"
          for attempt in 1 2 3; do
            if git push origin HEAD:gfs-watch-state; then
              echo "Latest Telegram report media published to gfs-watch-state."
              exit 0
            fi
            git fetch origin gfs-watch-state
            git rebase origin/gfs-watch-state
          done
          echo "Could not push archive after three attempts."
          exit 1
