name: Köy GFS

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: koy-gfs-independent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Poll MeteoPT and prepare independent Köy updates
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/koy-output"
          cp scripts/render_koy_gfs_charts.py "$RUNNER_TEMP/render_koy_gfs_charts.py"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from pathlib import Path

          now = datetime.now(timezone.utc)
          cycle_hour = (now.hour // 6) * 6
          cycle = now.replace(hour=cycle_hour, minute=0, second=0, microsecond=0)
          run_id = cycle.strftime("%Y%m%d%H")
          # MeteoPT may expose individual model cycles with different delays.
          # Query all four GFS cycle hours and use the newest cycle actually returned.
          candidates = []
          for requested_hour in (18, 12, 6, 0):
              params = {"lat":"40.9557","lon":"39.0065","run":f"{requested_hour:02d}","lang":"en"}
              url = "https://api.meteopt.com/gfs/json?" + urlencode(params)
              req = Request(url, headers={"User-Agent":"Koy-GFS/1.0","Cache-Control":"no-cache"})
              try:
                  with urlopen(req, timeout=40) as response:
                      candidate = json.load(response)
                  api_run = str(candidate.get("run") or "").strip()
                  if api_run:
                      candidates.append((api_run, candidate, url))
              except Exception as exc:
                  print(f"MeteoPT run={requested_hour:02d} unavailable: {exc}")
          if not candidates:
              raise SystemExit("MeteoPT returned no usable GFS cycle")
          def run_key(value):
              digits = "".join(ch for ch in value if ch.isdigit())
              return digits[:10] if len(digits) >= 10 else digits
          candidates.sort(key=lambda x: run_key(x[0]), reverse=True)
          api_run, doc, url = candidates[0]
          run_id = api_run
          # Preserve a clean UTC cycle timestamp for valid_time calculations.
          parsed = run_key(api_run)
          if len(parsed) == 10:
              cycle = datetime.strptime(parsed, "%Y%m%d%H").replace(tzinfo=timezone.utc)
          else:
              cycle = cycle
          steps = []
          for value in (doc.get("steps") or {}).get("values") or []:
              try: steps.append(int(value))
              except (TypeError, ValueError): pass
          if not steps:
              raise SystemExit("MeteoPT returned no forecast steps")
          data = doc.get("data") or {}
          def series(name):
              return ((data.get(name) or {}).get("values") or [])
          def num(values, i):
              try:
                  x = float(values[i])
                  return x if x == x and abs(x) != float("inf") else None
              except (IndexError, TypeError, ValueError):
                  return None
          run_iso = cycle.isoformat(timespec="seconds")
          points = []
          for i, lead in enumerate(steps):
              if lead <= 0: continue
              points.append({
                  "forecast_hour": lead,
                  "valid_time_utc": (cycle.replace() + __import__("datetime").timedelta(hours=lead)).isoformat(timespec="minutes"),
                  "temperature_2m_c": num(series("tmp2m"), i),
                  "temperature_850hpa_c": num(series("tmp850mb"), i),
                  "wind_speed_10m_kmh": num(series("wind10m"), i),
                  "wind_speed_850hpa_kmh": num(series("wind850"), i),
                  "precipitation_6h_mm": num(series("apcp"), i),
              })
          root = Path(os.environ["RUNNER_TEMP"]) / "koy-output"
          meta = {
              "location":{"name":"Giresun / Çanakçı","latitude":40.9557,"longitude":39.0065},
              "source":"MeteoPT GFS","source_url":url,"run_id_utc":run_iso,
          }
          if 72 in steps and max(steps) >= 72:
              first72 = {**meta,"schema":"koy-gfs.first72.v1","forecast_source":"meteopt",
                         "published_at_utc":now.isoformat(timespec="seconds"),
                         "forecast_6_hourly":[p for p in points if 0 < p["forecast_hour"] <= 72]}
              (root/"f72.json").write_text(json.dumps(first72,ensure_ascii=False,indent=2),encoding="utf-8")
              print("F72_READY=true")
          else:
              print("F72_READY=false")
          ready180 = 180 in steps and len([x for x in steps if 0 < x <= 180]) >= 60
          if ready180:
              full = {**meta,"schema":"koy-gfs.run.v1","forecast_source":"meteopt",
                      "published_at_utc":now.isoformat(timespec="seconds"),
                      "forecast_6_hourly":points}
              (root/f"{run_id}.json").write_text(json.dumps(full,ensure_ascii=False,indent=2),encoding="utf-8")
              print("F180_READY=true")
          else:
              print("F180_READY=false")
          print(f"Cycle {run_id}; max forecast hour {max(steps)}; steps {len(steps)}")
          PY
      - name: Publish only new F72 and F180 milestones to the isolated data branch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/koy-output"
          cp -a "$RUNNER_TEMP/koy-output/." "$RUNNER_TEMP/" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin +refs/heads/koy-gfs-data:refs/remotes/origin/koy-gfs-data || true
          if git show-ref --verify --quiet refs/remotes/origin/koy-gfs-data; then
            git checkout -B koy-gfs-data origin/koy-gfs-data
          else
            git checkout --orphan koy-gfs-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p gfs/f72 gfs/runs
          changed=0
          if [ -f "$RUNNER_TEMP/koy-output/f72.json" ]; then
            new_run="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_id_utc"])' "$RUNNER_TEMP/koy-output/f72.json")"
            old_run=""
            if [ -s gfs/f72/latest.json ]; then
              old_run="$(python -c 'import json; print(json.load(open("gfs/f72/latest.json")).get("run_id_utc",""))')"
            fi
            if [ "$new_run" != "$old_run" ]; then
              cp "$RUNNER_TEMP/koy-output/f72.json" gfs/f72/latest.json
              changed=1
              echo "New F72 milestone published for $new_run."
            else
              echo "F72 for $new_run is already published; no repeat commit."
            fi
          fi
          for file in "$RUNNER_TEMP"/koy-output/*.json; do
            [ -f "$file" ] || continue
            case "$(basename "$file")" in f72.json) continue;; esac
            run_file="gfs/runs/$(basename "$file")"
            if [ ! -f "$run_file" ]; then cp "$file" "$run_file"; changed=1; fi
          done
          if [ "$changed" = "1" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          runs=[]
          for path in sorted(Path("gfs/runs").glob("*.json"), reverse=True):
              try: runs.append(json.loads(path.read_text(encoding="utf-8")))
              except Exception: pass
          runs=runs[:4]
          if runs:
              bundle={"schema":"koy-gfs.comparison.v1","location":{"name":"Giresun / Çanakçı","latitude":40.9557,"longitude":39.0065},
                      "updated_at_utc":runs[0].get("published_at_utc"),"runs":runs}
              Path("gfs/comparison.json").write_text(json.dumps(bundle,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          else
            echo "No new F72/F180 data; checking Köy GFS PNG assets."
          fi

          if [ -s gfs/comparison.json ]; then
            current_run="$(python -c 'import json; print(json.load(open("gfs/comparison.json"))["runs"][0]["run_id_utc"])')"
            stamp="$(python -c 'from datetime import datetime; import sys; print(datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")).strftime("%Y%m%dT%HZ"))' "$current_run")"
            if [ ! -s "gfs/media/koy-gfs-${stamp}-temperature.png" ] || [ ! -s "gfs/media/koy-gfs-${stamp}-temperature_850.png" ] || [ ! -s "gfs/media/koy-gfs-${stamp}-precipitation.png" ] || [ ! -s "gfs/media/koy-gfs-${stamp}-wind_10m.png" ]; then
              python -m pip install -q matplotlib
              KOY_GFS_DIR="$PWD/gfs" python "$RUNNER_TEMP/render_koy_gfs_charts.py"
              git add gfs
              if git diff --cached --quiet; then
                git reset
                echo "Köy GFS PNG assets already synchronized."
              else
                git commit -m "Publish Köy GFS PNG comparison charts"
                git push origin koy-gfs-data
              fi
            else
              echo "Köy GFS PNG assets already present for $current_run."
            fi
          fi

          find gfs/runs -type f -name '*.json' -mtime +45 -delete
