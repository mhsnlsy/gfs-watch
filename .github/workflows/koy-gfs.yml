name: Köy GFS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: koy-gfs-independent
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch only the Çanakçı MeteoPT GFS point
        id: fetch
        env:
          LAT: "40.9557"
          LON: "39.0065"
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          now = datetime.now(timezone.utc)
          cycle_hour = (now.hour // 6) * 6
          cycle = now.replace(hour=cycle_hour, minute=0, second=0, microsecond=0)
          params = {
              "lat": os.environ["LAT"],
              "lon": os.environ["LON"],
              "run": f"{cycle_hour:02d}",
              "lang": "en",
          }
          url = "https://api.meteopt.com/gfs/json?" + urlencode(params)
          request = Request(url, headers={"User-Agent": "Koy-GFS/1.0"})
          with urlopen(request, timeout=40) as response:
              document = json.load(response)
          expected = cycle.strftime("%Y%m%d%H")
          actual = str(document.get("run") or "")
          if actual != expected:
              raise SystemExit(f"MeteoPT cycle mismatch: expected {expected}, got {actual or 'empty'}")
          steps = (document.get("steps") or {}).get("values") or []
          if not steps:
              raise SystemExit("MeteoPT returned no forecast steps")
          output = {
              "schema": "koy-gfs.meteopt-point.v1",
              "location": {"name": "Giresun / Çanakçı", "latitude": 40.9557, "longitude": 39.0065},
              "source": "MeteoPT",
              "source_url": url,
              "run_utc": cycle.isoformat(),
              "fetched_at_utc": now.isoformat(),
              "max_forecast_hour": max(int(x) for x in steps),
              "raw": document,
          }
          with open("output/latest.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print(f"MeteoPT {expected}: {len(steps)} steps; max f{output['max_forecast_hour']}")
          PY
      - name: Publish to the dedicated koy-gfs-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin koy-gfs-data || true
          if git show-ref --verify --quiet refs/remotes/origin/koy-gfs-data; then
            git checkout -B koy-gfs-data origin/koy-gfs-data
          else
            git checkout --orphan koy-gfs-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p gfs
          cp "$GITHUB_WORKSPACE/output/latest.json" gfs/latest.json
          cp gfs/latest.json "gfs/$(date -u +%Y%m%dT%H%M%SZ).json"
          find gfs -type f -name '*.json' -mtime +14 -delete
          git add gfs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Çanakçı MeteoPT GFS data"
          git push origin koy-gfs-data
