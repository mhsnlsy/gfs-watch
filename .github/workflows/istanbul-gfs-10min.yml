name: Istanbul GFS · Event-Driven Report Pipeline

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Cloudflare D1 üzerinden raporlanacak tam F180 döngüsünün UTC kimliği"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: istanbul-gfs-10min-pipeline
  cancel-in-progress: false

jobs:
  poll-and-publish:
    name: Process event-triggered Cloudflare D1 F180 report
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      f180_ready: ${{ steps.poll.outputs.f180_ready }}
      run_id: ${{ steps.poll.outputs.run_id }}
    steps:
      - name: Check out application source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Check out canonical Istanbul GFS state
        uses: actions/checkout@v5
        with:
          ref: istanbul-gfs-data
          path: gfs-state
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore canonical state
        run: |
          set -euo pipefail
          mkdir -p gfs
          if [ -d gfs-state/gfs ]; then
            cp -a gfs-state/gfs/. gfs/
          fi
          mkdir -p gfs/runs gfs/milestones/f72 gfs/notifications/telegram-sent

      - name: Sync the canonical GFS cycles from Cloudflare D1
        id: poll
        env:
          ISTANBUL_GFS_API: https://gfs-watch-istanbul-gfs.muhsin-ulusoy.workers.dev/gfs/latest
          GFS_TRIGGERED_RUN_ID: ${{ inputs.run_id }}
        run: python scripts/poll_istanbul_gfs_10min.py

      - name: Install publication dependencies for a new F180 report
        if: steps.poll.outputs.f180_ready == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Persist F72 cache and any F180 canonical run
        if: steps.poll.outputs.new_run == 'true'
        working-directory: gfs-state
        run: |
          set -euo pipefail
          rsync -a "${GITHUB_WORKSPACE}/gfs/" gfs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfs
          if git diff --cached --quiet; then
            echo "No new GFS state to persist."
          else
            git commit -m "Archive Istanbul GFS milestones and runs"
            git push origin HEAD:istanbul-gfs-data
          fi

      - name: Validate publication code
        if: steps.poll.outputs.f180_ready == 'true'
        run: |
          set -euo pipefail
          python -m py_compile \
            main.py \
            scripts/fetch_istanbul_gfs_meteopt.py \
            scripts/poll_istanbul_gfs_10min.py \
            scripts/build_istanbul_gfs_publication.py \
            scripts/send_pending_istanbul_gfs_telegram.py
          python scripts/test_notification_pipeline.py
          python scripts/test_gfs_report_chart_theme.py
          python scripts/test_gfs_svg_comparison.py
          node --check site/gfs-comparison-tooltip.js

      - name: Build the report from the newly archived F180 run
        if: steps.poll.outputs.f180_ready == 'true'
        env:
          GFS_TARGET_RUN_ID: ${{ steps.poll.outputs.run_id }}
        run: python scripts/build_istanbul_gfs_publication.py

      - name: Publish report assets into Cloudflare D1
        if: steps.poll.outputs.f180_ready == 'true'
        env:
          ISTANBUL_GFS_API: https://gfs-watch-istanbul-gfs.muhsin-ulusoy.workers.dev
          GFS_DISPATCH_TOKEN: ${{ secrets.GFS_DISPATCH_TOKEN }}
          GFS_TARGET_RUN_ID: ${{ steps.poll.outputs.run_id }}
        run: |
          set -euo pipefail
          test -n "$GFS_DISPATCH_TOKEN" || { echo "::error::GFS_DISPATCH_TOKEN is not configured"; exit 1; }
          test -d gfs/notifications || { echo "::error::Publication notification directory is missing"; exit 1; }

          upload_asset() {
            local file="$1"
            local key="${file#gfs/}"
            local content_type
            local encoding="utf8"
            local body

            case "$file" in
              *.json) content_type="application/json; charset=utf-8" ;;
              *.svg) content_type="image/svg+xml; charset=utf-8" ;;
              *.png) content_type="image/png"; encoding="base64" ;;
              *) return 0 ;;
            esac

            if [ "$encoding" = "base64" ]; then
              body="$(base64 -w0 "$file")"
            else
              body="$(cat "$file")"
            fi

            if [ "$(printf '%s' "$body" | wc -c)" -gt 1900000 ]; then
              echo "::warning::Skipping oversized D1 publication asset: $file"
              return 0
            fi

            node - "$ISTANBUL_GFS_API/gfs/publication-upload" "$GFS_DISPATCH_TOKEN" "$key" "$GFS_TARGET_RUN_ID" "$content_type" "$encoding" "$body" <<'NODE'
          const [url, token, key, runId, contentType, encoding, body] = process.argv.slice(2);
          const payload = { key, run_id_utc: runId, content_type: contentType, encoding, body };
          fetch(url, {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify(payload)
          }).then(async response => {
            const text = await response.text();
            if (!response.ok) throw new Error("Publication upload failed HTTP " + response.status + ": " + text);
            const doc = JSON.parse(text);
            if (doc.ok !== true) throw new Error("Publication upload rejected: " + text);
            console.log("Uploaded D1 publication asset:", key, doc.bytes);
          }).catch(error => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE
          }

          find gfs/notifications -type f \( -name '*.json' -o -name '*.svg' -o -name '*.png' \) -print0 |
            while IFS= read -r -d '' file; do upload_asset "$file"; done

          echo "Cloudflare D1 publication assets uploaded for $GFS_TARGET_RUN_ID."
      - name: Trigger Cloudflare website deployment for the new Istanbul cycle
        if: steps.poll.outputs.f180_ready == 'true'
        env:
          GFS_DISPATCH_TOKEN: ${{ secrets.GFS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFS_DISPATCH_TOKEN" || { echo "::error::GFS_DISPATCH_TOKEN is not configured"; exit 1; }
          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/mhsnlsy/gfs-watch/actions/workflows/deploy-cloudflare-platform.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GFS_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}'
          echo "Cloudflare website deployment dispatched from the canonical Istanbul F180 publication."
      - name: Persist the publication bundle
        if: steps.poll.outputs.f180_ready == 'true'
        working-directory: gfs-state
        run: |
          set -euo pipefail
          rsync -a "${GITHUB_WORKSPACE}/gfs/" gfs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfs
          if git diff --cached --quiet; then
            echo "Publication bundle already persisted."
          else
            git commit -m "Publish Istanbul GFS F180 report"
            git push origin HEAD:istanbul-gfs-data
          fi

  telegram:
    name: Deliver pending GFS Telegram reports
    needs: poll-and-publish
    if: needs.poll-and-publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out canonical Istanbul GFS state
        uses: actions/checkout@v5
        with:
          ref: istanbul-gfs-data
          path: gfs-state
          fetch-depth: 0

      - name: Check out application source
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Restore GFS publication tree
        run: |
          set -euo pipefail
          mkdir -p gfs
          cp -a gfs-state/gfs/. gfs/

      - name: Check for pending Telegram reports
        id: pending
        run: python3 source/scripts/send_pending_istanbul_gfs_telegram.py --check

      - name: Set up Python for pending Telegram delivery
        if: steps.pending.outputs.pending == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram dependency only when needed
        if: steps.pending.outputs.pending == 'true'
        run: python -m pip install python-telegram-bot

      - name: Deliver every pending GFS report
        if: steps.pending.outputs.pending == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python source/scripts/send_pending_istanbul_gfs_telegram.py

      - name: Persist Telegram delivery markers
        if: always() && steps.pending.outputs.pending == 'true'
        working-directory: gfs-state
        run: |
          set -euo pipefail
          if [ -d "${GITHUB_WORKSPACE}/gfs/notifications/telegram-sent" ]; then
            rsync -a "${GITHUB_WORKSPACE}/gfs/notifications/telegram-sent/" gfs/notifications/telegram-sent/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfs/notifications/telegram-sent
          if git diff --cached --quiet; then
            echo "No Telegram delivery markers to persist."
          else
            git commit -m "Record Istanbul GFS Telegram delivery"
            git push origin HEAD:istanbul-gfs-data
          fi
