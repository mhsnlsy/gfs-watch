name: Station Refresh Clock

on:
  # One scheduler dispatches three independent station collectors every five minutes.
  # Target collectors keep separate concurrency locks and write only their own station files.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/station-refresh-clock.yml"

permissions:
  actions: write

concurrency:
  group: station-refresh-clock
  cancel-in-progress: false

jobs:
  dispatch-stations:
    name: Wake ENKA, Eyüpsultan and Şişli independently
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send independent station refresh events
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SCHEDULED_AT: ${{ github.event.schedule || 'manual-or-push' }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GH_REPOSITORY/actions/workflows"

          dispatch_workflow() {
            workflow_id="$1"
            workflow_name="$2"
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.json" --write-out "%{http_code}" \
              --request POST "$api/$workflow_id/dispatches" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data '{"ref":"main"}')"
            if [ "$status" != "204" ]; then
              echo "Workflow dispatch $workflow_name failed with HTTP $status"
              cat "$RUNNER_TEMP/dispatch-response.json"
              exit 1
            fi
            echo "Triggered $workflow_name"
          }

          dispatch_workflow "408118151" "ENKA main station workflow"
          dispatch_workflow "408238863" "Eyüpsultan MGM workflow"
          dispatch_workflow "408243875" "Şişli MGM workflow"
          echo "All three independent station workflows have been queued."
