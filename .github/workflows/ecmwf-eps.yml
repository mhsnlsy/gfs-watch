name: Build and publish ECMWF EPS forecast

on:
  schedule:
    # ECMWF Open Data products typically appear 7–9 hours after cycle time.
    # Check after the 00Z and 12Z ENS dissemination windows.
    - cron: "15 10,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Redownload even when this cycle is already published
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ecmwf-eps-forecast
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    name: Fetch, validate and cache ECMWF EPS for Istanbul
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
      - name: Check out forecast cache
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: state
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r source/requirements.txt
      - name: Offline contract and conversion smoke test
        working-directory: source
        run: |
          python scripts/test_ecmwf_eps.py
          python scripts/test_ecmwf_ui.py
      - name: Fetch the latest MeteoPT ECMWF cycles and publish the Istanbul point
        working-directory: source
        env:
          ECMWF_PUBLIC_DIR: ${{ github.workspace }}/state/public/ecmwf
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" || "${{ inputs.force }}" == "true" ]]; then
            python -u scripts/fetch_ecmwf_eps.py --force
          else
            python -u scripts/fetch_ecmwf_eps.py
          fi
      - name: Validate the downloaded ECMWF forecast payload
        working-directory: source
        run: python scripts/test_ecmwf_eps.py ../state/public/ecmwf/latest.json
      - name: Commit forecast cache to state branch
        working-directory: state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ecmwf
          if git diff --cached --quiet; then
            echo 'ECMWF forecast is already cached; no state commit is required.'
            exit 0
          fi
          git commit -m 'Update cached ECMWF EPS forecast'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin gfs-watch-state
            if git push origin HEAD:gfs-watch-state; then
              echo 'ECMWF EPS forecast cache published.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the ECMWF EPS forecast cache.'
          exit 1

