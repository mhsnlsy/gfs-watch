name: Build and publish ECMWF EPS forecast

on:
  schedule:
    # ECMWF Open Data products typically appear 7–9 hours after cycle time.
    # Check after the 00Z and 12Z ENS dissemination windows.
    - cron: "15 10,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Redownload even when this cycle is already published
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ecmwf-eps-forecast
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    name: Fetch, validate and cache ECMWF EPS for Istanbul
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
      - name: Check out forecast cache
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: state
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r source/requirements.txt
      - name: Offline contract and conversion smoke test
        working-directory: source
        run: |
          python scripts/test_ecmwf_eps.py
          python scripts/test_ecmwf_ui.py
      - name: Fetch the latest MeteoPT ECMWF cycles and publish the Istanbul point
        working-directory: source
        env:
          ECMWF_PUBLIC_DIR: ${{ github.workspace }}/state/public/ecmwf
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" || "${{ inputs.force }}" == "true" ]]; then
            python -u scripts/fetch_ecmwf_eps.py --force
          else
            python -u scripts/fetch_ecmwf_eps.py
          fi
      - name: Validate the downloaded ECMWF forecast payload
        working-directory: source
        run: python scripts/test_ecmwf_eps.py ../state/public/ecmwf/latest.json

      - name: Set up Node.js for Cloudflare R2 publication
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Wrangler for R2 publication
        run: npm install --global wrangler@4

      - name: Publish validated ECMWF archive to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ECMWF_PUBLIC_DIR: ${{ github.workspace }}/state/public/ecmwf
          R2_BUCKET: gfs-watch-live-archive
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_R2_API_TOKEN is required for ECMWF R2 publication"; exit 1; }
          test -s "$ECMWF_PUBLIC_DIR/latest.json" || { echo "::error::ECMWF latest.json is missing"; exit 1; }

          wrangler r2 bucket list > "$RUNNER_TEMP/r2-buckets.txt"
          if ! grep -Fq "$R2_BUCKET" "$RUNNER_TEMP/r2-buckets.txt"; then
            wrangler r2 bucket create "$R2_BUCKET"
          fi

          uploaded=0
          while IFS= read -r -d '' file; do
            relative="${file#"$ECMWF_PUBLIC_DIR"/}"
            key="data/ecmwf/$relative"
            mime="$(file --brief --mime-type "$file")"
            cache_control="public, max-age=3600, s-maxage=86400"
            case "$key" in
              *.json|*/latest.json) cache_control="no-store, max-age=0" ;;
            esac
            wrangler r2 object put "$R2_BUCKET/$key" --file "$file" --remote \
              --content-type "$mime" --cache-control "$cache_control" --force
            uploaded=$((uploaded + 1))
          done < <(find "$ECMWF_PUBLIC_DIR" -type f \( -name '*.json' -o -name '*.png' \) -print0)

          test "$uploaded" -gt 0 || { echo "::error::No ECMWF objects were uploaded to R2"; exit 1; }
          wrangler r2 object get "$R2_BUCKET/data/ecmwf/latest.json" \
            --file "$RUNNER_TEMP/r2-ecmwf-latest.json" --remote
          cmp -s "$ECMWF_PUBLIC_DIR/latest.json" "$RUNNER_TEMP/r2-ecmwf-latest.json"
          echo "Verified ECMWF R2 archive: $uploaded objects; latest.json byte-for-byte."

      - name: Publish ECMWF latest payload and report images to Cloudflare D1
        env:
          ECMWF_PUBLIC_DIR: ${{ github.workspace }}/state/public/ecmwf
          ISTANBUL_GFS_API: https://gfs-watch-istanbul-gfs.muhsin-ulusoy.workers.dev
          GFS_DISPATCH_TOKEN: ${{ secrets.GFS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFS_DISPATCH_TOKEN" || { echo "::error::GFS_DISPATCH_TOKEN is required for ECMWF D1 publication"; exit 1; }
          test -s "$ECMWF_PUBLIC_DIR/latest.json" || { echo "::error::ECMWF latest.json is missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ecmwf-d1"

          while IFS= read -r -d '' file; do
            relative="${file#"$ECMWF_PUBLIC_DIR"/}"
            key="data/ecmwf/$relative"
            case "$file" in
              *.png) encoding="base64"; content_type="image/png" ;;
              *.json) encoding="utf8"; content_type="application/json; charset=utf-8" ;;
              *) continue ;;
            esac

            python - "$file" "$key" "$encoding" "$content_type" "$ECMWF_PUBLIC_DIR/latest.json" "$RUNNER_TEMP/ecmwf-d1/payload.json" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          source, key, encoding, content_type, latest_path, output_path = sys.argv[1:]
          latest = json.loads(Path(latest_path).read_text(encoding="utf-8"))
          run_id = latest.get("run_id_utc")
          if not run_id:
              raise SystemExit("ECMWF latest.json has no run_id_utc")
          raw = Path(source).read_bytes()
          body = base64.b64encode(raw).decode("ascii") if encoding == "base64" else raw.decode("utf-8")
          if len(body) > 1900000:
              raise SystemExit(f"ECMWF D1 asset exceeds row safety limit: {source}")
          payload = {
              "key": key,
              "run_id_utc": run_id,
              "content_type": content_type,
              "encoding": encoding,
              "body": body,
          }
          Path(output_path).write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

            curl --fail --silent --show-error --max-time 60 --request POST --url "$ISTANBUL_GFS_API/gfs/publication-upload" --header "Authorization: Bearer $GFS_DISPATCH_TOKEN" --header "Content-Type: application/json" --header "Accept: application/json" --data-binary "@$RUNNER_TEMP/ecmwf-d1/payload.json" --output "$RUNNER_TEMP/ecmwf-d1/response.json"

            python - "$RUNNER_TEMP/ecmwf-d1/response.json" "$key" <<'PY'
          import json
          import sys
          from pathlib import Path
          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if response.get("ok") is not True:
              raise SystemExit(f"ECMWF D1 publication failed for {sys.argv[2]}: {response}")
          print("Published ECMWF D1 asset:", response.get("key"), response.get("bytes"), "body characters")
          PY
          done < <(find "$ECMWF_PUBLIC_DIR" -type f \( -name 'latest.json' -o -name '*.png' \) -print0)

          curl --fail --silent --show-error --max-time 30 "$ISTANBUL_GFS_API/gfs/publication-asset/data/ecmwf/latest.json?verify=$(date +%s)" -o "$RUNNER_TEMP/ecmwf-d1/verified-latest.json"
          python - "$ECMWF_PUBLIC_DIR/latest.json" "$RUNNER_TEMP/ecmwf-d1/verified-latest.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          expected = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          actual = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if actual.get("run_id_utc") != expected.get("run_id_utc"):
              raise SystemExit("ECMWF D1 read-after-write verification returned a different model run")
          print("Verified ECMWF latest.json read back from Istanbul D1:", actual["run_id_utc"])
          PY

      - name: Commit forecast cache to state branch
        working-directory: state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ecmwf
          if git diff --cached --quiet; then
            echo 'ECMWF forecast is already cached; no state commit is required.'
            exit 0
          fi
          git commit -m 'Update cached ECMWF EPS forecast'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin gfs-watch-state
            if git push origin HEAD:gfs-watch-state; then
              echo 'ECMWF EPS forecast cache published.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the ECMWF EPS forecast cache.'
          exit 1

