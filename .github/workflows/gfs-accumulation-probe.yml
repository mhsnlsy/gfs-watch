name: GFS Accumulation Cadence Probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gfs-accumulation-probe.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install GRIB decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
          python -m pip install eccodes requests

      - name: Inspect 06Z accumulated precipitation intervals
        run: |
          python - <<'PY'
          import time
          import json
          import requests
          import eccodes

          hours = [6, 12, 18, 72, 120, 126, 180]
          endpoint = "https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl"
          results = []
          for position, hour in enumerate(hours):
              filename = f"gfs.t06z.pgrb2.0p25.f{hour:03d}"
              params = {
                  "file": filename,
                  "var_APCP": "on",
                  "lev_surface": "on",
                  "subregion": "",
                  "leftlon": "27",
                  "rightlon": "39",
                  "toplat": "47",
                  "bottomlat": "33",
                  "dir": "/gfs.20261031/06/atmos",
              }
              response = requests.get(endpoint, params=params, timeout=60)
              print(f"[DOWNLOAD] f{hour:03d} HTTP {response.status_code} bytes={len(response.content)}")
              response.raise_for_status()
              if not response.content.startswith(b"GRIB"):
                  raise RuntimeError(f"Not GRIB at f{hour:03d}: {response.text[:500]}")
              path = f"/tmp/f{hour:03d}.grib2"
              open(path, "wb").write(response.content)

              records = []
              with open(path, "rb") as handle:
                  while True:
                      gid = eccodes.codes_grib_new_from_file(handle)
                      if gid is None:
                          break
                      try:
                          record = {}
                          for key in ["shortName", "name", "typeOfLevel", "level",
                                      "stepRange", "startStep", "endStep",
                                      "validityDate", "validityTime",
                                      "units"]:
                              try:
                                  record[key] = eccodes.codes_get(gid, key)
                              except Exception:
                                  pass
                          values = eccodes.codes_get_values(gid)
                          lats = eccodes.codes_get_array(gid, "latitudes")
                          lons = eccodes.codes_get_array(gid, "longitudes")
                          distances = (lats - 41.014) ** 2 + (((lons - 28.950 + 180) % 360) - 180) ** 2
                          idx = int(distances.argmin())
                          record["istanbul_grid"] = {
                              "lat": float(lats[idx]),
                              "lon": float(lons[idx]),
                              "value": float(values[idx]),
                          }
                          records.append(record)
                      finally:
                          eccodes.codes_release(gid)
              results.append({"forecast_hour": hour, "messages": records})
              if position < len(hours) - 1:
                  time.sleep(10)

          print("[ACCUMULATION RESULTS]")
          print(json.dumps(results, ensure_ascii=False, indent=2))
          PY
