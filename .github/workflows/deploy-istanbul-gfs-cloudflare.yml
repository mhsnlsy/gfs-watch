name: Deploy Istanbul GFS Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/istanbul-gfs/**"
      - ".github/workflows/deploy-istanbul-gfs-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workers/istanbul-gfs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Ensure GFS KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler kv namespace list > /tmp/kv.json
          python - <<'PY'
          import json, os, subprocess
          items=json.load(open("/tmp/kv.json"))
          wanted="gfs-watch-istanbul-gfs"
          found=next((x for x in items if x.get("title")==wanted), None)
          if not found:
              out=subprocess.check_output(["npx","wrangler","kv","namespace","create","GFS_KV","--json"], text=True)
              found=json.loads(out)
              # Wrangler returns the created namespace id in result.id on current versions.
              nsid=found.get("result",{}).get("id") or found.get("id")
          else:
              nsid=found["id"]
          print(f"GFS_KV_NAMESPACE_ID={nsid}")
          open("/tmp/gfs-kv-id","w").write(nsid)
          PY
          sed -i "s/REPLACE_WITH_GFS_KV_NAMESPACE_ID/$(cat /tmp/gfs-kv-id)/" wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure Telegram secrets
        if: ${{ secrets.TELEGRAM_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$TELEGRAM_TOKEN" | npx wrangler secret put TELEGRAM_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID
