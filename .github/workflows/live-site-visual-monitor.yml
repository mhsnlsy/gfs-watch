name: Live Site Visual Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-site-visual-monitor.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy Cloudflare Platform"
      - "Deploy Cloudflare Istanbul GFS Service"
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  # Let an active production inspection finish when a later run is queued.
  group: live-site-visual-monitor
  cancel-in-progress: false

jobs:
  visual-monitor:
    name: Inspect production site in Chromium
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          LIVE_VISUAL="$RUNNER_TEMP/live-site-monitor"
          mkdir -p "$LIVE_VISUAL"
          cd "$LIVE_VISUAL"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --omit=dev playwright@1.56.1
          test -f "$LIVE_VISUAL/node_modules/playwright/package.json"
          "$LIVE_VISUAL/node_modules/.bin/playwright" install chromium
          node -e 'console.log("Monitor Playwright:", require(process.cwd() + "/node_modules/playwright/package.json").version)'

      - name: Open live site in desktop and mobile browsers
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/live-site-monitor/node_modules/playwright
          PUBLIC_SITE: https://www.istanbulunhavasi.com
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-site-evidence"
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const { chromium } = require(process.env.PLAYWRIGHT_PACKAGE);
          const out = process.env.RUNNER_TEMP + "/live-site-evidence";
          const base = process.env.PUBLIC_SITE;
          const report = {
            url: base,
            checked_at_utc: new Date().toISOString(),
            viewports: {},
            koy_viewports: {},
            f72: null,
            console_errors: [],
            page_errors: [],
            failed_requests: [],
            bad_responses: []
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const view of [
                { name: "desktop", width: 1440, height: 1000 },
                { name: "mobile", width: 390, height: 844 }
              ]) {
                const context = await browser.newContext({
                  viewport: { width: view.width, height: view.height },
                  deviceScaleFactor: view.name === "mobile" ? 2 : 1,
                  isMobile: view.name === "mobile",
                  hasTouch: view.name === "mobile",
                  locale: "tr-TR",
                  timezoneId: "Europe/Istanbul"
                });
                const page = await context.newPage();

                page.on("console", message => {
                  if (message.type() === "error") report.console_errors.push({
                    viewport: view.name, text: message.text()
                  });
                });
                page.on("pageerror", error => report.page_errors.push({
                  viewport: view.name, text: String(error)
                }));
                page.on("requestfailed", request => report.failed_requests.push({
                  viewport: view.name,
                  url: request.url(),
                  error: request.failure()?.errorText || "failed"
                }));
                page.on("response", async response => {
                  if (response.status() >= 400) report.bad_responses.push({
                    viewport: view.name, status: response.status(), url: response.url()
                  });
                  if (view.name === "desktop" && /\/gfs\/f72(?:\?|$)/.test(response.url())) {
                    try {
                      const doc = await response.json();
                      report.f72 = {
                        status: response.status(),
                        run_id_utc: doc.run_id_utc,
                        horizon_hours: doc.forecast_horizon_hours,
                        points: (doc.forecast_6_hourly || []).filter(p =>
                          Number(p.forecast_hour) > 0 &&
                          Number(p.forecast_hour) <= 72 &&
                          Number(p.forecast_hour) % 3 === 0
                        ).length,
                        rh2m_numeric_points: (doc.forecast_6_hourly || []).filter(p =>
                          Number(p.forecast_hour) > 0 &&
                          Number(p.forecast_hour) <= 72 &&
                          Number(p.forecast_hour) % 3 === 0 &&
                          p.humidity_2m_percent !== null &&
                          p.humidity_2m_percent !== undefined &&
                          Number.isFinite(Number(p.humidity_2m_percent))
                        ).length,
                        snowln_numeric_points: (doc.forecast_6_hourly || []).filter(p =>
                          Number(p.forecast_hour) > 0 &&
                          Number(p.forecast_hour) <= 72 &&
                          Number(p.forecast_hour) % 3 === 0 &&
                          p.snowln !== null && p.snowln !== undefined &&
                          Number.isFinite(Number(p.snowln))
                        ).length
                      };
                    } catch (error) {
                      report.f72 = { status: response.status(), parse_error: String(error) };
                    }
                  }
                });

                const response = await page.goto(base + "/?visual-check=" + Date.now(), {
                  waitUntil: "domcontentloaded",
                  timeout: 60000
                });
                if (!response || !response.ok()) {
                  throw new Error("Homepage navigation failed: HTTP " + (response?.status() ?? "no response"));
                }
                await page.locator("#meteopt-table-status").waitFor({ state: "visible", timeout: 30000 });
                await page.waitForFunction(() => {
                  const status = document.querySelector("#meteopt-table-status")?.textContent || "";
                  return /^\s*24\s*\/\s*24/.test(status);
                }, { timeout: 60000 });

                const table = page.locator("#meteopt-gfs-table");
                await table.scrollIntoViewIfNeeded();
                await page.waitForTimeout(500);
                await table.screenshot({
                  path: path.join(out, "meteopt-table-" + view.name + ".png"),
                  animations: "disabled"
                });
                await page.screenshot({
                  path: path.join(out, "homepage-" + view.name + ".png"),
                  fullPage: true,
                  animations: "disabled"
                });

                report.viewports[view.name] = await page.evaluate(() => {
                  const rows = [...document.querySelectorAll("#meteopt-table-body tr")];
                  const headers = [...document.querySelectorAll("#meteopt-gfs-table thead th")]
                    .map(cell => cell.innerText.replace(/\s+/g, " ").trim());
                  const humidityValues = rows.map(row => row.cells[7]?.innerText.trim() || "");
                  const dewPoints = rows.map(row => row.cells[8]?.innerText.trim() || "");
                  const snowlines = rows.map(row => row.cells[9]?.innerText.trim() || "");
                  return {
                    title: document.title,
                    headers,
                    run: document.querySelector("#meteopt-table-run")?.textContent || "",
                    status: document.querySelector("#meteopt-table-status")?.textContent || "",
                    rows: rows.length,
                    columns: document.querySelectorAll("#meteopt-gfs-table thead th").length,
                    humidity_values: humidityValues,
                    numeric_humidity_count: humidityValues.filter(value => value && value !== "—" && Number.isFinite(Number(value.replace(",", ".")))).length,
                    numeric_dew_point_count: dewPoints.filter(value => value && value !== "—" && Number.isFinite(Number(value.replace(",", ".")))).length,
                    numeric_snowln_count: snowlines.filter(value => value && value !== "—" && Number.isFinite(Number(value.replace(",", ".")))).length,
                    dew_point_values: dewPoints,
                    snowln_values: snowlines,
                    humidity_scale_valid: rows.every(row => {
                      const valueText = row.cells[7]?.querySelector(".meteopt-value")?.textContent.trim() || "";
                      const value = Number(valueText.replace(",", "."));
                      const expected = value < 30 ? "rh2m-warm-1" : value < 45 ? "rh2m-warm-2" :
                        value < 60 ? "rh2m-warm-3" : value < 75 ? "rh2m-cool-1" :
                        value < 90 ? "rh2m-cool-2" : "rh2m-cool-3";
                      return Number.isFinite(value) && row.cells[7]?.querySelector(".meteopt-value")?.classList.contains(expected);
                    }),
                    first_row: rows[0]?.innerText || "",
                    last_row: rows[rows.length - 1]?.innerText || "",
                    viewport_width: window.innerWidth,
                    document_width: document.documentElement.scrollWidth,
                    horizontal_overflow_px: Math.max(0, document.documentElement.scrollWidth - window.innerWidth)
                  };
                });

                // The Köy page has its own MeteoPT table and must prove that the
                // Magnus dew-point column is actually populated on all 24 steps.
                const koyPage = await context.newPage();
                koyPage.on("console", message => {
                  if (message.type() === "error") report.console_errors.push({
                    viewport: view.name + "-koy", text: message.text()
                  });
                });
                koyPage.on("pageerror", error => report.page_errors.push({
                  viewport: view.name + "-koy", text: String(error)
                }));
                koyPage.on("requestfailed", request => report.failed_requests.push({
                  viewport: view.name + "-koy",
                  url: request.url(),
                  error: request.failure()?.errorText || "failed"
                }));
                const koyResponse = await koyPage.goto(base + "/koy?visual-check=" + Date.now(), {
                  waitUntil: "domcontentloaded",
                  timeout: 60000
                });
                if (!koyResponse || !koyResponse.ok()) {
                  throw new Error("Köy page navigation failed: HTTP " + (koyResponse?.status() ?? "no response"));
                }
                await koyPage.locator("#meteopt-table-status").waitFor({ state: "visible", timeout: 30000 });
                await koyPage.waitForFunction(() => {
                  const status = document.querySelector("#meteopt-table-status")?.textContent || "";
                  return /^\s*24\s*\/\s*24/.test(status);
                }, { timeout: 60000 });
                const koyTable = koyPage.locator("#meteopt-gfs-table");
                await koyTable.scrollIntoViewIfNeeded();
                await koyPage.waitForTimeout(500);
                await koyTable.screenshot({
                  path: path.join(out, "koy-meteopt-table-" + view.name + ".png"),
                  animations: "disabled"
                });
                await koyPage.screenshot({
                  path: path.join(out, "koy-page-" + view.name + ".png"),
                  fullPage: true,
                  animations: "disabled"
                });
                report.koy_viewports[view.name] = await koyPage.evaluate(() => {
                  const rows = [...document.querySelectorAll("#meteopt-table-body tr")];
                  const headers = [...document.querySelectorAll("#meteopt-gfs-table thead th")]
                    .map(cell => cell.innerText.replace(/\s+/g, " ").trim());
                  const humidityValues = rows.map(row => row.cells[7]?.innerText.trim() || "");
                  const dewPoints = rows.map(row => row.cells[8]?.innerText.trim() || "");
                  return {
                    title: document.title,
                    run: document.querySelector("#meteopt-table-run")?.textContent || "",
                    status: document.querySelector("#meteopt-table-status")?.textContent || "",
                    rows: rows.length,
                    columns: document.querySelectorAll("#meteopt-gfs-table thead th").length,
                    headers,
                    humidity_values: humidityValues,
                    numeric_humidity_count: humidityValues.filter(value => value && value !== "—" && Number.isFinite(Number(value.replace(",", ".")))).length,
                    humidity_scale_valid: rows.every(row => {
                      const valueText = row.cells[7]?.querySelector(".meteopt-value")?.textContent.trim() || "";
                      const value = Number(valueText.replace(",", "."));
                      const expected = value < 30 ? "rh2m-warm-1" : value < 45 ? "rh2m-warm-2" :
                        value < 60 ? "rh2m-warm-3" : value < 75 ? "rh2m-cool-1" :
                        value < 90 ? "rh2m-cool-2" : "rh2m-cool-3";
                      return Number.isFinite(value) && row.cells[7]?.querySelector(".meteopt-value")?.classList.contains(expected);
                    }),
                    dew_point_values: dewPoints,
                    numeric_dew_point_count: dewPoints.filter(value => value && value !== "—" && Number.isFinite(Number(value.replace(",", ".")))).length,
                    snowln_first_row: rows[0]?.cells[9]?.innerText.trim() || "",
                    viewport_width: window.innerWidth,
                    document_width: document.documentElement.scrollWidth
                  };
                });
                await context.close();
              }

              if (report.viewports.desktop.rows !== 24 || report.viewports.mobile.rows !== 24) {
                throw new Error("The real homepage did not render 24 forecast rows on desktop and mobile.");
              }
              const expectedIstanbulHeaders = [
                "Steps", "Date/Hour (TSİ)", "T.2m", "Prec.", "W.10m", "T.850",
                "W.850", "RH.2m (%)", "Dew Point (°C)", "Snowln (m)"
              ];
              const expectedKoyHeaders = expectedIstanbulHeaders;
              for (const viewport of ["desktop", "mobile"]) {
                const istanbul = report.viewports[viewport];
                if (!istanbul || istanbul.rows !== 24 || istanbul.columns !== 10 ||
                    istanbul.numeric_humidity_count !== 24 || !istanbul.humidity_scale_valid ||
                    istanbul.numeric_dew_point_count !== 24 || istanbul.numeric_snowln_count !== 24 ||
                    JSON.stringify(istanbul.headers) !== JSON.stringify(expectedIstanbulHeaders)) {
                  throw new Error("The Istanbul GFS table must render the requested 10-column order and 24 RH.2m, Dew Point and Snowln values on " +
                    viewport + ": " + JSON.stringify(istanbul));
                }
                const koy = report.koy_viewports[viewport];
                if (!koy || koy.rows !== 24 || koy.columns !== 10 ||
                    koy.numeric_humidity_count !== 24 || !koy.humidity_scale_valid || koy.numeric_dew_point_count !== 24 ||
                    JSON.stringify(koy.headers) !== JSON.stringify(expectedKoyHeaders)) {
                  throw new Error("The Köy table must render the requested 10-column order, 24 RH.2m values and 24 dew points on " +
                    viewport + ": " + JSON.stringify(koy));
                }
              }
              if (!report.f72 || report.f72.status !== 200 || report.f72.points !== 24 ||
                  report.f72.rh2m_numeric_points !== 24 ||
                  report.f72.snowln_numeric_points !== 24 ||
                  !report.f72.run_id_utc || report.f72.horizon_hours < 72) {
                throw new Error("The browser did not receive a valid live F72 payload: " + JSON.stringify(report.f72));
              }
              if (report.page_errors.length) {
                throw new Error("The live site emitted JavaScript page errors: " + JSON.stringify(report.page_errors));
              }

              fs.writeFileSync(path.join(out, "diagnostics.json"), JSON.stringify(report, null, 2));
              console.log(JSON.stringify({
                checked_at_utc: report.checked_at_utc,
                f72: report.f72,
                desktop: report.viewports.desktop,
                mobile: report.viewports.mobile,
                koy_desktop: report.koy_viewports.desktop,
                koy_mobile: report.koy_viewports.mobile,
                console_errors: report.console_errors.length,
                page_errors: report.page_errors.length,
                failed_requests: report.failed_requests.length,
                bad_responses: report.bad_responses.length
              }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            fs.writeFileSync(path.join(out, "diagnostics.json"), JSON.stringify({
              ...report, fatal_error: String(error), stack: error.stack
            }, null, 2));
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Upload screenshots and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-visual-check
          path: ${{ runner.temp }}/live-site-evidence/
          if-no-files-found: warn
          retention-days: 14
