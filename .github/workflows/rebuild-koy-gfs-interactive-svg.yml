name: Verify Köy GFS Cloudflare SVG

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koy-gfs-svg-cloudflare-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Worker-rendered four-panel SVG from D1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify the live Cloudflare renderer and D1 publication
        env:
          KOY_GFS_API: https://gfs-watch-koy-gfs.muhsin-ulusoy.workers.dev/api
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 "$KOY_GFS_API/health?verify=$(date +%s)" -o "$RUNNER_TEMP/koy-health.json"
          node - "$RUNNER_TEMP/koy-health.json" <<'NODE'
          const fs = require("fs");
          const health = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (health.ok !== true) throw new Error("Köy GFS Worker health is not OK");
          if (health.svg_renderer !== "cloudflare-js-v5-raw-forecast-hour") {
            throw new Error("Cloudflare SVG renderer is not active: " + health.svg_renderer);
          }
          if (Number(health.archived_runs || 0) < 4) {
            throw new Error("Four archived Köy GFS runs are required; found " + health.archived_runs);
          }
          console.log("Cloudflare renderer active; D1 archived runs:", health.archived_runs);
          NODE

          curl --silent --show-error --fail --max-time 45 \
            "$KOY_GFS_API/comparison.svg?verify=$(date +%s)" \
            --dump-header "$RUNNER_TEMP/koy-svg-headers.txt" \
            --output "$RUNNER_TEMP/koy-comparison.svg"

          grep -qi '^content-type: image/svg+xml' "$RUNNER_TEMP/koy-svg-headers.txt"
          grep -qi '^x-gfs-publication-source: D1' "$RUNNER_TEMP/koy-svg-headers.txt"
          grep -q 'id="gfs-renderer-version">cloudflare-js-v5-raw-forecast-hour</metadata>' "$RUNNER_TEMP/koy-comparison.svg"
          grep -q 'id="gfs-interactive-data"' "$RUNNER_TEMP/koy-comparison.svg"

          node - "$RUNNER_TEMP/koy-comparison.svg" <<'NODE'
          const fs = require("fs");
          const svg = fs.readFileSync(process.argv[2], "utf8");
          const match = svg.match(/<metadata id="gfs-interactive-data"><!\[CDATA\[([\s\S]*?)\]\]><\/metadata>/);
          if (!match) throw new Error("Interactive SVG metadata is missing");
          const data = JSON.parse(match[1]);
          if (data.renderer !== "cloudflare-js-v5-raw-forecast-hour") throw new Error("Unexpected SVG renderer");
          if (!Array.isArray(data.panels) || data.panels.length !== 4) throw new Error("Four graph panels are required");
          for (const panel of data.panels) {
            if (!Array.isArray(panel.valid_times) || panel.valid_times.length < 2) {
              throw new Error("Insufficient valid-time points in " + panel.id);
            }
            if (!Array.isArray(panel.series) || panel.series.length !== 4) {
              throw new Error("Four GFS series are required in " + panel.id);
            }
          }
          console.log("Verified Cloudflare SVG:", data.panels.length, "panels; four cycles; interactive valid-time metadata.");
          NODE
