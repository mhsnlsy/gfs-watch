name: Rebuild Köy GFS Interactive SVG

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_koy_gfs_interactive_svg.py"
      - ".github/workflows/rebuild-koy-gfs-interactive-svg.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: koy-gfs-interactive-svg-builder
  cancel-in-progress: true

jobs:
  rebuild:
    name: Regenerate and persist Köy four-panel SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out renderer source
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Check out canonical Köy GFS archive
        uses: actions/checkout@v5
        with:
          ref: koy-gfs-data
          path: koy-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SVG renderer dependency
        run: python -m pip install --disable-pip-version-check matplotlib

      - name: Refresh Köy comparison from live D1 archive
        env:
          KOY_GFS_DIR: ${{ github.workspace }}/koy-data/gfs
          KOY_GFS_API: https://gfs-watch-koy-gfs.muhsin-ulusoy.workers.dev/api
        run: |
          set -euo pipefail
          mkdir -p "$KOY_GFS_DIR"
          curl --silent --show-error --fail --retry 3 --retry-delay 2 --max-time 60 \
            "$KOY_GFS_API/comparison?asset_refresh=$(date +%s)" \
            -o "$KOY_GFS_DIR/comparison.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          doc = json.loads((Path(os.environ["KOY_GFS_DIR"]) / "comparison.json").read_text(encoding="utf-8"))
          runs = doc.get("runs") or []
          if len(runs) < 4:
              raise SystemExit(f"Live Köy comparison has only {len(runs)} runs; four are required.")
          latest = max(runs, key=lambda item: item.get("run_id_utc", ""))
          print("Live Köy comparison refreshed:", latest["run_id_utc"], "cycles:", len(runs))
          PY

      - name: Rebuild four-panel SVG from canonical valid-time archive
        env:
          KOY_GFS_DIR: ${{ github.workspace }}/koy-data/gfs
        run: |
          set -euo pipefail
          python source/scripts/build_koy_gfs_interactive_svg.py
          test "$(cat koy-data/gfs/media/.koy-svg-renderer-version)" = "koy-gfs-weekday-axis-v1"
          SVG="$(python -c 'from pathlib import Path; files=list(Path("koy-data/gfs/media").glob("koy-gfs-*-comparison.svg")); print(max(files, key=lambda p: p.stat().st_mtime) if files else "")')"
          test -n "$SVG" && test -s "$SVG"
          grep -q 'gfs-interactive-data' "$SVG"
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("koy_svg", "source/scripts/build_koy_gfs_interactive_svg.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.label_time("2026-11-09T00:00:00+00:00") == "09" + chr(10) + "Pzt"
          assert module.label_time("2026-11-07T00:00:00+00:00") == "07" + chr(10) + "Cmt"
          print("Turkish weekday labels verified.")
          PY

      - name: Persist regenerated SVG to koy-gfs-data
        id: persist
        working-directory: koy-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfs/media/*.svg gfs/media/.koy-svg-renderer-version
          if git diff --cached --quiet; then
            echo "The canonical Köy SVG already has Turkish weekday labels."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Rebuild Köy GFS SVG with Turkish weekday axis"
            git push origin HEAD:koy-gfs-data
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy newly generated Köy SVG to Cloudflare
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare-platform.yml --ref main
