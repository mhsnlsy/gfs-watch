name: GFS Watch

on:
  schedule:
    # Run every 10 minutes, offset from the start of the hour to reduce queue delays.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

concurrency:
  group: gfs-watch-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-gfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore GFS run history
        run: |
          git fetch origin gfs-watch-state
          if git cat-file -e origin/gfs-watch-state:gfs_watch.db 2>/dev/null; then
            git show origin/gfs-watch-state:gfs_watch.db > gfs_watch.db
          fi

      - name: Check GFS once
        env:
          GFS_WATCH_ONCE: "1"
          DB_PATH: gfs_watch.db
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python -u main.py

      - name: Save GFS run history
        run: |
          cp gfs_watch.db "$RUNNER_TEMP/gfs_watch.db"
          git checkout -B gfs-watch-state origin/gfs-watch-state
          cp "$RUNNER_TEMP/gfs_watch.db" gfs_watch.db
          git add -f gfs_watch.db
          if git diff --cached --quiet; then
            echo "GFS run history has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GFS run history"
          git push origin gfs-watch-state
