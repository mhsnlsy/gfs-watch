name: GFS Watch

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/gfs-watch.yml"
  workflow_dispatch:

concurrency:
  group: gfs-watch-run-v5
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  check-gfs:
    name: Discover, prefetch and report every completed GFS cycle
    outputs:
      gfs_updated: ${{ steps.report.outputs.gfs_updated }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare NOAA cache directory
        run: mkdir -p noaa_cache_v2
      - name: Restore partial NOAA forecast cache
        id: noaa-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: noaa_cache_v2
          key: gfs-noaa-cache-v4-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gfs-noaa-cache-v4-
      - name: Restore GFS run and Pages notification history
        run: |
          git fetch origin gfs-watch-state
          if git cat-file -e origin/gfs-watch-state:gfs_watch.db 2>/dev/null; then
            git show origin/gfs-watch-state:gfs_watch.db > gfs_watch.db
          fi
          # Restore the existing manifest and its media before report generation.
          # This lets each new run retain the previous four reports instead of
          # replacing the website feed with a one-item manifest.
          if git cat-file -e origin/gfs-watch-state:public/notifications/latest.json 2>/dev/null; then
            git archive origin/gfs-watch-state public/notifications | tar -x -C .
            echo "Previous Pages notification archive restored."
          else
            echo "No previous Pages notification archive exists; first report will create it."
          fi
      - name: Record latest processed GFS cycle
        run: |
          python - <<'PY'
          import os
          import sqlite3
          try:
              with sqlite3.connect("file:gfs_watch.db?mode=ro", uri=True) as db:
                  row = db.execute("SELECT MAX(run_name) FROM gfs_runs_v3").fetchone()
                  run_id = row[0] or "none"
          except sqlite3.Error:
              run_id = "none"
          with open(os.path.join(os.environ["RUNNER_TEMP"], "gfs-before-run.txt"), "w") as output:
              output.write(run_id)
          print(f"Previously processed latest GFS cycle: {run_id}")
          PY
      - name: Discover NOAA cycles, prefetch and process one reportable cycle
        id: check-gfs
        continue-on-error: true
        env:
          GFS_WATCH_ONCE: "1"
          DB_PATH: gfs_watch.db
          PUBLIC_DATA_DIR: public
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          NOAA_CACHE_DIR: noaa_cache_v2
          NOAA_PREFETCH_FILES_PER_CHECK: "141"
          NOAA_PREFETCH_INTERVAL_SECONDS: "300"
          NOAA_RANGE_DOWNLOAD_WORKERS: "8"
        run: python -u main.py
      - name: Detect newly generated GFS report
        id: report
        if: always() && steps.check-gfs.outcome == 'success'
        run: |
          before="$(cat "$RUNNER_TEMP/gfs-before-run.txt")"
          after="$(python - <<'PY'
          import sqlite3
          try:
              with sqlite3.connect("file:gfs_watch.db?mode=ro", uri=True) as db:
                  row = db.execute("SELECT MAX(run_name) FROM gfs_runs_v3").fetchone()
                  print(row[0] or "none")
          except sqlite3.Error:
              print("none")
          PY
          )"
          if [ "$after" != "none" ] && [ "$after" != "$before" ]; then
            echo "gfs_updated=true" >> "$GITHUB_OUTPUT"
            echo "New GFS cycle processed: $after"
          else
            echo "gfs_updated=false" >> "$GITHUB_OUTPUT"
            echo "No new completed GFS cycle was generated in this session."
          fi
      - name: Save partial NOAA forecast cache
        if: always() && steps.check-gfs.outputs.noaa_cache_updated == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: noaa_cache_v2
          key: gfs-noaa-cache-v4-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save GFS run history
        if: always()
        run: |
          if [ ! -f gfs_watch.db ]; then
            echo "GFS database missing; nothing to save."
            exit 0
          fi
          cp gfs_watch.db "$RUNNER_TEMP/gfs_watch.db"
          mkdir -p "$RUNNER_TEMP/public"
          if [ "${{ steps.check-gfs.outcome }}" = "success" ] && [ -d public ]; then
            cp -a public/. "$RUNNER_TEMP/public/"
          else
            echo "Report step failed; keeping the previously published Pages forecast and notification archive."
          fi
          rm -rf public
          git checkout -B gfs-watch-state origin/gfs-watch-state
          mkdir -p public/runs
          # Sync the report feed as a unit so retired media does not linger
          # and the manifest/media set always describes the same four reports.
          rm -rf public/notifications
          cp -a "$RUNNER_TEMP/public/." public/
          find public/runs -type f -name '*.json' -mtime +10 -delete
          cp "$RUNNER_TEMP/gfs_watch.db" gfs_watch.db
          git add -f gfs_watch.db public
          if git diff --cached --quiet; then
            echo "GFS run history has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GFS run history"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin gfs-watch-state
            if git push origin gfs-watch-state; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish GFS run history after five attempts."
          exit 1
  queue-next-check:
    name: Queue the next automatic NOAA check
    needs: check-gfs
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait five minutes and dispatch the next check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Next NOMADS/S3 discovery check in five minutes."
          sleep 300
          gh workflow run gfs-watch.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Next automatic GFS check queued."

  deploy-pages:
    name: Publish latest report to GitHub Pages
    needs: check-gfs
    if: needs.check-gfs.result == 'success' && needs.check-gfs.outputs.gfs_updated == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  send-web-push:
    name: Send device notification after Pages deployment
    needs: deploy-pages
    if: needs.deploy-pages.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/web-push-notify.yml
    secrets: inherit
