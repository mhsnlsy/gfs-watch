name: GFS Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gfs-watch.yml"
  workflow_dispatch:

concurrency:
  group: gfs-watch-run-v3
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  start-gfs-watch:
    name: Start the 12Z GFS watch at the configured time
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Wait until the requested prefetch start
        env:
          GFS_PREFETCH_START_AT_UTC: "2026-11-01T12:36:02Z"
        run: |
          target_epoch=$(date -u -d "$GFS_PREFETCH_START_AT_UTC" +%s)
          now_epoch=$(date -u +%s)
          wait_seconds=$((target_epoch - now_epoch))
          if [ "$wait_seconds" -gt 0 ]; then
            echo "GFS prefetch starts at $GFS_PREFETCH_START_AT_UTC; waiting ${wait_seconds}s."
            sleep "$wait_seconds"
          else
            echo "Configured GFS start time has passed; starting immediately."
          fi
      - name: Launch the five-minute GFS watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gfs-watch.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "GFS five-minute watch dispatched."

  check-gfs:
    name: Poll NOAA and prefetch until the target f180 report is ready
    if: github.event_name == 'workflow_dispatch'
    outputs:
      gfs_updated: ${{ steps.report.outputs.gfs_updated }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare NOAA cache directory
        run: mkdir -p noaa_cache
      - name: Restore partial NOAA forecast cache
        id: noaa-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: noaa_cache
          key: gfs-noaa-cache-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gfs-noaa-cache-v2-
            gfs-noaa-cache-v1-
      - name: Restore GFS run history
        run: |
          git fetch origin gfs-watch-state
          if git cat-file -e origin/gfs-watch-state:gfs_watch.db 2>/dev/null; then
            git show origin/gfs-watch-state:gfs_watch.db > gfs_watch.db
          fi
      - name: Record latest processed GFS cycle
        run: |
          python - <<'PY'
          import os
          import sqlite3
          try:
              with sqlite3.connect("file:gfs_watch.db?mode=ro", uri=True) as db:
                  row = db.execute("SELECT MAX(run_name) FROM gfs_runs_v3").fetchone()
                  run_id = row[0] or "none"
          except sqlite3.Error:
              run_id = "none"
          with open(os.path.join(os.environ["RUNNER_TEMP"], "gfs-before-run.txt"), "w") as output:
              output.write(run_id)
          print(f"Previously processed latest GFS cycle: {run_id}")
          PY
      - name: Check NOAA every five minutes and report when f180 is ready
        id: check-gfs
        continue-on-error: true
        env:
          GFS_WATCH_ONCE: "1"
          GFS_WATCH_CONTINUOUS: "1"
          GFS_WATCH_WINDOW_MINUTES: "330"
          GFS_WATCH_POLL_SECONDS: "300"
          GFS_WATCH_TARGET_RUN_ID: "2026-11-01T12:00:00+00:00"
          DB_PATH: gfs_watch.db
          PUBLIC_DATA_DIR: public
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          NOAA_CACHE_DIR: noaa_cache
          NOAA_PREFETCH_FILES_PER_CHECK: "141"
          NOAA_PREFETCH_INTERVAL_SECONDS: "300"
          NOAA_RANGE_DOWNLOAD_WORKERS: "8"
        run: python -u main.py
      - name: Detect newly generated GFS report
        id: report
        if: always() && steps.check-gfs.outcome == 'success'
        env:
          GFS_WATCH_TARGET_RUN_ID: "2026-11-01T12:00:00+00:00"
        run: |
          before="$(cat "$RUNNER_TEMP/gfs-before-run.txt")"
          after="$(python - <<'PY'
          import sqlite3
          try:
              with sqlite3.connect("file:gfs_watch.db?mode=ro", uri=True) as db:
                  row = db.execute("SELECT MAX(run_name) FROM gfs_runs_v3").fetchone()
                  print(row[0] or "none")
          except sqlite3.Error:
              print("none")
          PY
          )"
          if [ "$after" != "none" ] && [ "$after" != "$before" ] && [ "$after" = "$GFS_WATCH_TARGET_RUN_ID" ]; then
            echo "gfs_updated=true" >> "$GITHUB_OUTPUT"
            echo "Target GFS cycle processed and report sent: $after"
          else
            echo "gfs_updated=false" >> "$GITHUB_OUTPUT"
            echo "Target f180 report has not been generated in this session."
          fi
      - name: Save partial NOAA forecast cache
        if: always() && steps.check-gfs.outputs.noaa_cache_updated == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: noaa_cache
          key: gfs-noaa-cache-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save GFS run history
        run: |
          cp gfs_watch.db "$RUNNER_TEMP/gfs_watch.db"
          mkdir -p "$RUNNER_TEMP/public"
          if [ -d public ]; then
            cp -a public/. "$RUNNER_TEMP/public/"
          fi
          rm -rf public
          git checkout -B gfs-watch-state origin/gfs-watch-state
          mkdir -p public/runs
          cp -a "$RUNNER_TEMP/public/." public/
          find public/runs -type f -name '*.json' -mtime +10 -delete
          cp "$RUNNER_TEMP/gfs_watch.db" gfs_watch.db
          git add -f gfs_watch.db public
          if git diff --cached --quiet; then
            echo "GFS run history has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GFS run history"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin gfs-watch-state
            if git push origin gfs-watch-state; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish GFS run history after five attempts."
          exit 1
      - name: Check whether the target GFS cycle is in run history
        id: target-status
        if: always()
        env:
          GFS_WATCH_TARGET_RUN_ID: "2026-11-01T12:00:00+00:00"
        run: |
          processed="$(python - <<'PY'
          import os
          import sqlite3
          target = os.environ["GFS_WATCH_TARGET_RUN_ID"]
          try:
              with sqlite3.connect("file:gfs_watch.db?mode=ro", uri=True) as db:
                  row = db.execute(
                      "SELECT 1 FROM gfs_runs_v3 WHERE run_name = ? LIMIT 1",
                      (target,),
                  ).fetchone()
              print("true" if row else "false")
          except sqlite3.Error:
              print("false")
          PY
          )"
          echo "target_processed=$processed" >> "$GITHUB_OUTPUT"
          echo "Target GFS cycle processed: $processed"
      - name: Queue another watch session if f180 is still pending
        if: always() && !cancelled() && steps.target-status.outputs.target_processed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          next=$(( (now / 300 + 1) * 300 ))
          delay=$(( next - now ))
          echo "Target f180 is still pending; next watch session starts at $(date -u -d "@$next" +'%Y-%m-%dT%H:%M:%SZ')."
          sleep "$delay"
          gh workflow run gfs-watch.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Next GFS watch session queued."

  deploy-pages:
    name: Publish latest report to GitHub Pages
    needs: check-gfs
    if: needs.check-gfs.result == 'success' && needs.check-gfs.outputs.gfs_updated == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  send-web-push:
    name: Send device notification after Pages deployment
    needs: deploy-pages
    if: needs.deploy-pages.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/web-push-notify.yml
    secrets: inherit
