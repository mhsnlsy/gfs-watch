name: GFS Watch

on:
  # Start 3h50 after each GFS cycle begins (Istanbul = UTC+3).
  # One workflow run caches newly available GRIB2 lead files every 5 minutes,
  # while checking the final f180 object every 15 seconds for up to 90 minutes.
  schedule:
    - cron: "50 3 * * *"   # 06:50 Istanbul, 00Z cycle
    - cron: "50 9 * * *"   # 12:50 Istanbul, 06Z cycle
    - cron: "50 15 * * *"  # 18:50 Istanbul, 12Z cycle
    - cron: "50 21 * * *"  # 00:50 Istanbul, 18Z cycle
  workflow_dispatch:

concurrency:
  group: gfs-watch-run-v2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-gfs:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare NOAA cache directory
        run: mkdir -p noaa_cache
      - name: Restore partial NOAA forecast cache
        id: noaa-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: noaa_cache
          key: gfs-noaa-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gfs-noaa-cache-v1-
      - name: Restore GFS run history
        run: |
          git fetch origin gfs-watch-state
          if git cat-file -e origin/gfs-watch-state:gfs_watch.db 2>/dev/null; then
            git show origin/gfs-watch-state:gfs_watch.db > gfs_watch.db
          fi
      - name: Check GFS once
        id: check-gfs
        env:
          GFS_WATCH_ONCE: "1"
          GFS_WATCH_CONTINUOUS: ${{ github.event_name == 'schedule' && '1' || '0' }}
          GFS_WATCH_WINDOW_MINUTES: "90"
          GFS_WATCH_POLL_SECONDS: "15"
          DB_PATH: gfs_watch.db
          PUBLIC_DATA_DIR: public
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          NOAA_CACHE_DIR: noaa_cache
          NOAA_PREFETCH_MIN_AGE_HOURS: "3.8333"
          NOAA_PREFETCH_FILES_PER_CHECK: "141"
          NOAA_PREFETCH_INTERVAL_SECONDS: "300"
          NOAA_RANGE_DOWNLOAD_WORKERS: "8"
        run: python -u main.py
      - name: Save partial NOAA forecast cache
        if: always() && steps.check-gfs.outputs.noaa_cache_updated == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: noaa_cache
          key: gfs-noaa-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save GFS run history
        run: |
          cp gfs_watch.db "$RUNNER_TEMP/gfs_watch.db"
          mkdir -p "$RUNNER_TEMP/public"
          if [ -d public ]; then
            cp -a public/. "$RUNNER_TEMP/public/"
          fi
          rm -rf public
          git checkout -B gfs-watch-state origin/gfs-watch-state
          mkdir -p public/runs
          cp -a "$RUNNER_TEMP/public/." public/
          find public/runs -type f -name '*.json' -mtime +10 -delete
          cp "$RUNNER_TEMP/gfs_watch.db" gfs_watch.db
          git add -f gfs_watch.db public
          if git diff --cached --quiet; then
            echo "GFS run history has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GFS run history"
          git push origin gfs-watch-state
