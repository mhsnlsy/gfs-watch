name: Refresh NOAA GFS Baseline

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-gfs-baseline.trigger"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ecCodes system library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore historical GFS database
        run: |
          git fetch origin gfs-watch-state
          git show origin/gfs-watch-state:gfs_watch.db > gfs_watch.db
      - name: Refresh 00Z baseline from NOAA without sending a notification
        env:
          DB_PATH: gfs_watch.db
        run: |
          python - <<'PY'
          import json
          import main

          run_id = "2026-10-31T00:00:00+00:00"
          main.init_db()
          payload = main.fetch_full_weather_data(run_id)
          if not payload or "_pending_noaa_gfs" in payload:
              raise RuntimeError(f"NOAA 00Z baseline refresh failed: {payload}")
          main.save_run(run_id, payload)
          print("[BASELINE REFRESHED]", json.dumps({
              "run": run_id,
              "forecast_horizon_hours": payload["forecast_horizon_hours"],
              "timeline_points": len(payload["timeline_180h"]),
              "daily_buckets": len(payload["daily"]["time"]),
              "data_source": payload["data_source"],
          }, ensure_ascii=False))
          PY
      - name: Save refreshed database to GFS state branch
        run: |
          cp gfs_watch.db "$RUNNER_TEMP/gfs_watch.db"
          git checkout -B gfs-watch-state origin/gfs-watch-state
          cp "$RUNNER_TEMP/gfs_watch.db" gfs_watch.db
          git add -f gfs_watch.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh exact 00Z GFS baseline from NOAA GRIB2"
          git push origin gfs-watch-state
