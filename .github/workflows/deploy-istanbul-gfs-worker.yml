name: Deploy Cloudflare Istanbul GFS Service

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-istanbul-gfs-worker.yml"
      - "istanbul-gfs-worker/**"
      - "shared/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-istanbul-gfs-service
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Istanbul GFS Worker + D1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out application source
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Install Wrangler and Worker dependencies
        working-directory: source/istanbul-gfs-worker
        run: |
          npm install --no-audit --no-fund --no-progress
          npm install --global wrangler@4

      - name: Locate or create Istanbul GFS D1
        working-directory: source/istanbul-gfs-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          D1_ID="$(node - "$RUNNER_TEMP/d1-list.json" <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          function walk(value) {
            if (!value) return null;
            if (Array.isArray(value)) {
              for (const item of value) { const found = walk(item); if (found) return found; }
              return null;
            }
            if (typeof value !== "object") return null;
            const name = value.name || value.database_name || value.databaseName;
            const id = value.uuid || value.database_id || value.databaseId;
            if (name === "gfs-watch-istanbul-gfs" && id) return String(id);
            for (const child of Object.values(value)) { const found = walk(child); if (found) return found; }
            return null;
          }
          process.stdout.write(walk(data) || "");
          NODE
          )"
          if [ -z "$D1_ID" ]; then
            wrangler d1 create gfs-watch-istanbul-gfs --location eeur
            wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
            D1_ID="$(node - "$RUNNER_TEMP/d1-list.json" <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          function walk(value) {
            if (!value) return null;
            if (Array.isArray(value)) {
              for (const item of value) { const found = walk(item); if (found) return found; }
              return null;
            }
            if (typeof value !== "object") return null;
            const name = value.name || value.database_name || value.databaseName;
            const id = value.uuid || value.database_id || value.databaseId;
            if (name === "gfs-watch-istanbul-gfs" && id) return String(id);
            for (const child of Object.values(value)) { const found = walk(child); if (found) return found; }
            return null;
          }
          process.stdout.write(walk(data) || "");
          NODE
            )"
          fi
          test -n "$D1_ID" || { echo "::error::Could not resolve Istanbul GFS D1 ID"; exit 1; }
          node - "$D1_ID" wrangler.jsonc <<'NODE'
          const fs = require("fs");
          const id = process.argv[2];
          const file = process.argv[3];
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          const binding = (config.d1_databases || []).find(item => item.database_name === "gfs-watch-istanbul-gfs");
          if (!binding) throw new Error("GFS_DB binding missing");
          binding.database_id = id;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Apply Istanbul GFS D1 migrations
        working-directory: source/istanbul-gfs-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply gfs-watch-istanbul-gfs --remote --config wrangler.jsonc

      - name: Deploy autonomous Istanbul GFS Cron Worker
        working-directory: source/istanbul-gfs-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Configure event-driven GFS report dispatch secret
        working-directory: source/istanbul-gfs-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GFS_DISPATCH_TOKEN: ${{ secrets.GFS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFS_DISPATCH_TOKEN" || { echo "::error::GFS_DISPATCH_TOKEN is required for event-driven F180 report delivery"; exit 1; }
          printf '%s' "$GFS_DISPATCH_TOKEN" | wrangler secret put GFS_DISPATCH_TOKEN --config wrangler.jsonc

      - name: Configure Cloudflare-native Telegram delivery secrets
        working-directory: source/istanbul-gfs-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_TOKEN" || { echo "::error::TELEGRAM_TOKEN is required for native Cloudflare report delivery"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::CHAT_ID is required for native Cloudflare report delivery"; exit 1; }
          printf '%s' "$TELEGRAM_TOKEN" | wrangler secret put TELEGRAM_TOKEN --config wrangler.jsonc
          printf '%s' "$TELEGRAM_CHAT_ID" | wrangler secret put TELEGRAM_CHAT_ID --config wrangler.jsonc

      - name: Smoke-test live GFS collection through the Cloudflare Worker
        env:
          ISTANBUL_GFS_API: https://gfs-watch-istanbul-gfs.muhsin-ulusoy.workers.dev
          GFS_DISPATCH_TOKEN: ${{ secrets.GFS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFS_DISPATCH_TOKEN" || { echo "::error::GFS_DISPATCH_TOKEN is required for the authenticated collection smoke test"; exit 1; }
          curl --fail --silent --show-error --max-time 100 \
            --request POST \
            --url "$ISTANBUL_GFS_API/internal/reconcile?smoke=$(date +%s)" \
            --header "Authorization: Bearer $GFS_DISPATCH_TOKEN" \
            --header "Accept: application/json" \
            --output "$RUNNER_TEMP/istanbul-collect-smoke.json"
          node - "$RUNNER_TEMP/istanbul-collect-smoke.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const result = doc.result || {};
          if (doc.ok !== true || !Number.isFinite(result.fetched_cycles) ||
              result.fetched_cycles < 1 || !Array.isArray(result.warnings)) {
            throw new Error("Live Cloudflare GFS collector smoke test failed: " + JSON.stringify(doc));
          }
          console.log(JSON.stringify({
            collector: "cloudflare-worker",
            fetched_cycles: result.fetched_cycles,
            latest_run_id_utc: result.run_id_utc,
            archived_runs_changed: result.archived_runs_changed,
            f180_ready: result.f180_ready,
            report_dispatch: result.report_dispatch,
            telegram_delivery: result.telegram_delivery,
            warnings: result.warnings
          }));
          NODE
      - name: Verify active ENKA station panel contract
        env:
          STATIONS_API: https://gfs-watch-stations.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$STATIONS_API/api/stations/enka?check=$(date +%s)" -o "$RUNNER_TEMP/enka-station.json"
          node - "$RUNNER_TEMP/enka-station.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const s = doc.station || {};
          if (doc.ok !== true || s.station_id !== "ENKA-BALMUMCU-WEATHERLINK" ||
              !s.observed_at_utc || !Number.isFinite(Number(s.temperature_2m_c)) ||
              !Number.isFinite(Number(s.humidity_percent)) ||
              !Number.isFinite(Number(s.station_pressure_hpa)) ||
              !Number.isFinite(Number(s.wind_speed_10m_kmh))) {
            throw new Error("Active ENKA station panel contract failed: " + JSON.stringify(doc));
          }
          console.log(JSON.stringify({
            station: s.station_name,
            observed_at_utc: s.observed_at_utc,
            age_minutes: s.age_minutes,
            temperature_2m_c: s.temperature_2m_c,
            humidity_percent: s.humidity_percent,
            station_pressure_hpa: s.station_pressure_hpa,
            wind_speed_10m_kmh: s.wind_speed_10m_kmh,
            precipitation_daily_mm: s.precipitation_daily_mm
          }));
          NODE

      - name: Verify latest MeteoPT F72 endpoint
        env:
          ISTANBUL_GFS_API: https://gfs-watch-istanbul-gfs.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 100 \
            "$ISTANBUL_GFS_API/gfs/f72?check=$(date +%s)" -o "$RUNNER_TEMP/istanbul-f72.json"
          node - "$RUNNER_TEMP/istanbul-f72.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const points = (doc.forecast_6_hourly || []).filter(point =>
            Number(point.forecast_hour) > 0 &&
            Number(point.forecast_hour) <= 72 &&
            Number(point.forecast_hour) % 3 === 0
          );
          if (doc.schema !== "gfs-watch.forecast.v1" ||
              doc.forecast_source !== "meteopt" ||
              doc.f72?.available !== true ||
              !doc.run_id_utc ||
              points.length < 24 ||
              Number(doc.forecast_horizon_hours) < 72) {
            throw new Error("Live F72 endpoint failed: " + JSON.stringify({
              schema: doc.schema,
              source: doc.forecast_source,
              run_id_utc: doc.run_id_utc,
              f72: doc.f72,
              horizon: doc.forecast_horizon_hours,
              points: points.length
            }));
          }
          const humidityPoints = points.filter(point =>
            point.humidity_2m_percent !== null &&
            point.humidity_2m_percent !== undefined &&
            Number.isFinite(Number(point.humidity_2m_percent))
          ).length;
          const snowlinePoints = points.filter(point =>
            point.snowln !== null && point.snowln !== undefined &&
            Number.isFinite(Number(point.snowln))
          ).length;
          console.log(JSON.stringify({
            endpoint: "/gfs/f72",
            source: "MeteoPT GFS",
            run_id_utc: doc.run_id_utc,
            forecast_points: points.length,
            rh2m_numeric_points: humidityPoints,
            snowln_numeric_points: snowlinePoints,
            forecast_horizon_hours: doc.forecast_horizon_hours
          }));
          NODE

      - name: Verify Istanbul GFS Worker, D1 and four-cycle API
        env:
          ISTANBUL_GFS_API: https://gfs-watch-istanbul-gfs.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail
          health_ok=0
          for attempt in $(seq 1 8); do
            if curl --silent --show-error --fail --max-time 15 "$ISTANBUL_GFS_API/api/health?check=$(date +%s)" -o "$RUNNER_TEMP/istanbul-health.json"; then
              node - "$RUNNER_TEMP/istanbul-health.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (doc.ok !== true || doc.service !== "gfs-watch-istanbul-gfs" || doc.storage !== "D1" ||
              doc.cron !== "*/10 * * * *" || doc.report_dispatch_configured !== true ||
              doc.native_report_generation !== true || doc.telegram_configured !== true ||
              doc.photo_archive_configured !== true || doc.telegram_photo_mode !== "sendPhoto/png" ||
              doc.internal_reconcile_configured !== true || !doc.last_cron_success_at_utc ||
              !Number.isFinite(doc.pending_report_publications) ||
              !Number.isFinite(doc.sent_report_publications) ||
              !Number.isFinite(doc.exhausted_report_publications)) {
            throw new Error("Istanbul GFS health contract failed");
          }
          console.log(JSON.stringify(doc));
          NODE
              health_ok=1
              break
            fi
            sleep 8
          done
          test "$health_ok" -eq 1 || { cat "$RUNNER_TEMP/istanbul-health.json" 2>/dev/null || true; exit 1; }

          latest_ok=0
          for attempt in $(seq 1 5); do
            if curl --silent --show-error --fail --max-time 100 "$ISTANBUL_GFS_API/gfs/latest?check=$(date +%s)" -o "$RUNNER_TEMP/istanbul-latest.json"; then
              if node - "$RUNNER_TEMP/istanbul-latest.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const runs = doc.comparison_runs || [];
          if (doc.schema !== "gfs-watch.forecast.v1" || doc.f180?.available !== true ||
              !Array.isArray(doc.forecast_6_hourly) || doc.forecast_6_hourly.length < 40 ||
              !Array.isArray(runs) || runs.length < 1) {
            console.error(JSON.stringify({schema: doc.schema, run: doc.run_id_utc, f180: doc.f180, points: doc.forecast_6_hourly?.length, runs: runs.length}));
            process.exit(1);
          }
          console.log(JSON.stringify({
            run_id_utc: doc.run_id_utc,
            forecast_points: doc.forecast_6_hourly.length,
            comparison_runs: runs.length,
            first_valid_time_utc: doc.forecast_6_hourly[0]?.valid_time_utc,
            last_valid_time_utc: doc.forecast_6_hourly.at(-1)?.valid_time_utc
          }));
          NODE
              then latest_ok=1; break; fi
            fi
            sleep 10
          done
          test "$latest_ok" -eq 1 || { echo "::error::Istanbul GFS API did not return a validated F180 forecast."; cat "$RUNNER_TEMP/istanbul-latest.json" 2>/dev/null || true; exit 1; }

          ecmwf_ok=0
          for attempt in $(seq 1 5); do
            if curl --silent --show-error --fail --max-time 45 "$ISTANBUL_GFS_API/ecmwf/latest?check=$(date +%s)" -o "$RUNNER_TEMP/ecmwf-latest.json"; then
              if node - "$RUNNER_TEMP/ecmwf-latest.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (doc.schema !== "gfs-watch.ecmwf-eps.v1" || doc.forecast_source !== "meteopt" ||
              doc.source_url !== "https://www.meteopt.com/modelos/ecmwf?lat=41.0901&lon=28.9436" ||
              !Array.isArray(doc.forecasts) || doc.forecasts.length < 8 ||
              !Array.isArray(doc.forecast_6_hourly) || doc.forecast_6_hourly.length < 8) {
            throw new Error("MeteoPT ECMWF live contract failed");
          }
          console.log(JSON.stringify({
            run_id_utc: doc.run_id_utc,
            forecast_points: doc.forecasts.length,
            horizon_hours: doc.forecast_horizon_hours,
            source: doc.forecast_source
          }));
          NODE
              then ecmwf_ok=1; break; fi
            fi
            sleep 8
          done
          test "$ecmwf_ok" -eq 1 || { echo "::error::MeteoPT ECMWF API did not return a validated live forecast."; cat "$RUNNER_TEMP/ecmwf-latest.json" 2>/dev/null || true; exit 1; }
