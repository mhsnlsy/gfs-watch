name: Backfill 850 hPa comparison data

on:
  push:
    branches: [main]
    paths:
      - "scripts/backfill_850hpa_comparison.py"
      - ".github/workflows/backfill-850hpa-comparison.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Serialize state-branch writes with the saved-data chart renderer. Both
# workflows update the same notification manifest and chart files.
concurrency:
  group: render-pages-charts-from-saved-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 0
      - name: Check out saved forecast history
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: state
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
      - name: Install Python dependencies
        working-directory: source
        run: python -m pip install -r requirements.txt
      - name: Restore compact decoded NOAA cache
        uses: actions/cache/restore@v6
        with:
          path: noaa_cache_v2
          key: gfs-noaa-850-decoded-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gfs-noaa-850-decoded-v1-
            gfs-noaa-cache-v4-
      - name: Backfill four historical cycles and rebuild comparison images
        working-directory: source
        env:
          DB_PATH: ${{ github.workspace }}/state/gfs_watch.db
          PUBLIC_DATA_DIR: ${{ github.workspace }}/state/public
          NOAA_CACHE_DIR: ${{ github.workspace }}/noaa_cache_v2
          NOAA_RANGE_DOWNLOAD_WORKERS: "8"
          GFS_WATCH_BACKFILL_RUN_IDS: "2026-10-31T12:00:00+00:00,2026-10-31T18:00:00+00:00,2026-11-01T00:00:00+00:00,2026-11-01T06:00:00+00:00"
        run: python -u scripts/backfill_850hpa_comparison.py
      - name: Save decoded NOAA cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: noaa_cache_v2
          key: gfs-noaa-850-decoded-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish repaired forecast history and comparison charts
        if: success()
        working-directory: state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage the full public snapshot, including latest.json which the
          # backfill restores to the actual current GFS cycle after writing old runs.
          # Leaving it unstaged makes the following pull --rebase fail with a dirty tree.
          git add -f gfs_watch.db public
          git status --short
          if git diff --cached --quiet; then
            echo 'No historical 850 hPa changes to publish.'
            exit 0
          fi
          git commit -m 'Backfill historical 850 hPa wind comparison data'
          if ! git diff --quiet; then
            echo 'Unexpected tracked changes remain after commit; staging and amending them.'
            git add -f gfs_watch.db public
            git commit --amend --no-edit
          fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin gfs-watch-state
            if git push origin HEAD:gfs-watch-state; then
              echo '850 hPa history and chart images published.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish repaired 850 hPa data.'
          exit 1

      - name: Deploy refreshed notification archive to Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Pages deployment queued for the refreshed notification archive."
