name: Manual 19:45 Tomorrow Weather Push

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-19-45-push.yml"
      - "manual-push-trigger.txt"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for push worker deployment
        run: sleep 120

      - name: Send tomorrow weather push
        env:
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PUSH_ADMIN_TOKEN"
          response="$(curl -sS -X POST             -H "Authorization: Bearer $PUSH_ADMIN_TOKEN"             -H "Content-Type: application/json"             https://gfs-watch-push.muhsin-ulusoy.workers.dev/admin/send-tomorrow-weather)"
          echo "$response"
          delivered="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("delivered", -1))')"
          test "$delivered" -gt 0
