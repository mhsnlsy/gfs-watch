name: Validate GFS Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate.yml"
      - ".github/workflows/publish-live-site.yml"
      - ".github/workflows/deploy-cloudflare-platform.yml"
      - ".github/workflows/deploy-istanbul-gfs-worker.yml"
      - ".github/workflows/deploy-gfs-guardian.yml"
      - "gfs-guardian/**"
      - "scripts/**"
      - "site/**"
      - "web-worker/**"
      - "istanbul-gfs-worker/**"
      - "koy-gfs-worker/**"
      - "station-worker/**"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile main.py scripts/fetch_istanbul_gfs_meteopt.py scripts/build_istanbul_gfs_publication.py scripts/send_canonical_istanbul_gfs_telegram.py scripts/fetch_ecmwf_eps.py scripts/test_ecmwf_eps.py scripts/test_ecmwf_ui.py scripts/test_notification_pipeline.py scripts/test_850hpa_history.py scripts/poll_istanbul_gfs_10min.py scripts/backfill_gfs_wind_direction.py scripts/test_gfs_wind_direction.py scripts/test_gfs_report_chart_theme.py
      - name: Run ECMWF offline and UI contract smoke tests
        run: |
          python scripts/test_ecmwf_eps.py
          python scripts/test_ecmwf_ui.py
          python scripts/test_notification_pipeline.py
          python scripts/test_850hpa_history.py
          python scripts/test_gfs_wind_direction.py
          python scripts/test_gfs_report_chart_theme.py
      - name: Install Istanbul GFS Worker image renderer for tests
        working-directory: istanbul-gfs-worker
        run: npm install --no-audit --no-fund --no-progress
      - name: Test ENKA and Eyüpsultan history graph switching
        run: node scripts/test_station_history_switch.mjs
      - name: Validate website JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("site/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.S)
          if not match:
              raise SystemExit("No inline website script found")
          Path("/tmp/site-script.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/site-script.js
          node --check site/koy.js
          node --check web-worker/src/index.js
          node --check istanbul-gfs-worker/src/index.js
          node --check istanbul-gfs-worker/src/publication.js
          node scripts/test_istanbul_worker_publication.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          for source, prefix in (
              ("site/index.html", "index"),
          ):
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
              inline = [script for script in scripts if script.strip()]
              if not inline:
                  raise SystemExit(f"No inline script found in {source}")
              for index, script in enumerate(inline):
                  Path(f"/tmp/{prefix}-inline-{index}.js").write_text(script, encoding="utf-8")
          PY
          for file in /tmp/index-inline-*.js; do
            node --check "$file"
          done