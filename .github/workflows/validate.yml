name: Validate GFS Watch

on:
  pull_request:
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile main.py
