name: Validate GFS Watch

on:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "scripts/**"
      - "requirements.txt"
      - "site/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/**"
      - "main.py"
      - "requirements.txt"
      - "site/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile main.py scripts/update_station_observation.py
      - name: Validate website JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("site/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.S)
          if not match:
              raise SystemExit("No inline website script found")
          Path("/tmp/site-script.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/site-script.js
      - name: Validate Web Push code and config
        run: |
          node --check push-worker/src/index.js
          node --check push-worker/send-notification.mjs
          python -m json.tool push-worker/wrangler.jsonc > /dev/null
          python -m json.tool push-worker/package.json > /dev/null
          python -m json.tool site/push-config.json > /dev/null
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("push-worker/migrations/0001_initial.sql").read_text())
          print("Web Push schema is valid.")
          PY
