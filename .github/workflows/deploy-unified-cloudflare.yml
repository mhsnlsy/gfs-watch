name: Deploy unified Cloudflare GFS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/istanbul-gfs/**"
      - "push-worker/**"
      - ".github/workflows/deploy-unified-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Prepare unified Worker
        working-directory: push-worker
        run: |
          cp src/index.js src/push-api.js
          cat > src/index.js <<'EOF'
          import gfs from "../../workers/istanbul-gfs/src/index.ts";
          import push from "./push-api.js";
          export default {
            scheduled(controller, env, ctx) { return gfs.scheduled(controller, env, ctx); },
            fetch(request, env, ctx) {
              const p = new URL(request.url).pathname;
              return (p === "/health" || p.startsWith("/gfs/"))
                ? gfs.fetch(request, env, ctx)
                : push.fetch(request, env, ctx);
            }
          };
          EOF
          cp wrangler.jsonc wrangler.unified.jsonc

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Bind GFS KV
        working-directory: push-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          wrangler kv namespace list > /tmp/kv.json
          python - <<'PY'
          import json,subprocess
          xs=json.load(open("/tmp/kv.json"))
          x=next((x for x in xs if x.get("title")=="gfs-watch-istanbul-gfs"),None)
          if not x:
              x=json.loads(subprocess.check_output(["wrangler","kv","namespace","create","GFS_KV","--json"],text=True)).get("result")
          open("/tmp/kv-id","w").write(x["id"])
          PY
          python - <<'PY'
          import json
          p="wrangler.unified.jsonc"
          s=open(p).read().replace('"d1_databases": [','"kv_namespaces": [{"binding":"GFS_KV","id":"'+open("/tmp/kv-id").read().strip()+'"}],\n  "d1_databases": [')
          open(p,"w").write(s)
          PY

      - name: Deploy
        working-directory: push-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.unified.jsonc

      - name: Configure GFS secrets
        working-directory: push-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$TELEGRAM_TOKEN" | wrangler secret put TELEGRAM_TOKEN --config wrangler.unified.jsonc
          printf '%s' "$TELEGRAM_CHAT_ID" | wrangler secret put TELEGRAM_CHAT_ID --config wrangler.unified.jsonc
