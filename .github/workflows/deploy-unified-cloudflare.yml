name: Deploy unified Cloudflare GFS
# Deploys the unified Worker whenever the GFS runtime changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/istanbul-gfs/**"
      - "push-worker/**"
      - ".github/workflows/deploy-unified-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Prepare unified Worker
        working-directory: push-worker
        run: |
          cp src/index.js src/push-api.js
          cat > src/index.js <<'EOF'
          import gfs from "../../workers/istanbul-gfs/src/index.ts";
          import push from "./push-api.js";
          export default {
            scheduled(controller, env, ctx) { return gfs.scheduled(controller, env, ctx); },
            fetch(request, env, ctx) {
              const p = new URL(request.url).pathname;
              return (p === "/health" || p.startsWith("/gfs/"))
                ? gfs.fetch(request, env, ctx)
                : push.fetch(request, env, ctx);
            }
          };
          EOF
          cp wrangler.jsonc wrangler.unified.jsonc
          python - <<'PY'
          import json
          p="wrangler.unified.jsonc"
          s=open(p).read()
          obj=json.loads(s)
          obj["compatibility_date"]="2026-11-06"
          obj["triggers"]={"crons":["*/5 * * * *"]}
          open(p,"w").write(json.dumps(obj,indent=2)+"\n")
          PY

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Bind GFS KV
        working-directory: push-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          base=f"https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces"
          headers={
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }

          def request(method, url, body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  raise RuntimeError(f"Cloudflare API {method} {url} failed: HTTP {e.code}: {raw}")

          data=request("GET", base)
          if not data.get("success"):
              raise RuntimeError("Cloudflare KV namespace list failed: "+json.dumps(data))

          target=next((x for x in data.get("result",[]) if x.get("title") in (
              "gfs-watch-push-GFS_KV",
              "gfs-watch-istanbul-gfs",
          )), None)

          if not target:
              created=request("POST", base, {"title":"gfs-watch-push-GFS_KV"})
              if not created.get("success"):
                  raise RuntimeError("Cloudflare KV namespace create failed: "+json.dumps(created))
              target={"id":created["result"]["id"]}

          open("/tmp/kv-id","w").write(target["id"])
          print("Using GFS KV namespace:", target["id"])
          PY

          python - <<'PY'
          p="wrangler.unified.jsonc"
          s=open(p).read()
          marker='"d1_databases": ['
          binding='"kv_namespaces": [{"binding":"GFS_KV","id":"'+open("/tmp/kv-id").read().strip()+'"}],\n  '
          if marker not in s:
              raise RuntimeError("d1_databases marker not found in unified Wrangler config")
          s=s.replace(marker,binding+marker,1)
          open(p,"w").write(s)
          PY

      - name: Deploy
        working-directory: push-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.unified.jsonc

      - name: Configure GFS secrets
        working-directory: push-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
        run: |
          printf '%s' "$TELEGRAM_TOKEN" | wrangler secret put TELEGRAM_TOKEN --config wrangler.unified.jsonc
          printf '%s' "$TELEGRAM_CHAT_ID" | wrangler secret put TELEGRAM_CHAT_ID --config wrangler.unified.jsonc
