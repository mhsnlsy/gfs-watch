name: Station Data Watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/station-data-watchdog.yml"
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: station-data-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check station freshness and recover stale workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          check_station() {
            local name="$1"
            local branch="$2"
            local file="$3"
            local workflow="$4"
            local key="${5:-sisli}"

            echo "=== $name ==="

            json="$(curl -fsSL "https://raw.githubusercontent.com/$REPO/$branch/$file")"
            age="$(printf '%s' "$json" | jq -r '.station_observation.age_minutes // 9999')"
            stale="$(printf '%s' "$json" | jq -r '.station_observation.is_stale // false')"

            status="active"
            recovery=false

            if ! awk "BEGIN { exit !($age < 10) }" || [ "$stale" = "true" ]; then
              status="recovery"
              recovery=true
              echo "$name is older than 10 minutes or marked stale. Checking active workflow runs..."

              active="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=main&per_page=10" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"

              if [ "$active" -gt 0 ]; then
                echo "$name already has an active recovery/run; no duplicate dispatch."
              else
                echo "Dispatching recovery run for $name..."
                gh workflow run "$workflow" --repo "$REPO" --ref main
                echo "$name recovery dispatched."
              fi
            else
              echo "$name is healthy."
            fi

            checked_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            payload="$(jq -cn --arg station "$name" --arg checked "$checked_at" --arg status "$status" --argjson age "$age" --argjson recovery "$recovery" '{schema:"gfs-watch.station-health.v1",station:$station,checked_at_utc:$checked,data_age_minutes:$age,status:$status,recovery_triggered:$recovery}')"
            encoded="$(printf '%s' "$payload" | base64 -w 0)"
            target="site/data/station-health-$key.json"
            branch="main"
            current_sha="$(gh api "repos/$REPO/contents/$target?ref=$branch" --jq '.sha' 2>/dev/null || true)"

            if [ -n "$current_sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$target" -f message="Update $name watchdog health" -f content="$encoded" -f branch="$branch" -f sha="$current_sha" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$target" -f message="Add $name watchdog health" -f content="$encoded" -f branch="$branch" >/dev/null
            fi
            echo "$name health published to $branch/$target."
          }

          check_station "ENKA Balmumcu" "enka-state" "public/station-observation.json" "enka-station-refresh.yml" "enka"
          check_station "Eyüpsultan" "eyupsultan-state" "public/eyupsultan-station-observation.json" "eyupsultan-station-refresh.yml" "eyupsultan"
          check_station "Şişli" "sisli-state" "public/sisli-station-observation.json" "sisli-station-refresh.yml"
