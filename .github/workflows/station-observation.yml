name: Station Observation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: station-observation
  cancel-in-progress: false

jobs:
  refresh-station:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          ref: main
          path: source

      - name: Check out published forecast data
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: forecast-data

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install station client
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch latest MGM observation
        run: python source/scripts/update_station_observation.py forecast-data/public/latest.json

      - name: Publish changed station observation
        working-directory: forecast-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/latest.json
          if git diff --cached --quiet; then
            echo "No new station observation to publish."
          else
            git commit -m "Refresh Eyupsultan station observation"
            git push origin HEAD:gfs-watch-state
          fi
