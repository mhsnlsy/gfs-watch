name: Build Istanbul Havasi Widget v2
on:
  push:
    paths:
      - 'android-widget/**'
      - '.github/workflows/build-android-widget-v2.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: istanbul-havasi-widget-v0.2.0
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
