name: ENKA Weather

on:
  schedule:
    # GitHub Actions cron is UTC; every five minutes, around the clock.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: enka-weather-refresh
  cancel-in-progress: true

jobs:
  refresh-enka:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Check out published data
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: forecast-data
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lightweight dependency
        run: python -m pip install requests
      - name: Fetch ENKA Balmumcu observation
        run: |
          mkdir -p public
          python -u enka_weather.py
        env:
          PYTHONPATH: .
      - name: Publish fresh station observation
        run: |
          cp public/station-observation.json forecast-data/public/station-observation.json
          cd forecast-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/station-observation.json
          if git diff --cached --quiet; then
            echo "ENKA observation has not changed."
            exit 0
          fi
          git commit -m "Refresh ENKA Balmumcu observation"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin gfs-watch-state
            if git push origin gfs-watch-state; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish ENKA observation after five attempts."
          exit 1
      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
