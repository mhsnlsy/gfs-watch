name: MeteoPT GFS Monitor Backup Trigger

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ensure-primary-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the primary monitor ran recently
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone, timedelta

          data = subprocess.check_output([
              "gh", "api", "--method", "GET",
              "repos/${{ github.repository }}/actions/workflows/meteopt-gfs-monitor.yml/runs",
              "-f", "per_page=10",
          ], text=True)

          runs = json.loads(data).get("workflow_runs", [])
          now = datetime.now(timezone.utc)
          recent = False

          for run in runs:
              created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              age = now - created
              status = run.get("status", "")
              # Only an active run suppresses the backup dispatch. A recently
              # completed run must not prevent the next 10-minute scan.
              if status in {"queued", "in_progress", "waiting", "pending"} and age <= timedelta(minutes=12):
                  recent = True
                  print(f"Primary monitor is active: {run['id']} ({status})")
                  break

          if recent:
              print("Primary monitor is active/recent; backup dispatch is not needed.")
              with open(os.environ["GITHUB_OUTPUT"], "w") as f:
                  f.write("dispatch=false\n")
          else:
              print("No recent primary monitor run found; backup dispatch is required.")
              with open(os.environ["GITHUB_OUTPUT"], "w") as f:
                  f.write("dispatch=true\n")
          PY

      - name: Dispatch primary monitor
        if: steps.check.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/405215968/dispatches"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.json" --write-out "%{http_code}" \
            --request POST "$url" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}')"
          if [ "$status" != "204" ]; then
            echo "Primary monitor dispatch failed with HTTP $status."
            cat "$RUNNER_TEMP/dispatch-response.json"
            exit 1
          fi
          echo "Primary MeteoPT monitor successfully dispatched."
