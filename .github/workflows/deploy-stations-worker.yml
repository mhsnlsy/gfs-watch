name: Deploy Cloudflare Station Service

on:
  push:
    branches: [main]
    paths:
      - "station-worker/**"
      - ".github/workflows/deploy-stations-worker.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-station-service-deploy-v2
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker + D1 and verify live collection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Create or locate the production D1 database
        working-directory: station-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"

          find_db_id() {
            node - "$RUNNER_TEMP/d1-list.json" <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          function walk(value) {
            if (!value) return null;
            if (Array.isArray(value)) {
              for (const item of value) { const found = walk(item); if (found) return found; }
              return null;
            }
            if (typeof value !== "object") return null;
            const name = value.name || value.database_name || value.databaseName;
            const id = value.uuid || value.database_id || value.databaseId;
            if (name === "gfs-watch-stations" && id) return String(id);
            for (const child of Object.values(value)) { const found = walk(child); if (found) return found; }
            return null;
          }
          const id = walk(data);
          if (id) process.stdout.write(id);
          NODE
          }

          D1_ID="$(find_db_id)"
          if [ -z "$D1_ID" ]; then
            echo "Creating production D1 database in Eastern Europe..."
            wrangler d1 create gfs-watch-stations --location eeur
            wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
            D1_ID="$(find_db_id)"
          fi

          test -n "$D1_ID" || { echo "::error::Could not resolve gfs-watch-stations D1 database ID"; exit 1; }
          echo "Using D1 database ID: $D1_ID"

          node - "$D1_ID" wrangler.jsonc <<'NODE'
          const fs = require("fs");
          const id = process.argv[2];
          const file = process.argv[3];
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          const binding = (config.d1_databases || []).find(item => item.database_name === "gfs-watch-stations");
          if (!binding) throw new Error("STATIONS_DB binding missing in wrangler config");
          binding.database_id = id;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Apply production D1 migrations
        working-directory: station-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply gfs-watch-stations --remote --config wrangler.jsonc

      - name: Install station worker JPEG decoder
        working-directory: station-worker
        run: npm install --no-audit --no-fund --no-progress

      - name: Deploy the two-minute-cron Worker
        working-directory: station-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Bootstrap collection and verify live station data + D1 history
        env:
          STATIONS_API: https://gfs-watch-stations.muhsin-ulusoy.workers.dev/api
        run: |
          set -euo pipefail
          baseline="$(date -u +%s)"
          echo "Waiting briefly for the new Worker version to reach the API edge..."
          collection_ok=0
          for attempt in $(seq 1 5); do
            echo "Station bootstrap attempt $attempt/5..."
            if curl --silent --show-error --max-time 150 \
              "$STATIONS_API/collect?bootstrap=$(date +%s)" \
              -o "$RUNNER_TEMP/station-collection.json"; then
              if node - "$RUNNER_TEMP/station-collection.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          // MGM stations must be live. ENKA (WeatherLink) is a third-party feed that can
          // be offline for hours; it only has to be collected without error, so its
          // outage never blocks deploying the Çanakçı/Köy history pipeline.
          const required = ["eyupsultan", "sisli", "canakci"];
          const results = doc.results || {};
          const failures = required.filter(key => !results[key] || results[key].ok !== true || results[key].status !== "live");
          if (!results.enka || results.enka.ok !== true) failures.push("enka");
          if (results.enka && results.enka.status !== "live") console.warn("::warning::ENKA feed is " + results.enka.status + " (not blocking)");
          if (doc.ok !== true || failures.length) {
            console.error("Station bootstrap attempt failed:", JSON.stringify({
              failed_stations: failures,
              results
            }, null, 2));
            process.exit(1);
          }
          for (const key of required) {
            const result = results[key];
            console.log(key + ": live · " + result.duration_ms + " ms · " + (result.observed_at_utc || "timestamp unavailable"));
          }
          NODE
              then
                collection_ok=1
                break
              fi
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Worker rollout or upstream collection not ready; retrying in 15 seconds."
              sleep 15
            fi
          done
          if [ "$collection_ok" -ne 1 ]; then
            echo "::error::Station bootstrap collection failed after five attempts."
            [ -s "$RUNNER_TEMP/station-collection.json" ] && cat "$RUNNER_TEMP/station-collection.json" || true
            exit 1
          fi

          curl --silent --show-error --fail --max-time 12 "$STATIONS_API/health?check=$(date +%s)" -o "$RUNNER_TEMP/station-health.json"
          node - "$RUNNER_TEMP/station-health.json" "$baseline" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const baseline = Number(process.argv[3]) * 1000;
          const required = ["enka", "eyupsultan", "sisli", "canakci"];
          const rows = doc.stations || [];
          const failures = required.filter(key => {
            const row = rows.find(item => item.key === key);
            const success = Date.parse(row && row.last_success_utc || "");
            const attempt = Date.parse(row && row.last_attempt_utc || "");
            const mustBeLive = key !== "enka";
            return !row || row.collection_status !== "ok" || (mustBeLive && row.status !== "live") ||
              !Number.isFinite(success) || success < baseline - 5000 ||
              !Number.isFinite(attempt) || attempt < baseline - 5000 ||
              Boolean(row.last_error);
          });
          if (doc.ok !== true || doc.storage !== "D1" || failures.length) {
            console.error("D1 station health verification failed:", JSON.stringify(doc, null, 2));
            throw new Error("Stations not freshly collected and persisted: " + failures.join(", "));
          }
          console.log("Verified four fresh station readings and cleared collection diagnostics in D1.");
          NODE

          for key in enka eyupsultan sisli canakci; do
            curl --silent --show-error --fail --max-time 12 "$STATIONS_API/history/$key?hours=72" -o "$RUNNER_TEMP/history-$key.json"
            node - "$RUNNER_TEMP/history-$key.json" "$key" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (doc.ok !== true || !Array.isArray(doc.samples) || doc.samples.length < 1) {
            throw new Error("D1 72-hour history missing for " + process.argv[3]);
          }
          console.log(process.argv[3] + ": " + doc.count + " archived samples");
          NODE
          done

          cat "$RUNNER_TEMP/station-health.json"

      - name: Verify the Köy History graph API
        env:
          STATIONS_API: https://gfs-watch-stations.muhsin-ulusoy.workers.dev/api
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 3 --retry-all-errors --retry-delay 2 --max-time 25 \
            "$STATIONS_API/history-graph/canakci?hours=24&bucket=10&verify=$(date +%s)" \
            -o "$RUNNER_TEMP/canakci-history-graph.json"
          node - "$RUNNER_TEMP/canakci-history-graph.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const samples = Array.isArray(doc.samples) ? doc.samples : [];
          const latest = samples[samples.length - 1];
          const fields = ["temperature_c", "dew_point_c", "humidity_percent", "pressure_hpa",
            "wind_speed_kmh", "wind_direction", "rain_1h_mm", "rain_10m_mm",
            "rain_6h_mm", "rain_12h_mm", "rain_24h_mm", "rain_00_now_mm",
            "wind_chill_c", "heat_index_c", "latest_fetched_at_utc"];
          if (doc.ok !== true || doc.station_key !== "canakci" || samples.length < 1 ||
              !latest || fields.some(key => !Object.prototype.hasOwnProperty.call(latest, key)) ||
              !Number.isFinite(Date.parse(latest.latest_fetched_at_utc)) ||
              Number(latest.sample_count) < 1) {
            throw new Error("Live Köy History graph API contract failed: " + JSON.stringify({
              ok: doc.ok, station_key: doc.station_key, sample_count: samples.length, latest
            }));
          }
          console.log("Verified live Köy History graph API:", JSON.stringify({
            station: doc.station_key,
            samples: samples.length,
            bucket_minutes: doc.bucket_minutes,
            latest_fetched_at_utc: latest.latest_fetched_at_utc
          }));
          NODE

      - name: Verify the live Çanakçı monthly observation summary
        env:
          STATIONS_API: https://gfs-watch-stations.muhsin-ulusoy.workers.dev/api
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 3 --max-time 35 \
            "$STATIONS_API/climate/month/canakci?verify=$(date +%s)" \
            -o "$RUNNER_TEMP/canakci-month.json"
          node - "$RUNNER_TEMP/canakci-month.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const numeric = value => value !== null && value !== undefined && Number.isFinite(Number(value));
          if (doc.ok !== true || doc.schema !== "koy-station-month.v1") {
            throw new Error("Çanakçı monthly endpoint contract failed: " + JSON.stringify(doc));
          }
          if (doc.station?.key !== "canakci" || String(doc.station?.station_id || "") !== "18223") {
            throw new Error("The monthly endpoint is not serving WStatMap Çanakçı station 18223: " +
              JSON.stringify(doc.station));
          }
          if (!numeric(doc.month?.avg_temp_c) || !numeric(doc.month?.high_c) ||
              !numeric(doc.month?.low_c) || Number(doc.month.low_c) > Number(doc.month.avg_temp_c) ||
              Number(doc.month.avg_temp_c) > Number(doc.month.high_c)) {
            throw new Error("Çanakçı monthly temperature statistics are missing or inconsistent: " +
              JSON.stringify(doc.month));
          }
          if (Number(doc.month?.days_with_temperature || 0) < 1 ||
              Number(doc.month?.sample_count || 0) < 1 ||
              !Array.isArray(doc.daily) || !doc.daily.length) {
            throw new Error("Çanakçı monthly D1 observation history is empty");
          }
          if (doc.month.precipitation_mm !== null && !numeric(doc.month.precipitation_mm)) {
            throw new Error("Monthly precipitation must be numeric or null, never a fabricated zero");
          }
          console.log(JSON.stringify({
            station: doc.station,
            period_date: doc.period_date,
            month: doc.month,
            today: doc.today,
            coverage: doc.coverage,
            current_status: doc.current?.status || "no-current-reading",
            quality_control: doc.quality_control
          }));
          NODE

      - name: Retire the old GitHub Actions station collectors
        if: success()
        run: |
          set -euo pipefail
          if [ -f ".github/workflows/istanbul-mgm-independent.yml" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm ".github/workflows/istanbul-mgm-independent.yml"
            git commit -m "Retire GitHub Actions station collectors after Cloudflare cutover"
            git push origin HEAD:main
          else
            echo "GitHub Actions station collectors are already retired."
          fi
