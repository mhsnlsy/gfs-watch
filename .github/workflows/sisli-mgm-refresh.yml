name: Şişli MGM Independent Refresh

on:
  # Each collector re-arms its next five-minute run through workflow_dispatch.
  workflow_dispatch:
  push:
    branches: [main]
    # Wake on ordinary main-branch changes like Köy MGM, but never on station-output commits.
    paths-ignore:
      - "site/data/station-observation.json"
      - "site/data/station-temperature-history.json"
      - "site/data/eyupsultan-station-observation.json"
      - "site/data/eyupsultan-station-temperature-history.json"
      - "site/data/eyupsultan-station-rain-history.json"
      - "site/data/sisli-station-observation.json"
      - "site/data/sisli-station-temperature-history.json"
      - "site/data/sisli-station-rain-history.json"

permissions:
  actions: write
  contents: write

concurrency:
  group: sisli-mgm-independent
  cancel-in-progress: false

jobs:
  cycle-start:
    name: Stamp this independent five-minute cycle
    runs-on: ubuntu-latest
    outputs:
      started_epoch: ${{ steps.stamp.outputs.started_epoch }}
    steps:
      - name: Record cycle start time
        id: stamp
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  collect-and-publish:
    needs: cycle-start
    name: Fetch MGM Şişli and publish its own archive
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Şişli-only workspace and restore its archive
        run: |
          set -euo pipefail
          mkdir -p public site/data .station-work/sisli
          for f in sisli-station-temperature-history.json sisli-station-rain-history.json; do
            if [ -s "site/data/$f" ]; then
              cp "site/data/$f" ".station-work/sisli/$f"
            fi
          done

      - name: Fetch current MGM Şişli observation and update 72-hour archive
        env:
          SISLI_TEMPERATURE_HISTORY_PATH: .station-work/sisli/sisli-station-temperature-history.json
          SISLI_RAIN_HISTORY_PATH: .station-work/sisli/sisli-station-rain-history.json
        run: |
          set -euo pipefail
          node scripts/sisli_weather.mjs
          test -s public/sisli-station-observation.json
          test -s .station-work/sisli/sisli-station-temperature-history.json
          test -s .station-work/sisli/sisli-station-rain-history.json

      - name: Validate fresh observation and prevent timestamp regression
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          new_doc = json.loads(Path("public/sisli-station-observation.json").read_text(encoding="utf-8"))
          new = new_doc.get("station_observation") or {}
          age = float(new.get("age_minutes", 9999))
          if new.get("temperature_2m_c") is None or new.get("is_stale") or age > 20:
              raise SystemExit(f"MGM Şişli observation is missing or stale: age={age} min")
          if str(new.get("station_id")) != "18401":
              raise SystemExit(f"Unexpected MGM station id: {new.get('station_id')}")
          observed = new.get("observed_at_utc")
          if not observed:
              raise SystemExit("MGM observation timestamp is missing")

          previous_path = Path("site/data/sisli-station-observation.json")
          if previous_path.is_file():
              previous_doc = json.loads(previous_path.read_text(encoding="utf-8"))
              previous = previous_doc.get("station_observation") or {}
              previous_time = previous.get("observed_at_utc")
              if previous_time:
                  old_dt = datetime.fromisoformat(previous_time.replace("Z", "+00:00"))
                  new_dt = datetime.fromisoformat(observed.replace("Z", "+00:00"))
                  if new_dt < old_dt:
                      raise SystemExit(
                          f"MGM timestamp regressed: new={observed}, published={previous_time}"
                      )

          print(
              "Şişli verified:",
              new.get("temperature_2m_c"), "°C |",
              new.get("observed_at_utc"), "| age", age, "min |",
              "source", new.get("source_url")
          )
          PY

      - name: Publish only Şişli station files to main
        run: |
          set -euo pipefail
          cp public/sisli-station-observation.json site/data/sisli-station-observation.json
          cp .station-work/sisli/sisli-station-temperature-history.json site/data/sisli-station-temperature-history.json
          cp .station-work/sisli/sisli-station-rain-history.json site/data/sisli-station-rain-history.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/sisli-station-observation.json site/data/sisli-station-temperature-history.json site/data/sisli-station-rain-history.json

          if git diff --cached --quiet; then
            echo "Şişli data has not changed; no commit is required."
            exit 0
          fi

          git commit -m "Update independent MGM Şişli observations"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Şişli observation and archives published."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish Şişli data to main after five attempts."
          exit 1

  deploy-live-site:
    name: Deploy refreshed station data to GitHub Pages
    needs: collect-and-publish
    uses: ./.github/workflows/pages-live.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  rearm-next-cycle:
    name: Queue next Şişli cycle
    needs: [cycle-start, collect-and-publish]
    if: ${{ always() && needs.cycle-start.result == 'success' && needs['collect-and-publish'].result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait until the next five-minute interval
        env:
          CYCLE_STARTED_EPOCH: ${{ needs.cycle-start.outputs.started_epoch }}
        run: |
          set -euo pipefail
          now="$(date +%s)"
          elapsed=$((now - CYCLE_STARTED_EPOCH))
          wait_seconds=$((300 - elapsed))
          if [ "$wait_seconds" -gt 0 ]; then
            echo "Waiting ${wait_seconds}s to maintain a five-minute cadence."
            sleep "$wait_seconds"
          else
            echo "Collection took five minutes or longer; rearming immediately."
          fi

      - name: Dispatch the next Şişli cycle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/408243875/dispatches"
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.json" --write-out "%{http_code}" \
              --request POST "$url" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data '{"ref":"main"}')"
            if [ "$status" = "204" ]; then
              echo "Next Şişli cycle successfully queued."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed with HTTP $status."
            cat "$RUNNER_TEMP/dispatch-response.json"
            sleep 5
          done
          echo "Could not queue the next Şişli cycle."
          exit 1
