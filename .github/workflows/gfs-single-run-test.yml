name: GFS Single-Run Integration Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gfs-single-run-test.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify exact archived run and +180 hour calculation
        run: |
          python - <<'PY'
          import main

          run_id = "2026-10-31T00:00:00+00:00"
          payload = main.fetch_full_weather_data(run_id)
          assert payload is not None, "Single Runs API returned no forecast payload"
          assert "_pending_single_run" not in payload, "Archived run unexpectedly pending"
          assert payload["forecast_horizon_hours"] == 180, (
              f"Expected exactly 180 hours, got {payload.get('forecast_horizon_hours')}"
          )
          assert len(payload["timeline_180h"]) == 31, (
              f"Expected 31 six-hour timeline points, got {len(payload['timeline_180h'])}"
          )
          print("RUN:", run_id)
          print("FORECAST HORIZON:", payload["forecast_horizon_hours"])
          print("TIMELINE POINTS:", len(payload["timeline_180h"]))
          print("SINGLE-RUN INTEGRATION TEST PASSED")
          PY
