name: GFS Single-Run Integration Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gfs-single-run-test.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Isolate Single Runs API parameters
        run: |
          python - <<'PY'
          import requests

          base = {
              "latitude": 41.014,
              "longitude": 28.950,
              "run": "2026-10-31T00:00",
              "models": "ncep_gfs_global",
              "forecast_hours": 181,
              "timezone": "Europe/Istanbul",
          }
          variants = {
              "hourly_only": {"hourly": "temperature_2m,precipitation,snowfall,surface_pressure,wind_speed_10m"},
              "daily_only": {"daily": "temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max"},
              "current_only": {"current": "temperature_2m,precipitation,rain,snowfall,wind_speed_10m,surface_pressure"},
              "full": {
                  "current": "temperature_2m,precipitation,rain,snowfall,wind_speed_10m,surface_pressure",
                  "daily": "temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max",
                  "hourly": "temperature_2m,precipitation,snowfall,surface_pressure,wind_speed_10m",
              },
          }
          for name, extra in variants.items():
              params = {**base, **extra}
              response = requests.get(
                  "https://single-runs-api.open-meteo.com/v1/forecast",
                  params=params,
                  timeout=30,
              )
              print("\nVARIANT:", name, "STATUS:", response.status_code)
              if response.status_code != 200:
                  print("ERROR BODY:", response.text[:2000])
                  continue
              data = response.json()
              times = data.get("hourly", {}).get("time", [])
              print("hourly rows:", len(times), "first:", times[0] if times else "-", "last:", times[-1] if times else "-")
          PY
