name: Radar Monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install requests pillow numpy

      - name: Run radar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RADAR_STATE_PATH: ${{ github.workspace }}/radar_state.json
          RADAR_ALERT_STATE_PATH: ${{ github.workspace }}/radar_alert_state.json
        run: python radar_monitor.py

      - name: Persist Telegram cooldown state
        if: success()
        run: |
          if [ -f radar_alert_state.json ]; then
            git add radar_alert_state.json
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Update radar Telegram cooldown state"
              git push
            fi
          fi
