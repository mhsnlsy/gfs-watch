name: Radar Monitor (legacy manual)

# Scheduled runs have moved to radar-monitor-10m.yml.
# Keep manual dispatch available for one-off diagnostics.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-monitor-10m
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow numpy

      - name: Run one-off radar check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RADAR_STATE_PATH: ${{ github.workspace }}/radar_state.json
          RADAR_ALERT_STATE_PATH: ${{ github.workspace }}/radar_alert_state.json
        run: python -u radar_monitor.py
