name: GFS NOAA Integration Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gfs-noaa-integration-test.yml"

jobs:
  test-noaa-gfs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out application
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ecCodes system library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve and validate exact 06Z GFS forecast from NOAA
        run: |
          python - <<'PY'
          import json
          import main

          run_id = "2026-10-31T06:00:00+00:00"
          payload = main.fetch_full_weather_data(run_id)
          if not payload or "_pending_noaa_gfs" in payload:
              raise RuntimeError(f"NOAA 06Z run not ready or failed: {payload}")

          assert payload["forecast_horizon_hours"] == 180
          assert len(payload["timeline_180h"]) == 31, len(payload["timeline_180h"])
          assert len(payload["daily"]["time"]) >= 8
          assert payload["data_source"].startswith("NOAA/NCEP")
          assert payload["current"]["temp"] > -50
          assert payload["current"]["temp"] < 60

          print("[NOAA INTEGRATION TEST PASSED]")
          print(json.dumps({
              "run": run_id,
              "forecast_horizon_hours": payload["forecast_horizon_hours"],
              "timeline_points": len(payload["timeline_180h"]),
              "daily_buckets": len(payload["daily"]["time"]),
              "current": payload["current"],
              "first_timeline_point": next(iter(payload["timeline_180h"].items())),
              "last_timeline_point": list(payload["timeline_180h"].items())[-1],
              "daily": payload["daily"],
              "synoptic_alerts": payload["synoptic_alerts"],
              "data_source": payload["data_source"],
          }, ensure_ascii=False, indent=2))
          PY
