name: İstanbul GFS Independent

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/istanbul-gfs-independent.yml"
      - "scripts/build_istanbul_gfs_publication.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: istanbul-gfs-independent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out application source
        uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 1

      - name: Check out Istanbul GFS state
        uses: actions/checkout@v7
        with:
          ref: istanbul-gfs-data
          path: state
          fetch-depth: 1

      - name: Poll MeteoPT and prepare Istanbul GFS
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/istanbul-gfs"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from pathlib import Path

          now = datetime.now(timezone.utc)
          candidates = []
          for requested_hour in (18, 12, 6, 0):
              params = {"lat":"41.014","lon":"28.950","run":f"{requested_hour:02d}","lang":"en"}
              url = "https://api.meteopt.com/gfs/json?" + urlencode(params)
              req = Request(url, headers={"User-Agent":"Istanbul-GFS/1.0","Cache-Control":"no-cache"})
              try:
                  with urlopen(req, timeout=40) as response:
                      doc = json.load(response)
                  api_run = str(doc.get("run") or "").strip()
                  if api_run:
                      candidates.append((api_run, doc, url))
                      print(f"MeteoPT run={requested_hour:02d} -> {api_run}")
              except Exception as exc:
                  print(f"MeteoPT run={requested_hour:02d} unavailable: {exc}")

          if not candidates:
              raise SystemExit("MeteoPT returned no usable Istanbul GFS cycle")

          def run_key(value):
              digits = "".join(ch for ch in value if ch.isdigit())
              return digits[:10] if len(digits) >= 10 else digits

          candidates.sort(key=lambda item: run_key(item[0]), reverse=True)
          api_run, doc, source_url = candidates[0]
          parsed = run_key(api_run)
          if len(parsed) != 10:
              raise SystemExit(f"Unexpected MeteoPT run value: {api_run}")

          cycle = datetime.strptime(parsed, "%Y%m%d%H").replace(tzinfo=timezone.utc)
          run_iso = cycle.isoformat(timespec="seconds")

          steps = []
          for value in (doc.get("steps") or {}).get("values") or []:
              try: steps.append(int(value))
              except (TypeError, ValueError): pass
          if not steps:
              raise SystemExit("MeteoPT returned no forecast steps")

          data = doc.get("data") or {}
          def series(name): return ((data.get(name) or {}).get("values") or [])
          def num(values, index):
              try:
                  value = float(values[index])
                  return value if value == value and abs(value) != float("inf") else None
              except (IndexError, TypeError, ValueError):
                  return None

          points = []
          for index, lead in enumerate(steps):
              if lead <= 0: continue
              valid = cycle + timedelta(hours=lead)
              points.append({
                  "forecast_hour": lead,
                  "valid_time_utc": valid.isoformat(timespec="minutes"),
                  "valid_time_istanbul": valid.astimezone(timezone(timedelta(hours=3))).isoformat(timespec="minutes"),
                  "temperature_2m_c": num(series("tmp2m"), index),
                  "temperature_850hpa_c": num(series("tmp850mb"), index),
                  "wind_speed_10m_kmh": num(series("wind10m"), index),
                  "wind_direction_10m_deg": num(series("winddir10m"), index),
                  "wind_speed_850hpa_kmh": num(series("wind850"), index),
                  "precipitation_6h_mm": num(series("apcp"), index),
              })

          days = {}
          for point in points:
              day = point["valid_time_istanbul"][:10]
              days.setdefault(day, []).append(point)
          daily = []
          for day, vals in sorted(days.items()):
              def nums(key): return [p[key] for p in vals if p.get(key) is not None]
              t2,t850=nums("temperature_2m_c"),nums("temperature_850hpa_c")
              rain,w10,w850=nums("precipitation_6h_mm"),nums("wind_speed_10m_kmh"),nums("wind_speed_850hpa_kmh")
              daily.append({
                  "date_istanbul":day,
                  "temperature_min_c":min(t2) if t2 else None,
                  "temperature_max_c":max(t2) if t2 else None,
                  "temperature_850hpa_min_c":min(t850) if t850 else None,
                  "temperature_850hpa_max_c":max(t850) if t850 else None,
                  "precipitation_total_mm":sum(max(0.0,x) for x in rain),
                  "wind_speed_max_10m_kmh":max(w10) if w10 else None,
                  "wind_speed_max_850hpa_kmh":max(w850) if w850 else None,
              })

          first = points[0] if points else {}
          latest={
              "model":"ncep_gfs_global",
              "forecast_source":"meteopt",
              "run_id_utc":run_iso,
              "location":{"name":"Istanbul","latitude":41.014,"longitude":28.950,"nearest_gfs_grid_latitude":41.0,"nearest_gfs_grid_longitude":29.0},
              "sources":{"forecast":"MeteoPT GFS 3 saatlik nokta (Istanbul, TR); hedef 41.014N, 28.950E"},
              "noaa_source_file":{"f180_available":180 in steps,"f180_source_name":"MeteoPT","f180_source_url":source_url,"global_grib2_size_bytes":None},
              "current_conditions":{"temperature_2m_c":first.get("temperature_2m_c"),"precipitation_mm":first.get("precipitation_6h_mm"),"wind_speed_10m_kmh":first.get("wind_speed_10m_kmh"),"mean_sea_level_pressure_hpa":None},
              "daily_summary":daily,
              "regional_pressure_analysis":{"valid_time_utc":run_iso,"diameter_km":2500.0,"findings":[]},
              "forecast_6_hourly":points,
              "published_at_utc":now.isoformat(timespec="seconds"),
              "forecast_valid_until_utc":points[-1]["valid_time_utc"] if points else None,
              "forecast_horizon_hours":max((p["forecast_hour"] for p in points),default=0),
              "schema":"gfs-watch.forecast.v1",
          }
          root=Path(os.environ["RUNNER_TEMP"])/"istanbul-gfs"
          (root/"latest.json").write_text(json.dumps(latest,ensure_ascii=False,indent=2),encoding="utf-8")
          (root/"f72.json").write_text(json.dumps({**latest,"schema":"istanbul-gfs.first72.v1","forecast_6_hourly":[p for p in points if 0<p["forecast_hour"]<=72]},ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"Istanbul GFS cycle {run_iso}; max forecast hour {max(steps)}; points {len(points)}")
          PY

      - name: Publish one canonical GFS bundle
        run: |
          set -euo pipefail
          mkdir -p state/gfs/f72 state/gfs/runs
          new_run="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_id_utc"])' "$RUNNER_TEMP/istanbul-gfs/latest.json")"
          old_run=""
          if [ -s state/gfs/latest.json ]; then
            old_run="$(python -c 'import json; print(json.load(open("state/gfs/latest.json")).get("run_id_utc",""))')"
          fi

          if [ "$new_run" = "$old_run" ]; then
            run_count="$(find state/gfs/runs -type f -name '*.json' | wc -l | tr -d ' ')"
            if [ "$run_count" -ge 4 ]; then
              echo "Istanbul GFS cycle $new_run already published; history complete; no rebuild needed."
              exit 0
            fi
            echo "Current cycle already exists but four-cycle history is incomplete; rebuilding publication bundle."
          else
            cp "$RUNNER_TEMP/istanbul-gfs/latest.json" state/gfs/latest.json
            cp "$RUNNER_TEMP/istanbul-gfs/f72.json" state/gfs/f72/latest.json
            cp "$RUNNER_TEMP/istanbul-gfs/latest.json" "state/gfs/runs/$new_run.json"
          fi

          # One-time migration: seed missing historical MeteoPT cycles from the
          # existing MeteoPT archive so the new canonical branch can immediately
          # build the four-cycle comparison. No new weather source is introduced.
          git -C state fetch origin gfs-watch-state --depth=1
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          runs_dir = Path("state/gfs/runs")
          existing = set()
          for path in runs_dir.glob("*.json"):
              try:
                  existing.add(json.loads(path.read_text(encoding="utf-8")).get("run_id_utc"))
              except Exception:
                  pass

          files = subprocess.check_output(
              ["git", "-C", "state", "ls-tree", "-r", "--name-only",
               "origin/gfs-watch-state", "public/runs"],
              text=True,
          ).splitlines()
          files = sorted(files, reverse=True)

          for source_path in files:
              if len(existing) >= 4:
                  break
              try:
                  raw = subprocess.check_output(
                      ["git", "-C", "state", "show", f"origin/gfs-watch-state:{source_path}"]
                  )
                  doc = json.loads(raw)
                  run_id = doc.get("run_id_utc")
                  if not run_id or run_id in existing:
                      continue
                  target = runs_dir / f"{run_id}.json"
                  target.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  existing.add(run_id)
                  print(f"Seeded historical MeteoPT cycle: {run_id}")
              except Exception as exc:
                  print(f"Historical cycle skipped: {source_path}: {exc}")

          print(f"Canonical Istanbul GFS history now contains {len(existing)} cycles.")
          PY

          find state/gfs/runs -type f -name '*.json' -mtime +45 -delete

          python -m pip install -r source/requirements.txt
          GFS_SOURCE_ROOT="$GITHUB_WORKSPACE/source" python source/scripts/build_istanbul_gfs_publication.py

          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfs
          if git diff --cached --quiet; then
            echo "Canonical GFS bundle produced no file changes."
            exit 0
          fi
          git commit -m "Publish Istanbul GFS bundle $new_run"
          git push origin HEAD:istanbul-gfs-data
          echo "Published one source bundle: GFS JSON + comparison + report archive + 4 PNGs."
