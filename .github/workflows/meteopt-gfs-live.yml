name: MeteoPT GFS Live Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meteopt-gfs-live.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: meteopt-gfs-live
  cancel-in-progress: false

jobs:
  monitor:
    name: MeteoPT GFS -> F180 -> Pages + Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore GFS state
        run: |
          git fetch origin gfs-watch-state
          if git cat-file -e origin/gfs-watch-state:gfs_watch.db 2>/dev/null; then
            git show origin/gfs-watch-state:gfs_watch.db > gfs_watch.db
          fi
          mkdir -p public
          if git cat-file -e origin/gfs-watch-state:public/latest.json 2>/dev/null; then
            git archive origin/gfs-watch-state public | tar -x -C .
          fi

      - name: Poll MeteoPT and publish completed F180
        env:
          GFS_SOURCE: meteopt
          GFS_TELEGRAM: "1"
          GFS_WATCH_ONCE: "1"
          GFS_WATCH_CONTINUOUS: "0"
          GFS_WATCH_WINDOW_MINUTES: "1"
          GFS_WATCH_POLL_SECONDS: "600"
          GFS_WATCH_TARGET_RUN_ID: ""
          DB_PATH: gfs_watch.db
          PUBLIC_DATA_DIR: public
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u main.py

      - name: Publish state
        id: publish
        if: always()
        run: |
          if [ ! -f gfs_watch.db ]; then exit 0; fi

          rm -rf /tmp/gfs-state
          git clone --quiet --branch gfs-watch-state --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/gfs-state

          cp gfs_watch.db /tmp/gfs-state/gfs_watch.db
          rm -rf /tmp/gfs-state/public
          mkdir -p /tmp/gfs-state/public
          if [ -d public ]; then cp -a public/. /tmp/gfs-state/public/; fi

          cd /tmp/gfs-state
          git add -A gfs_watch.db public
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update MeteoPT GFS live state"
          git push origin gfs-watch-state
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Refresh GitHub Pages immediately
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-live.yml --ref main
