# POST-DEPLOY DRILL 2026-11-08T00:53:33.788Z
# Manual post-deploy synthetic drill trigger
name: Radar Live Drill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/radar-live-test.yml"
      - "radar-worker/**"

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare synthetic radar drill
        env:
          RADAR_API: https://gfs-watch-radar-monitor.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 20 "$RADAR_API/test-radar" | tee "$RUNNER_TEMP/radar-test.json"; then
              break
            fi
            echo "Worker route not ready yet; retry $i/12"
            sleep 10
          done
          cat "$RUNNER_TEMP/radar-test.json"
          node - "$RUNNER_TEMP/radar-test.json" <<'NODE'
          const fs = require("fs");
          const d = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log(JSON.stringify(d));
          NODE
