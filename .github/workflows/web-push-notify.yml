name: Send GFS Web Push

on:
  push:
    branches: [gfs-watch-state]
    paths:
      - "public/notifications/latest.json"
  workflow_dispatch:
    inputs:
      notification_id:
        description: "Optional notification ID; blank sends the latest feed item"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gfs-web-push
  cancel-in-progress: false

jobs:
  send:
    if: ${{ vars.PUSH_API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out published notification feed
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Web Push sender
        working-directory: push-worker
        run: npm install --no-package-lock --ignore-scripts

      - name: Send Web Push notification
        working-directory: push-worker
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NOTIFICATION_ID: ${{ inputs.notification_id }}
          VAPID_SUBJECT: "https://mhsnlsy.github.io/gfs-watch/"
        run: node send-notification.mjs
