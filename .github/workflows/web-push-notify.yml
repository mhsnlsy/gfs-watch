name: Send GFS Web Push

on:
  schedule:
    - cron: "*/5 * * * *" # temporary catch-up trigger
  workflow_dispatch:
    inputs:
      notification_id:
        description: "Optional notification ID; blank sends the latest feed item"
        required: false
        type: string
      test_mode:
        description: "Send a one-off test notification without marking a GFS report as sent"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gfs-web-push
  cancel-in-progress: false

jobs:
  send:
    if: ${{ vars.PUSH_API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out application code
        uses: actions/checkout@v7
        with:
          ref: main
          path: app-source

      - name: Check out published notification feed
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: forecast-data

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Web Push sender
        working-directory: app-source/push-worker
        run: npm install --no-package-lock --ignore-scripts

      - name: Build current 12Z tomorrow-weather notification
        working-directory: app-source
        run: node scripts/build_tomorrow_weather_notification.mjs

      - name: Send Web Push notification
        working-directory: app-source/push-worker
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NOTIFICATION_ID: ${{ inputs.notification_id }}
          PUSH_TEST_MODE: ${{ inputs.test_mode }}
          NOTIFICATION_FEED_PATH: ../tmp/tomorrow-weather-notification.json
          VAPID_SUBJECT: "https://gfs-watch-web.muhsin-ulusoy.workers.dev/"
        run: node send-notification.mjs
