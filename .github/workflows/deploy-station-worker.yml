name: Deploy Cloudflare Station Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/stations/**"
      - ".github/workflows/deploy-station-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-station-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global wrangler@4
      - name: Apply D1 schema
        working-directory: cloudflare/stations
        run: wrangler d1 execute gfs-watch-stations --remote --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        working-directory: cloudflare/stations
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
