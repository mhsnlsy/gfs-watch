name: GFS Watcher Automation

on:
  schedule:
    - cron: '30-59/10 6 * * *'
    - cron: '0-16/10 7-8 * * *'
    - cron: '30-59/10 12 * * *'
    - cron: '0-16/10 13-14 * * *'
  workflow_dispatch:

jobs:
  run-gfs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install requests beautifulsoup4 edge-tts python-telegram-bot

      - name: GFS Takip Betiğini Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
