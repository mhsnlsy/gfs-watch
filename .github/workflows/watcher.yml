name: GFS Watcher Automation

on:
  schedule:
    # 00Z Run (TSİ 06:30 - 08:15 -> UTC 03:30 - 05:15)
    - cron: '30-59/10 3 * * *'
    - cron: '0-15/10 4-5 * * *'

    # 06Z Run (TSİ 12:30 - 14:15 -> UTC 09:30 - 11:15)
    - cron: '30-59/10 9 * * *'
    - cron: '0-15/10 10-11 * * *'

    # 12Z Run (TSİ 18:30 - 20:15 -> UTC 15:30 - 17:15)
    - cron: '30-59/10 15 * * *'
    - cron: '0-15/10 16-17 * * *'

    # 18Z Run (TSİ 00:30 - 02:15 -> UTC 21:30 - 23:15)
    - cron: '30-59/10 21 * * *'
    - cron: '0-15/10 22-23 * * *'

  workflow_dispatch:

jobs:
  run-gfs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install requests beautifulsoup4 edge-tts python-telegram-bot

      - name: GFS Takip Betiğini Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
