name: GFS Watcher Automation

on:
  schedule:
    - cron: '30-59/10 3 * * *'
    - cron: '0-15/10 4-5 * * *'
    - cron: '30-59/10 9 * * *'
    - cron: '0-15/10 10-11 * * *'
    - cron: '30-59/10 15 * * *'
    - cron: '0-15/10 16-17 * * *'
    - cron: '30-59/10 21 * * *'
    - cron: '0-15/10 22-23 * * *'

  workflow_dispatch:

jobs:
  run-gfs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: System Bağımlılıklarını Kur (eccodes)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python Kütüphanelerini Yükle
        run: |
          pip install -r requirements.txt

      - name: GFS Takip Betiğini Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python main.py
