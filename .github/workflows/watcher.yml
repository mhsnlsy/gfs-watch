name: GFS Watcher Automation

on:
  schedule:
    # 00Z Koşusu (TSİ 07:10 - 07:50 arası / UTC 04:10 - 04:50)
    - cron: '10-50/10 4 * * *'
    
    # 06Z Koşusu (TSİ 13:10 - 13:50 arası / UTC 10:10 - 10:50)
    - cron: '10-50/10 10 * * *'
    
    # 12Z Koşusu (TSİ 19:10 - 19:50 arası / UTC 16:10 - 16:50)
    - cron: '10-50/10 16 * * *'
    
    # 18Z Koşusu (TSİ 01:10 - 01:50 arası / UTC 22:10 - 22:50)
    - cron: '10-50/10 22 * * *'

  workflow_dispatch:

jobs:
  run-gfs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python Kütüphanelerini Yükle
        run: |
          pip install -r requirements.txt

      - name: GFS Takip Betiğini Çalıştır
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python -u main.py
