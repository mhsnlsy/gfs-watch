name: Deploy Cloudflare ECMWF Container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ecmwf-container/**"
      - "scripts/fetch_ecmwf_eps.py"
      - "scripts/render_ecmwf_report_charts.py"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-ecmwf-container
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ECMWF Container Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy ECMWF Container Worker
        working-directory: ecmwf-container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is required"; exit 1; }
          wrangler deploy --config wrangler.jsonc

      - name: Verify deployed worker
        env:
          ECMWF_WORKER_URL: https://gfs-watch-ecmwf.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 "$ECMWF_WORKER_URL/health"; then
              echo
              echo "ECMWF Container Worker is healthy."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::ECMWF Container Worker health check failed"
          exit 1
