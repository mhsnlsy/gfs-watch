name: Çanakçı History Collector · 10m

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/canakci-history-10m.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: canakci-history-10m
  cancel-in-progress: false

permissions: {}

jobs:
  collect:
    name: Collect Çanakçı history sample
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Collect exactly one Çanakçı sample
        env:
          STATIONS_API: https://gfs-watch-stations.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail

          response="$RUNNER_TEMP/canakci-collect.json"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --max-time 25 \
            "$STATIONS_API/api/collect/canakci?source=github-actions-10m" \
            -o "$response"

          node - "$response" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));

          if (!doc.ok || !doc.result || !doc.result.ok) {
            throw new Error("Çanakçı collection failed: " + JSON.stringify(doc));
          }

          const result = doc.result;

          if (!result.observed_at_utc) {
            throw new Error("Collection succeeded but observed_at_utc is missing.");
          }

          console.log("Çanakçı sample:", result.observed_at_utc);
          console.log("Trigger:", "github-actions-10m");
          NODE

      - name: Verify the sample is queryable
        env:
          STATIONS_API: https://gfs-watch-stations.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail

          response="$RUNNER_TEMP/canakci-history.json"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 2 \
            --max-time 20 \
            "$STATIONS_API/api/history/canakci?hours=1" \
            -o "$response"

          node - "$response" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));

          if (!doc.ok || !Array.isArray(doc.samples)) {
            throw new Error("Çanakçı history endpoint returned an invalid payload.");
          }

          if (doc.samples.length < 1) {
            throw new Error("Çanakçı history endpoint returned zero samples.");
          }

          console.log("Çanakçı history samples available:", doc.samples.length);
          NODE

      - name: Verify the graph endpoint used by the Köy page
        env:
          STATIONS_API: https://gfs-watch-stations.muhsin-ulusoy.workers.dev
        run: |
          set -euo pipefail

          response="$RUNNER_TEMP/canakci-history-graph.json"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 2 \
            --max-time 20 \
            "$STATIONS_API/api/history-graph/canakci?hours=24&bucket=10" \
            -o "$response"

          node - "$response" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (doc.ok !== true || doc.station_key !== "canakci" ||
              !Array.isArray(doc.samples) || doc.samples.length < 1) {
            throw new Error("Köy History graph endpoint returned no usable samples: " + JSON.stringify(doc));
          }
          const latest = doc.samples[doc.samples.length - 1];
          if (!latest.latest_fetched_at_utc ||
              !Number.isFinite(Date.parse(latest.latest_fetched_at_utc)) ||
              Number(latest.sample_count) < 1) {
            throw new Error("Köy History graph sample is missing its collection timestamp.");
          }
          console.log("Köy History graph verified:", JSON.stringify({
            station: doc.station_key,
            samples: doc.samples.length,
            latest_fetched_at_utc: latest.latest_fetched_at_utc
          }));
          NODE

      - name: Verify the public Köy page loads the History module
        env:
          PUBLIC_WEB: https://istanbulunhavasi.com
        run: |
          set -euo pipefail

          curl --location --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            "$PUBLIC_WEB/koy.html?history-verify=$(date +%s)" \
            -o "$RUNNER_TEMP/koy-public-page.html"
          echo "Fetched public Köy page: $PUBLIC_WEB/koy.html"

          curl --location --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            "$PUBLIC_WEB/koy-observation-history.js?history-verify=$(date +%s)" \
            -o "$RUNNER_TEMP/koy-public-history.js"
          echo "Fetched public Köy History module."

          node - "$RUNNER_TEMP/koy-public-page.html" "$RUNNER_TEMP/koy-public-history.js" <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const js = fs.readFileSync(process.argv[3], "utf8");
          const scriptTag = html.split("\n").find(line =>
            line.includes("koy-observation-history.js")
          ) || "";
          if (!html.includes('<div class="koy-climate-panel">') ||
              !scriptTag.includes("defer") ||
              !js.includes('querySelector(".koy-climate-panel")') ||
              !js.includes("/history-graph/canakci?hours=") ||
              !js.includes("Geçmiş")) {
            throw new Error("Public Köy page is missing the History panel/module/API binding.");
          }
          console.log("Public Köy History page and module verified.");
          NODE

      - name: Report isolated workflow result
        run: |
          echo "Çanakçı 10-minute history collection: SUCCESS"
