name: Deploy İstanbul'un Havası

# Station and notification data are read from gfs-watch-state.
# Deployment refresh trigger: republish the current state-branch payload on demand.
# The ENKA Weather workflow explicitly dispatches this workflow after each fresh station publication.

on:
  push:
    branches: [main, koy-gfs-data]
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # 11:00 Europe/Istanbul, after the source refresh\n    - cron: "0 20 * * *" # 23:00 Europe/Istanbul, after the evening refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source

      - name: Check out published forecast data
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: forecast-data

      - name: Check out independent Köy forecast data
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: koy-gfs-data
          path: koy-data

      - name: Prepare website files
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
        run: |
          test -s forecast-data/public/latest.json
          python -m json.tool forecast-data/public/latest.json > /dev/null
          mkdir -p _site/data
          cp -a source/site/. _site/
          mkdir -p _site/koy-data
          if [ -d koy-data/gfs ]; then
            cp -a koy-data/gfs _site/koy-data/
          else
            mkdir -p _site/koy-data/gfs/f72
            printf '{"schema":"koy-gfs.first72.v1","forecast_source":"meteopt","forecast_6_hourly":[]}' > _site/koy-data/gfs/f72/latest.json
            printf '{"schema":"koy-gfs.comparison.v1","runs":[]}' > _site/koy-data/gfs/comparison.json
          fi
          if [ -d koy-mgm-data/mgm ]; then
            mkdir -p _site/koy-data/mgm
            cp -a koy-mgm-data/mgm/. _site/koy-data/mgm/
          else
            mkdir -p _site/koy-data/mgm
            printf '{"schema":"koy-mgm.station-observation.v1","station_observation":null}\n' > _site/koy-data/mgm/observation.json
            printf '{"schema":"koy-mgm.station-history.v1","samples":[]}\n' > _site/koy-data/mgm/history.json
          fi
          cp forecast-data/public/latest.json _site/data/latest.json
          if [ -s forecast-data/public/meteopt-gfs-first72.json ]; then
            python -m json.tool forecast-data/public/meteopt-gfs-first72.json > /dev/null
            cp forecast-data/public/meteopt-gfs-first72.json _site/data/meteopt-gfs-first72.json
          else
            printf '{"schema":"gfs-watch.meteopt-first72.v1","forecast_source":"meteopt","forecast_6_hourly":[]}' > _site/data/meteopt-gfs-first72.json
          fi
          printf '{"apiBaseUrl":"%s"}' "$PUSH_API_URL" > _site/push-config.json
          if [ -s forecast-data/public/station-observation.json ]; then
            python -m json.tool forecast-data/public/station-observation.json > /dev/null
            cp forecast-data/public/station-observation.json _site/data/station-observation.json
          else
            printf '{"schema":"gfs-watch.station-observation.v1","station_observation":null}\n' > _site/data/station-observation.json
          fi
          if [ -s forecast-data/public/station-temperature-history.json ]; then
            python -m json.tool forecast-data/public/station-temperature-history.json > /dev/null
            cp forecast-data/public/station-temperature-history.json _site/data/station-temperature-history.json
          else
            printf '{"schema":"gfs-watch.station-temperature-history.v1","sampling_interval_minutes":5,"aggregation_interval_minutes":60,"samples":[]}\n' > _site/data/station-temperature-history.json
          fi
          if [ -s forecast-data/public/station-camera-backup.json ]; then
            python -m json.tool forecast-data/public/station-camera-backup.json > /dev/null
            cp forecast-data/public/station-camera-backup.json _site/data/station-camera-backup.json
          fi
          if [ -s forecast-data/public/station-camera-backup-history.json ]; then
            python -m json.tool forecast-data/public/station-camera-backup-history.json > /dev/null
            cp forecast-data/public/station-camera-backup-history.json _site/data/station-camera-backup-history.json
          fi
          if [ -s forecast-data/public/eyupsultan-station-observation.json ]; then
            python -m json.tool forecast-data/public/eyupsultan-station-observation.json > /dev/null
            cp forecast-data/public/eyupsultan-station-observation.json _site/data/eyupsultan-station-observation.json
          else
            printf '{"schema":"gfs-watch.station-observation.v1","station_observation":null}\n' > _site/data/eyupsultan-station-observation.json
          fi
          if [ -s forecast-data/public/eyupsultan-station-temperature-history.json ]; then
            python -m json.tool forecast-data/public/eyupsultan-station-temperature-history.json > /dev/null
            cp forecast-data/public/eyupsultan-station-temperature-history.json _site/data/eyupsultan-station-temperature-history.json
          else
            printf '{"schema":"gfs-watch.station-temperature-history.v1","sampling_interval_minutes":5,"aggregation_interval_minutes":60,"samples":[]}\n' > _site/data/eyupsultan-station-temperature-history.json
          fi
          if [ -s forecast-data/public/sisli-station-observation.json ]; then
            python -m json.tool forecast-data/public/sisli-station-observation.json > /dev/null
            cp forecast-data/public/sisli-station-observation.json _site/data/sisli-station-observation.json
          else
            printf '{"schema":"gfs-watch.station-observation.v1","station_observation":null}\n' > _site/data/sisli-station-observation.json
          fi
          if [ -s forecast-data/public/sisli-station-temperature-history.json ]; then
            python -m json.tool forecast-data/public/sisli-station-temperature-history.json > /dev/null
            cp forecast-data/public/sisli-station-temperature-history.json _site/data/sisli-station-temperature-history.json
          else
            printf '{"schema":"gfs-watch.station-temperature-history.v1","station_id":"18401","station_name":"Şişli","sampling_interval_minutes":5,"aggregation_interval_minutes":60,"samples":[]}\n' > _site/data/sisli-station-temperature-history.json
          fi
          if python source/scripts/build_forecast_verification.py \
              --runs-dir forecast-data/public/runs \
              --enka-history forecast-data/public/station-temperature-history.json \
              --eyup-history forecast-data/public/eyupsultan-station-temperature-history.json \
              --output _site/data/forecast-verification.json; then
            echo "Forecast verification report built."
          else
            printf '{"schema":"gfs-watch.forecast-verification.v1","stations":{}}\n' > _site/data/forecast-verification.json
            echo "Forecast verification could not be built; empty report published."
          fi
          if [ -d forecast-data/public/notifications ]; then
            if [ -s forecast-data/public/notifications/latest.json ]; then
              python -m json.tool forecast-data/public/notifications/latest.json > /dev/null
            fi
            mkdir -p _site/data/notifications
            cp -a forecast-data/public/notifications/. _site/data/notifications/
          fi
          if [ -s forecast-data/public/ecmwf/latest.json ]; then
            python -m json.tool forecast-data/public/ecmwf/latest.json > /dev/null
            mkdir -p _site/data/ecmwf
            cp -a forecast-data/public/ecmwf/. _site/data/ecmwf/
          else
            mkdir -p _site/data/ecmwf
            printf '{"schema":"gfs-watch.ecmwf-eps.v1","status":"pending","model":"ECMWF IFS ENS (EPS)","forecasts":[]}' > _site/data/ecmwf/latest.json
          fi
          touch _site/.nojekyll
          echo "Website bundle prepared with the latest GFS forecast and independent Köy MGM station data."

      - name: Validate inline website JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("source/site/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          scripts = [block for block in blocks if block.strip()]
          if not scripts:
              raise SystemExit("No inline JavaScript blocks found.")
          for index, script in enumerate(scripts):
              Path(f"/tmp/gfs-watch-inline-{index}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline JavaScript blocks.")
          PY
          for script in /tmp/gfs-watch-inline-*.js; do
            node --check "$script"
          done

      - name: Fetch Istanbul dam status from dolulukorani.com API
        run: |
          python - <<'PY'
          import json, urllib.request, datetime, pathlib

          API_URLS = [
              "https://www.dolulukorani.com/api/v1/provinces/istanbul",
              "https://www.dolulukorani.com/api/v1/provinces",
          ]
          SOURCE_URL = "https://www.dolulukorani.com/il/istanbul"
          PREVIOUS_URL = "https://mhsnlsy.github.io/gfs-watch/data/iski-dams.json"
          now = datetime.datetime.now(datetime.timezone.utc)
          out = {
              "schema": "gfs-watch.iski-dams.v1",
              "status": "unavailable",
              "authority": "İSKİ",
              "source_name": "dolulukorani.com",
              "source_url": SOURCE_URL,
              "fetched_at": now.isoformat(),
          }

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          def first_number(obj, names):
              for name in names:
                  value = obj.get(name)
                  if isinstance(value, (int, float)) and not isinstance(value, bool):
                      return float(value)
              return None

          try:
              raw = None
              errors = []
              for api_url in API_URLS:
                  try:
                      request = urllib.request.Request(
                          api_url,
                          headers={
                              "User-Agent": "IstanbulHava/4.1 (+https://mhsnlsy.github.io/gfs-watch/)",
                              "Accept": "application/json",
                              "Cache-Control": "no-cache",
                          },
                      )
                      with urllib.request.urlopen(request, timeout=25) as response:
                          candidate_raw = json.load(response)
                      if not isinstance(candidate_raw, dict):
                          raise ValueError("API yanıtı JSON nesnesi değil")
                      raw = candidate_raw
                      break
                  except Exception as api_error:
                      errors.append(api_url + ": " + str(api_error))
              if raw is None:
                  raise RuntimeError("API uç noktalarının hiçbiri yanıt vermedi: " + " | ".join(errors))

              payload = raw.get("data", raw)
              candidates = list(walk(payload))
              def numeric(value):
                  if isinstance(value, bool) or value is None:
                      return None
                  try:
                      number = float(str(value).replace(",", "."))
                      return number if 0 <= number <= 100 else None
                  except (TypeError, ValueError):
                      return None

              province = next(
                  (item for item in candidates
                   if str(item.get("slug", "")).casefold() == "istanbul"
                   and numeric(item.get("fill_rate")) is not None),
                  None,
              )
              if province is None and "/provinces/istanbul" in api_url:
                  province = next(
                      (item for item in candidates
                       if numeric(item.get("fill_rate")) is not None),
                      None,
                  )
              if province is None:
                  raise ValueError("İstanbul doluluk kaydı API yanıtında bulunamadı")

              rate = numeric(province.get("fill_rate"))
              if rate is None:
                  raise ValueError("fill_rate geçersiz")

              measured = province.get("measured_at")
              label = measured
              if measured:
                  try:
                      dt = datetime.datetime.fromisoformat(str(measured).replace("Z", "+00:00"))
                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=datetime.timezone.utc)
                      label = dt.astimezone(datetime.timezone(datetime.timedelta(hours=3))).strftime("%d.%m.%Y %H:%M")
                  except Exception:
                      pass

              freshness = str(province.get("freshness", "unknown")).lower()
              if freshness not in ("today", "recent", "stale", "unknown"):
                  freshness = "unknown"
              status = "ok" if freshness in ("today", "recent") else "stale"

              out.update({
                  "status": status,
                  "fill_rate": float(rate),
                  "measured_at": measured,
                  "measured_at_label": label,
                  "delta_7d": province.get("delta_7d"),
                  "freshness": freshness,
                  "attribution": raw.get("attribution"),
                  "license": "CC BY 4.0",
              })

              # Total capacity and stored volume are published by the same endpoint
              # in the dam records. Only sum when every included record has both values.
              dam_records = [
                  item for item in candidates
                  if any(key in item for key in ("capacity_mcm", "capacity_million_m3", "capacity_hm3"))
                  and any(key in item for key in ("current_volume_mcm", "volume_mcm", "current_volume_hm3", "volume_hm3"))
              ]
              capacities, volumes = [], []
              for dam in dam_records:
                  capacity = first_number(dam, ("capacity_mcm", "capacity_million_m3", "capacity_hm3"))
                  volume = first_number(dam, ("current_volume_mcm", "volume_mcm", "current_volume_hm3", "volume_hm3"))
                  if capacity is not None and volume is not None:
                      capacities.append(capacity)
                      volumes.append(volume)
              if dam_records and len(capacities) == len(dam_records):
                  out["total_capacity_mcm"] = round(sum(capacities), 3)
                  out["current_volume_mcm"] = round(sum(volumes), 3)

              if freshness not in ("today", "recent"):
                  out["warning"] = "Kaynağın son ölçümü güncel değil; ölçüm tarihi korunarak gösteriliyor."
          except Exception as exc:
              out["error"] = str(exc)
              try:
                  request = urllib.request.Request(
                      PREVIOUS_URL,
                      headers={"Cache-Control": "no-cache", "User-Agent": "IstanbulHava/4.0"},
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      previous = json.load(response)
                  if previous.get("schema") == "gfs-watch.iski-dams.v1" and isinstance(previous.get("fill_rate"), (int, float)):
                      out.update(previous)
                      out["status"] = "stale"
                      out["last_fetch_error"] = str(exc)
              except Exception as previous_error:
                  out["previous_payload_error"] = str(previous_error)

          pathlib.Path("_site/data").mkdir(parents=True, exist_ok=True)
          with open("_site/data/iski-dams.json", "w", encoding="utf-8") as target:
              json.dump(out, target, ensure_ascii=False)
          print("İSKİ baraj verisi:", json.dumps(out, ensure_ascii=False))
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the deployed forecast is the expected GFS cycle
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          expected_run_id="$(python - <<'PY'
          import json
          with open("forecast-data/public/latest.json", encoding="utf-8") as source:
              print(json.load(source)["run_id_utc"])
          PY
          )"
          url="${PAGE_URL%/}/data/latest.json"
          if ! curl --fail --silent --show-error "$url" -o "$RUNNER_TEMP/live-latest.json"; then
            echo "Pages payload is not reachable."
            exit 1
          fi
          actual_run_id="$(python - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "live-latest.json"), encoding="utf-8") as source:
              print(json.load(source)["run_id_utc"])
          PY
          )"
          if [ "$actual_run_id" != "$expected_run_id" ]; then
            echo "Pages serves $actual_run_id, expected $expected_run_id."
            exit 1
          fi
          echo "GFS Pages payload verified: $actual_run_id"
          if [ -s forecast-data/public/ecmwf/latest.json ]; then
            expected_ecmwf_run="$(python - <<'PY'
          import json
          with open("forecast-data/public/ecmwf/latest.json", encoding="utf-8") as source:
              document = json.load(source)
          print(document["run_id_utc"])
          print(len(document.get("forecasts") or []))
          PY
            )"
            expected_ecmwf_steps="${expected_ecmwf_run##*$'\n'}"
            expected_ecmwf_run="${expected_ecmwf_run%%$'\n'*}"
            ecmwf_url="${PAGE_URL%/}/data/ecmwf/latest.json"
            if ! curl --fail --silent --show-error "$ecmwf_url" -o "$RUNNER_TEMP/live-ecmwf.json"; then
              echo "ECMWF Pages payload is not reachable."
              exit 1
            fi
            python - "$RUNNER_TEMP/live-ecmwf.json" "$expected_ecmwf_run" "$expected_ecmwf_steps" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              document = json.load(source)
          assert document.get("schema") == "gfs-watch.ecmwf-eps.v1"
          assert document.get("status") == "ready"
          assert document.get("run_id_utc") == sys.argv[2]
          assert len(document.get("forecasts", [])) == int(sys.argv[3])
          assert int(sys.argv[3]) >= 8
          PY
            echo "ECMWF Pages payload verified: $expected_ecmwf_run ($expected_ecmwf_steps steps)."
          fi

      - name: Verify live Eyüpsultan station payload
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          url="${PAGE_URL%/}/data/eyupsultan-station-observation.json?verify=$GITHUB_RUN_ID"
          if ! curl --fail --silent --show-error "$url" -o "$RUNNER_TEMP/live-eyupsultan.json"; then
            echo "Eyüpsultan Pages payload is not reachable."
            exit 1
          fi
          python - "$RUNNER_TEMP/live-eyupsultan.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              document = json.load(source)
          assert document.get("schema") == "gfs-watch.station-observation.v1"
          observation = document.get("station_observation") or {}
          assert str(observation.get("station_id")) == "18101"
          assert isinstance(observation.get("temperature_2m_c"), (int, float))
          print(
              "Live Eyüpsultan observation verified: "
              f"{observation['temperature_2m_c']}°C · "
              f"{observation['wind_speed_10m_kmh']} km/h · "
              f"{observation['humidity_percent']}% RH · "
              f"age {observation.get('age_minutes')} min"
          )
          PY

          history_url="${PAGE_URL%/}/data/eyupsultan-station-temperature-history.json?verify=$GITHUB_RUN_ID"
          if ! curl --fail --silent --show-error "$history_url" -o "$RUNNER_TEMP/live-eyupsultan-history.json"; then
            echo "Eyüpsultan history is not reachable."
            exit 1
          fi
          python - "$RUNNER_TEMP/live-eyupsultan-history.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              document = json.load(source)
          assert document.get("schema") == "gfs-watch.station-temperature-history.v1"
          assert str(document.get("station_id")) == "18101"
          samples = document.get("samples")
          assert isinstance(samples, list)
          valid = [
              sample for sample in samples
              if isinstance(sample, dict)
              and sample.get("logged_at_utc")
              and isinstance(sample.get("temperature_2m_c"), (int, float))
          ]
          assert valid, "Eyüpsultan history contains no valid temperature samples."
          print(f"Live Eyüpsultan history verified: {len(valid)} samples")
          PY

      - name: Verify live ENKA Balmumcu and MGM Şişli station payloads
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for station in enka sisli; do
            if [ "$station" = "enka" ]; then
              observation="station-observation.json"
              history="station-temperature-history.json"
              expected_id="ENKA-BALMUMCU-CAMERA-OCR"
            else
              observation="sisli-station-observation.json"
              history="sisli-station-temperature-history.json"
              expected_id="18401"
            fi
            curl --fail --silent --show-error "${PAGE_URL%/}/data/$observation?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/$station-observation.json"
            python - "$RUNNER_TEMP/$station-observation.json" "$expected_id" "$station" <<'PY'
          import json, sys
          doc=json.load(open(sys.argv[1], encoding="utf-8"))
          assert doc.get("schema") == "gfs-watch.station-observation.v1"
          obs=doc.get("station_observation") or {}
          assert str(obs.get("station_id")) == sys.argv[2], f"{sys.argv[3]} station ID mismatch"
          assert isinstance(obs.get("temperature_2m_c"), (int,float)), f"{sys.argv[3]} temperature missing"
          assert not obs.get("is_stale", False), f"{sys.argv[3]} observation marked stale"
          print(f"{sys.argv[3]} live payload: {obs['temperature_2m_c']} C · age {obs.get('age_minutes')} min")
          PY
            curl --fail --silent --show-error "${PAGE_URL%/}/data/$history?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/$station-history.json"
            python - "$RUNNER_TEMP/$station-history.json" "$expected_id" "$station" <<'PY'
          import json, sys
          doc=json.load(open(sys.argv[1], encoding="utf-8"))
          assert doc.get("schema") == "gfs-watch.station-temperature-history.v1"
          assert str(doc.get("station_id")) == sys.argv[2], f"{sys.argv[3]} history station ID mismatch"
          samples=doc.get("samples")
          assert isinstance(samples, list), f"{sys.argv[3]} history samples missing"
          print(f"{sys.argv[3]} history payload: {len(samples)} samples")
          PY
          done

      - name: Verify latest GFS report and every referenced Pages asset
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          expected_run_id="$(python - <<'PY'
          import json
          with open("forecast-data/public/latest.json", encoding="utf-8") as source:
              print(json.load(source)["run_id_utc"])
          PY
          )"
          manifest="forecast-data/public/notifications/latest.json"
          test -s "$manifest"
          expected_notification_run_id="$(python - "$manifest" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              document = json.load(source)
          assert document.get("schema") == "gfs-watch.notifications.v1"
          items = document.get("items")
          assert isinstance(items, list) and items, "Notification feed is empty."
          item = items[0]
          assert item.get("run_id_utc"), "Latest notification has no run ID."
          assert item.get("summary", "").strip(), "Latest notification summary is empty."
          assert item.get("report_text", "").strip(), "Latest notification text is empty."
          print(item["run_id_utc"])
          PY
          )"
          python - "$manifest" forecast-data/public/latest.json <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          latest = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          item = manifest["items"][0]
          report = latest.get("report") or {}
          images = report.get("images")
          assert report.get("run_id_utc") == item.get("run_id_utc")
          assert images == item.get("images"), "Embedded latest report differs from notification feed."
          assert isinstance(images, list) and len(images) == 4, "Latest report must have four comparison charts."
          paths = [image.get("path", "") for image in images if isinstance(image, dict)]
          expected = {
              f"gfs-{item['id']}-temperature.png",
              f"gfs-{item['id']}-temperature_850.png",
              f"gfs-{item['id']}-precipitation.png",
              f"gfs-{item['id']}-wind_10m.png",
          }
          assert {pathlib.PurePosixPath(path).name for path in paths} == expected
          assert all(path.endswith(".png") for path in paths)
          assert ".svg" not in json.dumps(latest).lower(), "Legacy SVG path found in public/latest.json."
          print("Embedded latest GFS report is synchronized with four PNG charts; no SVG reference.")
          PY
          if [ "$expected_notification_run_id" != "$expected_run_id" ]; then
            echo "Notification feed is stale: $expected_notification_run_id != $expected_run_id"
            exit 1
          fi

          base_url="${PAGE_URL%/}/data/notifications"
          feed_url="$base_url/latest.json?verify=$GITHUB_RUN_ID"
          if ! curl --fail --silent --show-error "$feed_url" -o "$RUNNER_TEMP/live-notifications.json"; then
            echo "Pages notification feed is not reachable."
            exit 1
          fi
          latest_url="${PAGE_URL%/}/data/latest.json?verify=$GITHUB_RUN_ID"
          if ! curl --fail --silent --show-error "$latest_url" -o "$RUNNER_TEMP/live-latest.json"; then
            echo "Live latest GFS forecast bundle is not reachable."
            exit 1
          fi
          python - "$RUNNER_TEMP/live-notifications.json" "$expected_notification_run_id" "$RUNNER_TEMP/notification-assets.txt" "$RUNNER_TEMP/live-latest.json" <<'PY'
          import json, pathlib, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              document = json.load(source)
          assert document.get("schema") == "gfs-watch.notifications.v1"
          items = document.get("items", [])
          assert items, "Live Pages notification feed is empty."
          item = items[0]
          assert item.get("run_id_utc") == sys.argv[2], (
              f"Live Pages serves {item.get('run_id_utc')}, expected {sys.argv[2]}"
          )
          assert item.get("summary", "").strip()
          assert item.get("report_text", "").strip()
          latest = json.loads(pathlib.Path(sys.argv[4]).read_text(encoding="utf-8"))
          embedded = latest.get("report") or {}
          assert embedded.get("run_id_utc") == item.get("run_id_utc")
          assert embedded.get("images") == item.get("images"), "Live forecast/report and notification feed are out of sync."
          assert ".svg" not in json.dumps(latest).lower(), "Live latest.json still contains an SVG reference."
          assert isinstance(embedded.get("images"), list) and len(embedded["images"]) == 4
          assert all(image.get("path", "").endswith(".png") for image in embedded["images"])
          print("Live latest.json is synchronized with four PNG charts; no SVG reference.")
          images = item.get("images")
          expected_names = {
              f"gfs-{item['id']}-temperature.png",
              f"gfs-{item['id']}-temperature_850.png",
              f"gfs-{item['id']}-precipitation.png",
              f"gfs-{item['id']}-wind_10m.png",
          }
          assert isinstance(images, list) and len(images) == 4, (
              f"Expected exactly four comparison PNGs, found {len(images) if isinstance(images, list) else 'invalid'}"
          )
          image_paths = [image.get("path", "") for image in images if isinstance(image, dict)]
          assert len(image_paths) == 4 and len(set(image_paths)) == 4
          assert all(path.endswith(".png") for path in image_paths), "Comparison charts must be PNG only."
          assert {pathlib.PurePosixPath(path).name for path in image_paths} == expected_names, (
              f"Unexpected comparison chart set: {image_paths}"
          )
          assets = []
          for value in [item.get("image_path"), item.get("audio_path")]:
              if value:
                  assets.append(value)
          for image in item.get("images", []):
              if isinstance(image, dict) and image.get("path"):
                  assets.append(image["path"])
          for asset in assets:
              path = pathlib.PurePosixPath(asset)
              assert not path.is_absolute() and ".." not in path.parts
              assert path.parts and path.parts[0] == "media", f"Unexpected media path: {asset}"
          pathlib.Path(sys.argv[3]).write_text("\\n".join(assets), encoding="utf-8")
          retired = {"icon.svg"}
          for retained_item in items[:4]:
              for image in retained_item.get("images", []):
                  if isinstance(image, dict) and str(image.get("path", "")).lower().endswith(".png"):
                      retired.add("data/notifications/" + image["path"][:-4] + ".svg")
              old_image = retained_item.get("image_path")
              if isinstance(old_image, str) and old_image.lower().endswith(".png"):
                  retired.add("data/notifications/" + old_image[:-4] + ".svg")
          pathlib.Path(sys.argv[3] + ".retired-svg").write_text("\\n".join(sorted(retired)), encoding="utf-8")
          print(f"Live Pages report verified: {item['run_id_utc']} · {len(assets)} assets")
          PY

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            asset_url="$base_url/$asset?verify=$GITHUB_RUN_ID"
            if ! curl --fail --silent --show-error "$asset_url" -o /dev/null; then
              echo "Pages notification media is missing: $asset"
              exit 1
            fi
          done < "$RUNNER_TEMP/notification-assets.txt"

          while IFS= read -r retired; do
            [ -n "$retired" ] || continue
            retired_url="${PAGE_URL%/}/$retired?verify=$GITHUB_RUN_ID"
            status="$(curl --silent --show-error -o /dev/null -w "%{http_code}" "$retired_url")"
            if [ "$status" != "404" ]; then
              echo "Retired SVG endpoint is still published: $retired (HTTP $status)"
              exit 1
            fi
          done < "$RUNNER_TEMP/notification-assets.txt.retired-svg"
          echo "Latest GFS report and its PNG assets are live; all retired SVG URLs return 404."

# Re-deploy when the public notification archive is refreshed.
# Ensure the published archive (including regenerated 850 hPa charts) is bundled in Pages.
