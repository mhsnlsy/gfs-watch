name: Deploy İstanbul'un Havası

# Manual refresh note: notification feed content is published from gfs-watch-state.

on:
  push:
    branches: [main, gfs-watch-state]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "public/latest.json"
      - "public/station-observation.json"
      - "public/notifications/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source

      - name: Check out published forecast data
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: forecast-data

      - name: Prepare website files
        run: |
          test -s forecast-data/public/latest.json
          python -m json.tool forecast-data/public/latest.json > /dev/null
          mkdir -p _site/data
          cp -a source/site/. _site/
          cp forecast-data/public/latest.json _site/data/latest.json
          if [ -s forecast-data/public/station-observation.json ]; then
            python -m json.tool forecast-data/public/station-observation.json > /dev/null
            cp forecast-data/public/station-observation.json _site/data/station-observation.json
          else
            printf '{"schema":"gfs-watch.station-observation.v1","station_observation":null}\n' > _site/data/station-observation.json
          fi
          if [ -d forecast-data/public/notifications ]; then
            if [ -s forecast-data/public/notifications/latest.json ]; then
              python -m json.tool forecast-data/public/notifications/latest.json > /dev/null
            fi
            mkdir -p _site/data/notifications
            cp -a forecast-data/public/notifications/. _site/data/notifications/
          fi
          touch _site/.nojekyll
          echo "Website bundle prepared with the latest GFS forecast."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

# Re-deploy when the public notification archive is refreshed.
