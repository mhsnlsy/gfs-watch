name: GFS Point Subset Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gfs-point-subset-diagnostic.yml"

jobs:
  decode-point:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install ecCodes
        run: |
          python -m pip install eccodes numpy requests
      - name: Decode a single NOAA GFS point subset
        run: |
          python - <<'PY'
          import tempfile
          import requests
          import eccodes

          url = "https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl"
          params = {
              "dir": "/gfs.20261031/06/atmos",
              "file": "gfs.t06z.pgrb2.0p25.f180",
              "var_TMP": "on",
              "lev_2_m_above_ground": "on",
              "var_APCP": "on",
              "lev_surface": "on",
              "var_UGRD": "on",
              "var_VGRD": "on",
              "lev_10_m_above_ground": "on",
              "subregion": "",
              "leftlon": "28.9",
              "rightlon": "29.1",
              "toplat": "41.1",
              "bottomlat": "40.9",
          }
          response = requests.get(url, params=params, timeout=45)
          print("[URL]", response.url)
          print("[HTTP]", response.status_code, "[BYTES]", len(response.content))
          response.raise_for_status()
          if not response.content.startswith(b"GRIB"):
              raise RuntimeError(response.text[:500])

          count = 0
          with tempfile.NamedTemporaryFile(suffix=".grib2") as temp_file:
              temp_file.write(response.content)
              temp_file.flush()
              with open(temp_file.name, "rb") as stream:
                  while True:
                      gid = eccodes.codes_grib_new_from_file(stream)
                      if gid is None:
                          break
                      count += 1
                      try:
                          short_name = eccodes.codes_get(gid, "shortName")
                          level_type = eccodes.codes_get(gid, "typeOfLevel")
                          latitudes = eccodes.codes_get_array(gid, "latitudes")
                          longitudes = eccodes.codes_get_array(gid, "longitudes")
                          values = eccodes.codes_get_values(gid)
                          print({
                              "shortName": short_name,
                              "levelType": level_type,
                              "gridType": eccodes.codes_get(gid, "gridType"),
                              "Ni": eccodes.codes_get(gid, "Ni"),
                              "Nj": eccodes.codes_get(gid, "Nj"),
                              "point_count": len(values),
                              "grid_points": sorted(set((round(float(a), 3), round(float(b), 3)) for a,b in zip(latitudes,longitudes))),
                              "nearest_target_value": float(values[((latitudes-41.014)**2 + (longitudes-28.950)**2).argmin()]),
                          })
                      finally:
                          eccodes.codes_release(gid)
          print("[MESSAGE COUNT]", count)
          if count < 4:
              raise RuntimeError(f"Expected >=4 decoded messages, got {count}")
          PY
