name: GFS 06Z Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gfs-06z-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Open-Meteo GFS metadata and exact 06Z run
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import requests

          metadata_urls = [
              "https://openmeteo.s3.amazonaws.com/data_spatial/ncep_gfs013/in-progress.json",
              "https://openmeteo.s3.amazonaws.com/data_spatial/ncep_gfs013/latest.json",
          ]
          headers = {"Cache-Control": "no-cache"}
          target = datetime.fromisoformat("2026-10-31T06:00:00+00:00")

          for url in metadata_urls:
              print(f"\n[META] {url}")
              response = requests.get(url, headers=headers, timeout=20)
              print(f"[META HTTP] {response.status_code}")
              response.raise_for_status()
              record = response.json()
              reference = datetime.fromisoformat(record["reference_time"].replace("Z", "+00:00"))
              valid = [datetime.fromisoformat(x.replace("Z", "+00:00")) for x in record.get("valid_times", [])]
              last_valid = max(valid)
              print(json.dumps({
                  "reference_time": record.get("reference_time"),
                  "last_modified_time": record.get("last_modified_time"),
                  "completed": record.get("completed"),
                  "valid_time_count": len(valid),
                  "last_valid_time": last_valid.isoformat(),
                  "forecast_horizon_hours": int((last_valid - reference).total_seconds() // 3600),
                  "is_target_06z": reference == target,
              }, ensure_ascii=False))

          api_url = "https://single-runs-api.open-meteo.com/v1/forecast"
          params = {
              "latitude": 41.014,
              "longitude": 28.950,
              "run": "2026-10-31T06:00",
              "models": "ncep_gfs_global",
              "hourly": "temperature_2m",
              "forecast_hours": 181,
              "timezone": "Europe/Istanbul",
          }
          print("\n[SINGLE RUN] 2026-10-31T06:00Z")
          response = requests.get(api_url, params=params, timeout=40)
          print(f"[SINGLE RUN HTTP] {response.status_code}")
          if response.status_code != 200:
              print(response.text[:3000])
              response.raise_for_status()
          data = response.json()
          times = data.get("hourly", {}).get("time", [])
          if times:
              first = datetime.fromisoformat(times[0])
              last = datetime.fromisoformat(times[-1])
              print(json.dumps({
                  "first_local_time": times[0],
                  "last_local_time": times[-1],
                  "row_count": len(times),
                  "coverage_hours": int((last - first).total_seconds() // 3600),
              }, ensure_ascii=False))
          else:
              raise RuntimeError("Single Runs API returned no hourly timestamps")
          PY
