name: Köy Climate — Isolated D1 Refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/koy-climate-refresh.yml"
      - "scripts/refresh_koy_climate.mjs"
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Cloudflare Station Service", "Deploy Cloudflare Köy GFS Service"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: koy-climate-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Refresh CERRA / ERA5 / ERA5-Land climate cache
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Build separate calendar-day historical payloads
        run: node scripts/refresh_koy_climate.mjs

      - name: Verify generated SQL is one D1-safe atomic statement
        run: |
          set -euo pipefail
          test -s koy-climate-refresh.sql
          if grep -Eiq '^[[:space:]]*(BEGIN|COMMIT|SAVEPOINT|ROLLBACK)' koy-climate-refresh.sql; then
            echo "::error::D1 import must not contain manual transaction statements."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const sql = fs.readFileSync("koy-climate-refresh.sql", "utf8").trim();
          if (!sql.startsWith("INSERT INTO climate_cache") || !sql.includes("ON CONFLICT(cache_key) DO UPDATE")) {
            throw new Error("Climate cache SQL is not one upsert statement");
          }
          for (const model of ["cerra", "era5", "era5_land"]) {
            if (!sql.includes("'" + model + "'")) throw new Error("Missing model SQL payload: " + model);
          }
          if ((sql.match(/INSERT INTO climate_cache/g) || []).length !== 1) {
            throw new Error("Expected exactly one atomic INSERT statement");
          }
          console.log("Verified one atomic multi-model upsert without explicit transaction control.");
          NODE

      - name: Ensure Cloudflare D1 cache table exists
        run: |
          set -euo pipefail
          wrangler d1 execute gfs-watch-koy-gfs --remote --command \
            "CREATE TABLE IF NOT EXISTS climate_cache (cache_key TEXT PRIMARY KEY, model TEXT NOT NULL, period_date TEXT NOT NULL, payload_json TEXT NOT NULL, updated_at_utc TEXT NOT NULL);"

      - name: Publish all three model caches in one atomic INSERT
        run: |
          set -euo pipefail
          wrangler d1 execute gfs-watch-koy-gfs --remote --file koy-climate-refresh.sql

      - name: Verify all three model caches through the public Cloudflare Worker
        env:
          KOY_CLIMATE_API: https://gfs-watch-koy-gfs.muhsin-ulusoy.workers.dev/api/climate
        run: |
          set -euo pipefail
          expected_date="$(TZ=Europe/Istanbul date +%F)"
          for model in cerra era5 era5_land; do
            file="$RUNNER_TEMP/$model.json"
            curl --silent --show-error --fail --retry 8 --retry-all-errors --retry-delay 3 --max-time 45 \
              "$KOY_CLIMATE_API?model=$model&verify=$(date +%s)" -o "$file"
            node - "$file" "$model" "$expected_date" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const model = process.argv[3];
          const expectedDate = process.argv[4];
          const data = doc.data;
          if (doc.ok !== true || !data || data.schema !== "koy-climate.v2" || data.model !== model) {
            throw new Error("Invalid public model cache: " + model + " · " + JSON.stringify(doc).slice(0, 800));
          }
          if (data.period_date !== expectedDate || !Number.isFinite(Number(data.long_term?.avg_c))) {
            throw new Error("Model cache is stale/incomplete: " + model + " · " + JSON.stringify({
              period_date: data.period_date, expectedDate, long_term: data.long_term
            }));
          }
          const minimumSamples = data.period_date.slice(5) === "02-29" ? 8 : 10;
          if (!Array.isArray(data.same_day_history) ||
              data.same_day_history.length < minimumSamples ||
              data.same_day_history.length !== Number(data.historical_day_sample_count) ||
              Number(data.archive_row_count) < data.same_day_history.length * 20) {
            throw new Error("Calendar-day history is incomplete: " + model);
          }
          for (const row of data.same_day_history) {
            if (!Array.isArray(row) || row.length !== 3 ||
                !Number.isFinite(Number(row[0])) ||
                !Number.isFinite(Number(row[1]))) {
              throw new Error("Malformed same-day archive row in " + model + ": " + JSON.stringify(row));
            }
          }
          if (data.supported?.precipitation === true &&
              !Number.isFinite(Number(data.precipitation_normal_to_date?.normal_mm))) {
            throw new Error("Historical precipitation normal is missing for " + model);
          }
          if (model === "era5_land" && data.supported?.precipitation !== false) {
            throw new Error("ERA5-Land precipitation must not be fabricated.");
          }
          if (model !== "era5_land" && data.supported?.precipitation !== true) {
            throw new Error("Precipitation support missing for " + model);
          }
          console.log(JSON.stringify({
            model,
            period_date: data.period_date,
            years: [data.historical_start_year, data.historical_end_year],
            archive_row_count: data.archive_row_count,
            historical_day_samples: data.same_day_history.length,
            long_term_mean_c: data.long_term.avg_c,
            precipitation_supported: data.supported.precipitation,
            wind_supported: data.supported.wind,
            updated_at_utc: data.updated_at_utc
          }));
          NODE
          done

      - name: Verify live MGM Çanakçı monthly observations in Cloudflare D1
        env:
          STATIONS_MONTH_API: https://gfs-watch-stations.muhsin-ulusoy.workers.dev/api/climate/month/canakci
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 12 --retry-all-errors --retry-delay 5 --max-time 45 \
            "$STATIONS_MONTH_API?verify=$(date +%s)" -o "$RUNNER_TEMP/canakci-month.json"
          node - "$RUNNER_TEMP/canakci-month.json" <<'NODE'
          const fs = require("fs");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (doc.ok !== true || doc.schema !== "koy-station-month.v1" ||
              doc.station?.key !== "canakci" || !doc.month ||
              Number(doc.month.sample_count) < 1 ||
              Number(doc.coverage?.temperature_days) < 1) {
            throw new Error("MGM monthly station data unavailable or invalid: " + JSON.stringify(doc).slice(0, 1200));
          }
          console.log(JSON.stringify({
            station: doc.station,
            period_date: doc.period_date,
            sample_count: doc.month.sample_count,
            temperature_days: doc.coverage.temperature_days,
            precipitation_days: doc.coverage.precipitation_days,
            avg_temp_c: doc.month.avg_temp_c,
            precipitation_mm: doc.month.precipitation_mm,
            current_temperature_c: doc.current?.temperature_c,
            latest_sample_at_utc: doc.coverage.latest_sample_at_utc
          }));
          NODE
