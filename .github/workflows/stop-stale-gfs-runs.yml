name: Stop stale GFS runs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stop-stale-gfs-runs.yml"

permissions:
  actions: write

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy watcher cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --include --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/41192429589/cancel"
