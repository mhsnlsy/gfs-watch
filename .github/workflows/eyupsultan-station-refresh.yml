name: Eyüpsultan Station Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "*/3 * * * *"
    - cron: "2,5,8,11,14,17,20,23,26,29,32,35,38,41,44,47,50,53,56,59 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/eyupsultan_weather.mjs"
      - ".github/workflows/eyupsultan-station-refresh.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: eyupsultan-weather-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out published station data
        uses: actions/checkout@v4
        with:
          ref: gfs-watch-state
          path: forecast-data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright (fallback only)
        run: npm install --no-save playwright
        continue-on-error: true

      - name: Fetch Eyüpsultan observation
        id: scrape
        run: |
          set -e
          node scripts/eyupsultan_weather.mjs
          if [ ! -f public/eyupsultan-station-observation.json ]; then
            echo "ERROR: No observation file"
            exit 1
          fi
          AGE=$(jq -r '.station_observation.age_minutes // 999' public/eyupsultan-station-observation.json)
          echo "Age: $AGE minutes"
        env:
          EYUPSULTAN_TEMPERATURE_HISTORY_PATH: forecast-data/public/eyupsultan-station-temperature-history.json

      - name: Publish data
        run: |
          mkdir -p forecast-data/public
          cp -f public/eyupsultan-station-observation.json forecast-data/public/ 2>/dev/null || true
          cp -f public/eyupsultan-station-temperature-history.json forecast-data/public/ 2>/dev/null || true
          cd forecast-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/eyupsultan-station-observation.json public/eyupsultan-station-temperature-history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Eyüpsultan [$(date -u +%H:%M)]"
            git pull --rebase origin gfs-watch-state || true
            git push origin gfs-watch-state
          fi

      - name: Force Pages deploy
        if: always() && steps.scrape.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY" || true
