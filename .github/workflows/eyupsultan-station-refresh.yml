name: Eyüpsultan Station Refresh

# Do not use schedule:. GitHub cron does not run reliably on this repository,
# which is why the station repeatedly went stale. This workflow queues its own
# next run, and the ENKA workflow restarts the chain if it ever stops.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: eyupsultan-weather-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out published station data
        uses: actions/checkout@v4
        with:
          ref: gfs-watch-state
          path: forecast-data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Eyüpsultan observation
        id: scrape
        run: |
          set -e
          node scripts/eyupsultan_weather.mjs
          test -s public/eyupsultan-station-observation.json
          AGE=$(jq -r '.station_observation.age_minutes // 999' public/eyupsultan-station-observation.json)
          TEMP=$(jq -r '.station_observation.temperature_2m_c' public/eyupsultan-station-observation.json)
          RAIN=$(jq -r '.station_observation.precipitation_1h_mm // empty' public/eyupsultan-station-observation.json)
          SOURCE=$(jq -r '.station_observation.source' public/eyupsultan-station-observation.json)
          echo "Age: $AGE minutes · $TEMP C · 1sa ${RAIN:-yok} mm · $SOURCE"
          if [ -z "$RAIN" ]; then
            echo "Saatlik yağış yok. Son sağlam kayıt korunuyor."
            exit 1
          fi
          if [ "$AGE" -gt 90 ]; then
            echo "Observation is older than 90 minutes."
            exit 1
          fi
        env:
          EYUPSULTAN_TEMPERATURE_HISTORY_PATH: forecast-data/public/eyupsultan-station-temperature-history.json

      - name: Publish data
        if: steps.scrape.outcome == 'success'
        run: |
          mkdir -p forecast-data/public
          cp -f public/eyupsultan-station-observation.json forecast-data/public/
          cp -f public/eyupsultan-station-temperature-history.json forecast-data/public/ || true
          cd forecast-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/eyupsultan-station-observation.json public/eyupsultan-station-temperature-history.json
          if git diff --cached --quiet; then
            echo "No Eyüpsultan changes to publish."
            exit 0
          fi
          git commit -m "Refresh Eyüpsultan [$(date -u +%H:%M)]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin gfs-watch-state
            if git push origin gfs-watch-state; then
              echo "Eyüpsultan data pushed."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish Eyüpsultan data."
          exit 1

      - name: Force Pages deploy
        if: steps.scrape.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY" || true

      - name: Trigger MeteoPT GFS monitor on every five-minute cycle
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run meteopt-gfs-monitor.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "MeteoPT GFS monitor queued by the active five-minute station chain."

      # Run radar on alternating five-minute station cycles: one scan every ten minutes.
      # Always load the last committed radar history before running a scan.
      # Do not let the older main-branch copies roll the radar history backwards.
      - name: Restore radar history from dedicated branch
        id: restore-radar-state
        if: always() && !cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch radar-state "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/radar-state-restore"
          for file in radar_checks.jsonl radar_state.json radar_alert_state.json; do
            if [ -f "$RUNNER_TEMP/radar-state-restore/$file" ]; then
              cp "$RUNNER_TEMP/radar-state-restore/$file" "$GITHUB_WORKSPACE/$file"
              echo "Restored $file from radar-state."
            else
              rm -f "$GITHUB_WORKSPACE/$file"
              echo "No $file exists on radar-state yet."
            fi
          done

      - name: Set up Python 3.12 for radar monitor
        if: always() && !cancelled()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install radar monitor dependencies
        id: install-radar-deps
        if: always() && !cancelled()
        run: python -m pip install --disable-pip-version-check requests pillow numpy

      - name: Run RainViewer radar scan every ten minutes
        if: always() && !cancelled() && steps.restore-radar-state.outcome == 'success' && steps.install-radar-deps.outcome == 'success'
        run: |
          now=$(date -u +%s)
          minute=$(( (now / 300) % 2 ))
          if [ "$minute" -ne 0 ]; then
            echo "This is the five-minute midpoint; next radar scan is in five minutes."
            exit 0
          fi
          echo "Running the ten-minute RainViewer scan."
          python -u radar_monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RADAR_STATE_PATH: ${{ github.workspace }}/radar_state.json
          RADAR_ALERT_STATE_PATH: ${{ github.workspace }}/radar_alert_state.json
          RADAR_CHECK_LOG_PATH: ${{ github.workspace }}/radar_checks.jsonl

      - name: Persist radar history on dedicated branch
        if: always() && !cancelled() && steps.restore-radar-state.outcome == 'success'
        run: |
          if [ ! -f radar_checks.jsonl ] && [ ! -f radar_state.json ] && [ ! -f radar_alert_state.json ]; then
            echo "No radar data created on this five-minute tick."
            exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          git clone --quiet --branch radar-state "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/radar-state"
          cd "$RUNNER_TEMP/radar-state"
          cp "$GITHUB_WORKSPACE/radar_checks.jsonl" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/radar_state.json" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/radar_alert_state.json" . 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_checks.jsonl radar_state.json radar_alert_state.json
          if git diff --cached --quiet; then
            echo "Radar state is already current."
            exit 0
          fi
          git commit -m "Persist radar check"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin radar-state
            if git push origin HEAD:radar-state; then
              echo "Radar data persisted to radar-state."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Radar-state persistence failed after five attempts."
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Queue next five-minute Eyüpsultan refresh
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          next=$(( (now / 300 + 1) * 300 ))
          delay=$(( next - now ))
          echo "Next Eyüpsultan refresh at $(date -u -d "@$next" +'%Y-%m-%dT%H:%M:%SZ') (sleeping ${delay}s)."
          sleep "$delay"
          gh workflow run eyupsultan-station-refresh.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Next Eyüpsultan refresh queued."
        if: always() && !cancelled()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install radar monitor dependencies
        if: always() && !cancelled()
        run: python -m pip install --disable-pip-version-check requests pillow numpy

      - name: Run RainViewer radar scan every ten minutes
        if: always() && !cancelled()
        run: |
          now=$(date -u +%s)
          minute=$(( (now / 300) % 2 ))
          if [ "$minute" -ne 0 ]; then
            echo "This is the five-minute midpoint; next radar scan is in five minutes."
            exit 0
          fi
          echo "Running the ten-minute RainViewer scan."
          python -u radar_monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RADAR_STATE_PATH: ${{ github.workspace }}/radar_state.json
          RADAR_ALERT_STATE_PATH: ${{ github.workspace }}/radar_alert_state.json
          RADAR_CHECK_LOG_PATH: ${{ github.workspace }}/radar_checks.jsonl

      - name: Persist radar history on dedicated branch
        if: always() && !cancelled()
        run: |
          if [ ! -f radar_checks.jsonl ] && [ ! -f radar_state.json ] && [ ! -f radar_alert_state.json ]; then
            echo "No radar data created on this five-minute tick."
            exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          git clone --quiet --branch radar-state "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/radar-state"
          cd "$RUNNER_TEMP/radar-state"
          cp "$GITHUB_WORKSPACE/radar_checks.jsonl" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/radar_state.json" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/radar_alert_state.json" . 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_checks.jsonl radar_state.json radar_alert_state.json
          if git diff --cached --quiet; then
            echo "Radar state is already current."
            exit 0
          fi
          git commit -m "Persist radar check"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin radar-state
            if git push origin HEAD:radar-state; then
              echo "Radar data persisted to radar-state."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Radar-state persistence failed after five attempts."
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Queue next five-minute Eyüpsultan refresh
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          next=$(( (now / 300 + 1) * 300 ))
          delay=$(( next - now ))
          echo "Next Eyüpsultan refresh at $(date -u -d "@$next" +'%Y-%m-%dT%H:%M:%SZ') (sleeping ${delay}s)."
          sleep "$delay"
          gh workflow run eyupsultan-station-refresh.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Next Eyüpsultan refresh queued."
