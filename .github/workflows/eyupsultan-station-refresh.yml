name: Eyüpsultan Station Refresh

# Do not use schedule:. GitHub cron does not run reliably on this repository,
# which is why the station repeatedly went stale. This workflow queues its own
# next run, and the ENKA workflow restarts the chain if it ever stops.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eyupsultan-station-refresh.yml"
      - "scripts/eyupsultan_weather.mjs"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: eyupsultan-weather-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out published station data
        uses: actions/checkout@v4
        with:
          ref: eyupsultan-state
          path: forecast-data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Eyüpsultan observation
        id: scrape
        run: |
          set -e
          node scripts/eyupsultan_weather.mjs
          test -s public/eyupsultan-station-observation.json
          AGE=$(jq -r '.station_observation.age_minutes // 999' public/eyupsultan-station-observation.json)
          TEMP=$(jq -r '.station_observation.temperature_2m_c' public/eyupsultan-station-observation.json)
          SOURCE=$(jq -r '.station_observation.source' public/eyupsultan-station-observation.json)
          echo "Age: $AGE minutes · $TEMP C · MGM $SOURCE"
          if [ "$AGE" -gt 20 ]; then
            echo "Observation is older than 30 minutes."
            exit 1
          fi
        env:
          EYUPSULTAN_TEMPERATURE_HISTORY_PATH: forecast-data/public/eyupsultan-station-temperature-history.json
          EYUPSULTAN_RAIN_HISTORY_PATH: forecast-data/public/eyupsultan-station-rain-history.json

      - name: Publish data
        id: publish
        if: steps.scrape.outcome == 'success'
        run: |
          mkdir -p forecast-data/public
          cp -f public/eyupsultan-station-observation.json forecast-data/public/
          # History files are written directly into forecast-data/public by the scraper.
          test -s forecast-data/public/eyupsultan-station-temperature-history.json
          test -s forecast-data/public/eyupsultan-station-rain-history.json
          cd forecast-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/eyupsultan-station-observation.json public/eyupsultan-station-temperature-history.json public/eyupsultan-station-rain-history.json
          if git diff --cached --quiet; then
            echo "No station changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh MGM Şişli station observation [$(date -u +%H:%M)]"
          git push origin HEAD:sisli-state
          echo "Station data pushed to dedicated sisli-state."

      - name: Deploy changed station data to GitHub Pages (throttled)
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --workflow=pages-live.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$active" -gt 0 ]; then
            echo "Pages deployment already active ($active); skipping this station-triggered deployment."
            exit 0
          fi
          latest=$(gh run list --workflow=pages-live.yml --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$latest" ]; then
            latest_epoch=$(date -u -d "$latest" +%s)
            now_epoch=$(date -u +%s)
            age=$((now_epoch - latest_epoch))
            if [ "$age" -lt 900 ]; then
              echo "A Pages deployment was started $age seconds ago; enforcing 15-minute station publish interval."
              exit 0
            fi
          fi
          gh workflow run pages-live.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Throttled Pages deployment dispatched for changed station data."
