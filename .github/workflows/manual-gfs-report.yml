name: Manual GFS Report Resend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/manual-gfs-report.yml"

concurrency:
  group: gfs-watch-run-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-selected-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore GFS run history (read only)
        run: |
          git fetch origin gfs-watch-state
          git show origin/gfs-watch-state:gfs_watch.db > gfs_watch.db
      - name: Send 06Z report once
        env:
          DB_PATH: gfs_watch.db
          GFS_WATCH_MANUAL_RUN_ID: "2026-10-31T06:00:00+00:00"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python -u main.py
