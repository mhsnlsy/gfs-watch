# Scheduler re-registration check: 2026-11-01
name: ENKA Station Refresh

on:
  push:
    branches: [main]
    paths:
      - "enka_weather.py"
      - ".github/workflows/enka-station-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Keep each poll until its station-data publication has finished.
concurrency:
  group: enka-weather-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check out published station data
        uses: actions/checkout@v7
        with:
          ref: gfs-watch-state
          path: forecast-data

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lightweight dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch latest ENKA Balmumcu observation
        run: |
          mkdir -p public
          python -u enka_weather.py
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          STATION_PREVIOUS_OBSERVATION_PATH: forecast-data/public/station-observation.json
          STATION_TEMPERATURE_HISTORY_PATH: forecast-data/public/station-temperature-history.json

      - name: Publish station observation and temperature history
        run: |
          cp public/station-observation.json forecast-data/public/station-observation.json
          cd forecast-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/station-observation.json public/station-temperature-history.json
          if git diff --cached --quiet; then
            echo "No station data changes to publish."
            exit 0
          fi
          git commit -m "Refresh ENKA Balmumcu observation"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin gfs-watch-state
            if git push origin gfs-watch-state; then
              echo "Station data pushed to gfs-watch-state."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish station data after five attempts."
          exit 1

      # A push made with GITHUB_TOKEN does not start another workflow.
      - name: Deploy refreshed station data to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "GitHub Pages deployment requested."

      # Eyüpsultan must not depend on GitHub cron. That schedule does not fire
      # on this repository. Restart its self-queue if the chain has died.
      - name: Restart Eyüpsultan refresh if its chain is down
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --workflow=eyupsultan-station-refresh.yml --limit 8 --json status,createdAt --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          echo "Eyüpsultan active runs: $active"
          if [ "$active" = "0" ]; then
            gh workflow run eyupsultan-station-refresh.yml --ref main --repo "$GITHUB_REPOSITORY"
            echo "Eyüpsultan chain was down. Restarted."
          else
            echo "Eyüpsultan chain is alive."
          fi

      # GitHub cron does not run here. ECMWF is refreshed from this living chain
      # only when the published cycle is stale and no fetch is already running.
      - name: Refresh ECMWF when its published cycle is stale
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --workflow=ecmwf-eps.yml --limit 6 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$active" != "0" ]; then
            echo "ECMWF fetch already running ($active)."
            exit 0
          fi
          state=$(python3 - << 'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("forecast-data/public/ecmwf/latest.json")
          stale = True
          if path.is_file():
              try:
                  doc = json.loads(path.read_text())
                  updated = datetime.fromisoformat(doc["updated_at_utc"])
                  age_h = (datetime.now(timezone.utc) - updated).total_seconds() / 3600
                  runs = doc.get("comparison_runs") or []
                  print(f"ECMWF updated {age_h:.1f}h ago, comparison cycles {len(runs)}", flush=True)
                  stale = age_h > 3 or len(runs) < 4
              except Exception as exc:
                  print(f"ECMWF cache unreadable: {exc}", flush=True)
          else:
              print("ECMWF cache missing", flush=True)
          print("STALE" if stale else "FRESH")
          PY
          )
          echo "$state"
          if ! printf '%s\n' "$state" | grep -q '^STALE$'; then
            echo "ECMWF cache is fresh."
            exit 0
          fi
          gh workflow run ecmwf-eps.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "ECMWF refresh requested."

      # Queue the next poll on the next five-minute UTC boundary. This uses
      # workflow_dispatch, which GITHUB_TOKEN is explicitly allowed to trigger.
      - name: Queue next five-minute ENKA refresh
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          next=$(( (now / 300 + 1) * 300 ))
          delay=$(( next - now ))
          echo "Next ENKA refresh at $(date -u -d "@$next" +'%Y-%m-%dT%H:%M:%SZ') (sleeping ${delay}s)."
          sleep "$delay"
          gh workflow run enka-station-refresh.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Next ENKA refresh queued."
