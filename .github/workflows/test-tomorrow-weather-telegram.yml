name: Test Tomorrow Weather Telegram

on:
  push:
    paths:
      - ".github/workflows/test-tomorrow-weather-telegram.yml"
      - "scripts/send_tomorrow_weather_telegram.py"
      - "scripts/build_tomorrow_weather_notification.mjs"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: node scripts/build_tomorrow_weather_notification.mjs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check python-telegram-bot

      - name: Send Telegram test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOMORROW_NOTIFICATION_FEED: tmp/tomorrow-weather-notification.json
        run: python scripts/send_tomorrow_weather_telegram.py
