name: Build Istanbul Havasi Android Widget

on:
  push:
    paths:
      - 'android-widget/**'
      - '.github/workflows/build-android-widget.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: istanbul-havasi-widget-debug
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
