name: Publish GitHub Pages Fallback

on:
  push:
    branches: [main, koy-gfs-data, koy-mgm-data]
    paths:
      - ".github/workflows/publish-live-site.yml"
      - "site/**"
      - "scripts/build_koy_gfs_interactive_svg.py"
      - "gfs/**"
      - "mgm/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-pages-publisher
  cancel-in-progress: true

jobs:
  publish:
    name: Assemble and deploy latest live data
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website source
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Check out GFS forecast data
        uses: actions/checkout@v5
        with:
          ref: gfs-watch-state
          path: forecast-data
          fetch-depth: 1

      - name: Check out Istanbul GFS data
        uses: actions/checkout@v5
        with:
          ref: istanbul-gfs-data
          path: istanbul-gfs-data
          fetch-depth: 1

      - name: Check out Köy GFS data
        uses: actions/checkout@v5
        with:
          ref: koy-gfs-data
          path: koy-data
          fetch-depth: 1

      - name: Check out Köy MGM data
        uses: actions/checkout@v5
        with:
          ref: koy-mgm-data
          path: koy-mgm-data
          fetch-depth: 1

      - name: Prepare Python for Köy GFS chart rendering
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild Köy GFS SVG with Turkish weekday labels
        env:
          KOY_GFS_DIR: ${{ github.workspace }}/koy-data/gfs
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check matplotlib
          python source/scripts/build_koy_gfs_interactive_svg.py

      - name: Assemble live website
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp -a source/site/. _site/

          # Station observations and 72-hour archives are Cloudflare D1/API-only.
          # Never publish stale repository snapshots as station data.
          rm -f \
            _site/data/station-observation.json \
            _site/data/station-temperature-history.json \
            _site/data/eyupsultan-station-observation.json \
            _site/data/eyupsultan-station-temperature-history.json \
            _site/data/eyupsultan-station-rain-history.json \
            _site/data/sisli-station-observation.json \
            _site/data/sisli-station-temperature-history.json \
            _site/data/sisli-station-rain-history.json

          if [ -s "istanbul-gfs-data/gfs/latest.json" ]; then
            cp "istanbul-gfs-data/gfs/latest.json" "_site/data/istanbul-gfs-latest.json"
            if [ -d "istanbul-gfs-data/gfs/notifications" ]; then
              rm -rf "_site/data/notifications"
              cp -a "istanbul-gfs-data/gfs/notifications" "_site/data/notifications"
              echo "Independent Istanbul GFS report archive + PNGs present."
            fi
            if [ -s "istanbul-gfs-data/gfs/comparison.json" ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          latest=Path("_site/data/istanbul-gfs-latest.json")
          comparison=Path("istanbul-gfs-data/gfs/comparison.json")
          doc=json.loads(latest.read_text(encoding="utf-8"))
          cmp=json.loads(comparison.read_text(encoding="utf-8"))
          doc["comparison_runs"]=cmp.get("runs",[])
          latest.write_text(json.dumps(doc,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
            fi
            echo "Independent Istanbul GFS payload present."
          elif [ -s forecast-data/public/latest.json ]; then
            cp "forecast-data/public/latest.json" "_site/data/istanbul-gfs-latest.json"
            echo "Fallback GFS payload present."
          else
            echo "GFS payload unavailable; publishing site shell. Live station data comes from Cloudflare Worker."
          fi

          printf '{"apiBaseUrl":"%s"}' "$PUSH_API_URL" > _site/push-config.json

          mkdir -p _site/koy-data
          if [ -d koy-data/gfs ]; then
            cp -a koy-data/gfs _site/koy-data/
          fi
          if [ -d koy-mgm-data/mgm ]; then
            mkdir -p _site/koy-data/mgm
            cp -a koy-mgm-data/mgm/. _site/koy-data/mgm/
          fi

          touch _site/.nojekyll
          test -s _site/index.html
          node - _site/koy-data/gfs/comparison.json _site/koy-data/gfs/media <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const doc = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const runs = doc.runs || [];
          if (!runs.length) throw new Error("Köy comparison archive has no runs.");
          const latest = runs.slice().sort((a,b) => String(b.run_id_utc).localeCompare(String(a.run_id_utc)))[0];
          const stamp = new Date(latest.run_id_utc).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
          const relative = "koy-gfs-" + stamp.slice(0, 11) + "Z-comparison.svg";
          const svgPath = path.join(process.argv[3], relative);
          if (!fs.existsSync(svgPath) || fs.statSync(svgPath).size < 10000) {
            throw new Error("Latest Köy SVG missing from Pages artifact: " + svgPath);
          }
          const svg = fs.readFileSync(svgPath, "utf8");
          if (!svg.includes("<svg") || !svg.includes('id="gfs-interactive-data"')) {
            throw new Error("Latest Köy SVG manifest missing from Pages artifact.");
          }
          console.log("Pages Köy SVG verified: " + relative);
          NODE
          node - _site/koy.html <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const forbidden = [
            "GFS MODEL BİLDİRİMİ",
            "Giresun Çanakçı GFS tahmin raporu",
            "Son döngü:",
            "İlk GFS tahmin adımı:",
            "SON 4 GFS DÖNGÜSÜ",
            "AYNI GEÇERLİLİK SAATLERİ"
          ];
          const found = forbidden.filter(text => html.includes(text));
          if (found.length) throw new Error("Legacy Köy GFS text still exists in Pages artifact: " + found.join(" | "));
          console.log("Pages artifact verified: Köy GFS report text removed.");
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
