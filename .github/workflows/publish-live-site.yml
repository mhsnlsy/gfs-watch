name: Publish Live Website

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-live-site.yml"
      - "site/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "İstanbul GFS Independent"
      - "İstanbul Stations Independent"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-pages-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Assemble and deploy latest live data
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website source
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Check out GFS forecast data
        uses: actions/checkout@v5
        with:
          ref: gfs-watch-state
          path: forecast-data
          fetch-depth: 1

      - name: Check out Istanbul GFS data
        uses: actions/checkout@v5
        with:
          ref: istanbul-gfs-data
          path: istanbul-gfs-data
          fetch-depth: 1

      - name: Check out ENKA Balmumcu data
        uses: actions/checkout@v5
        with:
          ref: istanbul-enka-data
          path: istanbul-enka-data
          fetch-depth: 1

      - name: Check out MGM Eyüpsultan data
        uses: actions/checkout@v5
        with:
          ref: istanbul-eyupsultan-data
          path: istanbul-eyupsultan-data
          fetch-depth: 1

      - name: Check out MGM Şişli data
        uses: actions/checkout@v5
        with:
          ref: istanbul-sisli-data
          path: istanbul-sisli-data
          fetch-depth: 1

      - name: Check out Köy GFS data
        uses: actions/checkout@v5
        with:
          ref: koy-gfs-data
          path: koy-data
          fetch-depth: 1

      - name: Check out Köy MGM data
        uses: actions/checkout@v5
        with:
          ref: koy-mgm-data
          path: koy-mgm-data
          fetch-depth: 1

      - name: Assemble live website
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp -a source/site/. _site/

          if [ -s "istanbul-gfs-data/gfs/latest.json" ]; then
            cp "istanbul-gfs-data/gfs/latest.json" "_site/data/istanbul-gfs-latest.json"
            if [ -d "istanbul-gfs-data/gfs/notifications" ]; then
              rm -rf "_site/data/notifications"
              cp -a "istanbul-gfs-data/gfs/notifications" "_site/data/notifications"
              echo "Independent Istanbul GFS report archive + PNGs present."
            fi
            if [ -s "istanbul-gfs-data/gfs/comparison.json" ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          latest=Path("_site/data/istanbul-gfs-latest.json")
          comparison=Path("istanbul-gfs-data/gfs/comparison.json")
          doc=json.loads(latest.read_text(encoding="utf-8"))
          cmp=json.loads(comparison.read_text(encoding="utf-8"))
          doc["comparison_runs"]=cmp.get("runs",[])
          latest.write_text(json.dumps(doc,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
            fi
            echo "Independent Istanbul GFS payload present."
          elif [ -s forecast-data/public/latest.json ]; then
            cp "forecast-data/public/latest.json" "_site/data/istanbul-gfs-latest.json"
            echo "Fallback GFS payload present."
          else
            echo "GFS payload unavailable; publishing latest station data."
          fi

          cp "istanbul-enka-data/site/data/station-observation.json" "_site/data/station-observation.json"
          cp "istanbul-enka-data/site/data/station-temperature-history.json" "_site/data/station-temperature-history.json"

          cp "istanbul-eyupsultan-data/site/data/eyupsultan-station-observation.json" "_site/data/eyupsultan-station-observation.json"
          cp "istanbul-eyupsultan-data/site/data/eyupsultan-station-temperature-history.json" "_site/data/eyupsultan-station-temperature-history.json"
          cp "istanbul-eyupsultan-data/site/data/eyupsultan-station-rain-history.json" "_site/data/eyupsultan-station-rain-history.json"

          cp "istanbul-sisli-data/site/data/sisli-station-observation.json" "_site/data/sisli-station-observation.json"
          cp "istanbul-sisli-data/site/data/sisli-station-temperature-history.json" "_site/data/sisli-station-temperature-history.json"
          cp "istanbul-sisli-data/site/data/sisli-station-rain-history.json" "_site/data/sisli-station-rain-history.json"

          printf '{"apiBaseUrl":"%s"}' "$PUSH_API_URL" > _site/push-config.json

          mkdir -p _site/koy-data
          if [ -d koy-data/gfs ]; then
            cp -a koy-data/gfs _site/koy-data/
          fi
          if [ -d koy-mgm-data/mgm ]; then
            mkdir -p _site/koy-data/mgm
            cp -a koy-mgm-data/mgm/. _site/koy-data/mgm/
          fi

          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/data/station-observation.json
          test -s _site/data/eyupsultan-station-observation.json
          test -s _site/data/sisli-station-observation.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
