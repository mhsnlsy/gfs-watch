name: Rebuild Istanbul GFS Interactive SVG

on:
  # Legacy renderer repair is manual only. Production reports are rendered by the Cloudflare Istanbul GFS Worker.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: istanbul-gfs-png-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild SVG with interactive tooltip data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Check out canonical Istanbul GFS archive
        uses: actions/checkout@v7
        with:
          ref: istanbul-gfs-data
          path: gfs-state

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install chart dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate syntax and valid-time alignment
        run: |
          python -m py_compile main.py scripts/build_istanbul_gfs_publication.py scripts/rebuild_istanbul_gfs_comparison_images.py scripts/test_gfs_report_chart_theme.py
          python scripts/test_gfs_report_chart_theme.py
          python scripts/test_gfs_svg_comparison.py
          node --check site/gfs-comparison-tooltip.js

      - name: Rebuild four PNGs from saved canonical forecasts
        env:
          ISTANBUL_GFS_DIR: ${{ github.workspace }}/gfs-state/gfs
        run: python scripts/rebuild_istanbul_gfs_comparison_images.py

      - name: Commit interactive SVG, matching PNG and manifest references
        working-directory: gfs-state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfs/notifications/media gfs/notifications/latest.json gfs/latest.json
          if git diff --cached --quiet; then
            echo "The current canonical SVG and Telegram PNG already contain valid-time tooltip data."
          else
            git commit -m "Rebuild Istanbul GFS interactive SVG comparison"
            git push origin HEAD:istanbul-gfs-data
          fi

      - name: Publish rebuilt report assets to Cloudflare D1
        env:
          ISTANBUL_GFS_API: https://gfs-watch-istanbul-gfs.muhsin-ulusoy.workers.dev
          GFS_DISPATCH_TOKEN: ${{ secrets.GFS_DISPATCH_TOKEN }}
          GFS_STATE_DIR: ${{ github.workspace }}/gfs-state/gfs
        run: |
          set -euo pipefail
          test -n "$GFS_DISPATCH_TOKEN" || { echo "::error::GFS_DISPATCH_TOKEN is not configured"; exit 1; }
          test -s "$GFS_STATE_DIR/notifications/latest.json" || { echo "::error::Notification manifest is missing"; exit 1; }

          GFS_TARGET_RUN_ID="$(python - "$GFS_STATE_DIR/latest.json" <<'PY'
          import json, sys
          from pathlib import Path
          doc = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          run_id = doc.get("run_id_utc")
          if not run_id:
              raise SystemExit("Canonical latest.json has no run_id_utc")
          print(run_id)
          PY
          )"
          export GFS_TARGET_RUN_ID

          upload_asset() {
            local file="$1"
            local key="${file#"$GFS_STATE_DIR"/}"
            local content_type
            local encoding="utf8"
            local payload_file="$RUNNER_TEMP/gfs-d1-publication-asset.json"
            local response_file="$RUNNER_TEMP/gfs-d1-publication-response.json"

            case "$file" in
              *.json) content_type="application/json; charset=utf-8" ;;
              *.svg) content_type="image/svg+xml; charset=utf-8" ;;
              *.png) content_type="image/png"; encoding="base64" ;;
              *) return 0 ;;
            esac

            python - "$file" "$key" "$GFS_TARGET_RUN_ID" "$content_type" "$encoding" "$payload_file" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          source, key, run_id, content_type, encoding, destination = sys.argv[1:]
          raw = Path(source).read_bytes()
          body = base64.b64encode(raw).decode("ascii") if encoding == "base64" else raw.decode("utf-8")
          if len(body) > 1900000:
              raise SystemExit(f"D1 publication asset exceeds row limit: {source}")
          payload = {
              "key": key,
              "run_id_utc": run_id,
              "content_type": content_type,
              "encoding": encoding,
              "body": body,
          }
          Path(destination).write_text(json.dumps(payload, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          PY

            http_code="$(curl --silent --show-error --max-time 45 \
              --request POST \
              --url "$ISTANBUL_GFS_API/gfs/publication-upload" \
              --header "Authorization: Bearer $GFS_DISPATCH_TOKEN" \
              --header "Content-Type: application/json" \
              --header "Accept: application/json" \
              --data-binary "@$payload_file" \
              --output "$response_file" \
              --write-out '%{http_code}')"

            python - "$response_file" "$key" "$http_code" <<'PY'
          import json, sys
          from pathlib import Path
          response_path, key, http_code = sys.argv[1:]
          raw = Path(response_path).read_text(encoding="utf-8")
          try:
              doc = json.loads(raw)
          except Exception:
              raise SystemExit(f"D1 upload returned HTTP {http_code} with non-JSON body: {raw[:500]}")
          if http_code != "200" or doc.get("ok") is not True or doc.get("key") != key:
              raise SystemExit(f"D1 publication upload rejected for {key}; HTTP {http_code}: {doc}")
          print(f"Uploaded D1 report asset: {key} ({doc.get('bytes', 0)} characters)")
          PY
          }

          find "$GFS_STATE_DIR/notifications" -maxdepth 2 -type f \( -path "$GFS_STATE_DIR/notifications/latest.json" -o -path "$GFS_STATE_DIR/notifications/media/*.svg" -o -path "$GFS_STATE_DIR/notifications/media/*.png" \) -print0 | while IFS= read -r -d '' file; do upload_asset "$file"; done

          # Read the latest manifest and its SVG back from D1, the exact source
          # used by the live website, and verify the four chart surfaces are dark.
          curl --fail --silent --show-error --max-time 30 "$ISTANBUL_GFS_API/gfs/publication-asset/notifications/latest.json?verify=$(date +%s)" --output "$RUNNER_TEMP/d1-notification-latest.json"
          SVG_KEY="$(python - "$RUNNER_TEMP/d1-notification-latest.json" <<'PY'
          import json, sys
          from pathlib import Path
          doc = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          items = doc.get("items") or []
          if not items or not (items[0].get("images") or []):
              raise SystemExit("D1 latest notification does not reference an SVG")
          path = items[0]["images"][0].get("path", "")
          if not path.endswith(".svg"):
              raise SystemExit(f"D1 latest report is not an SVG: {path}")
          print("notifications/" + path.lstrip("/"))
          PY
          )"
          curl --fail --silent --show-error --max-time 30 "$ISTANBUL_GFS_API/gfs/publication-asset/$SVG_KEY?verify=$(date +%s)" --output "$RUNNER_TEMP/d1-current-comparison.svg"
          python - "$RUNNER_TEMP/d1-current-comparison.svg" <<'PY'
          import re, sys
          from pathlib import Path
          svg = Path(sys.argv[1]).read_text(encoding="utf-8")
          required = {
              "canvas": r'<g id="patch_1">[\s\S]*?fill: #0a1b29',
              "temperature": r'<g id="patch_6">[\s\S]*?fill: #102a3a',
              "850 hPa": r'<g id="patch_11">[\s\S]*?fill: #102a3a',
              "precipitation": r'<g id="patch_16">[\s\S]*?fill: #102a3a',
              "wind": r'<g id="patch_21">[\s\S]*?fill: #102a3a',
          }
          missing = [name for name, pattern in required.items() if not re.search(pattern, svg, re.I)]
          if missing:
              raise SystemExit("D1 SVG still has non-dark/missing surfaces: " + ", ".join(missing))
          print("Verified D1 live SVG dark surfaces: canvas + four chart panels.")
          PY
          echo "Cloudflare D1 now serves the rebuilt dark SVG and current notification manifest."

