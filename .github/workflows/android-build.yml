name: Build Android APK

on:
  push:
    branches: [android-capacitor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Android app branch
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx cap add android

      - name: Apply native widgets, offline cache and rain alerts
        run: npm run android:prepare

      - name: Synchronize Capacitor project
        run: npx cap sync android

      - name: Validate and build APK
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: istanbul-hava-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
