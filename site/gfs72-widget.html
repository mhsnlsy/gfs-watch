<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GFS İstanbul · İlk 72 Saat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--line:rgba(204,225,239,.11);--text:#edf5f8;--muted:#9bb1bf}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--text);font-family:"DM Sans",sans-serif}
.next-72h-panel{min-width:0;padding:15px;background:linear-gradient(145deg,rgba(18,43,61,.94),rgba(12,31,46,.96));border:1px solid var(--line);border-radius:20px}
.next-72h-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.next-72h-head h2{font:700 20px Manrope,sans-serif;letter-spacing:-.045em;margin:5px 0 0}
.next-72h-head p{font-size:9px;color:var(--muted);margin:5px 0 0}
.next-72h-badge{font-size:9px;color:#b8d7df;border:1px solid var(--line);padding:6px 8px;border-radius:8px;white-space:nowrap;max-width:42%}
.next-72h-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.next-72h-card{position:relative;min-width:0;padding:12px 10px 9px;border:1px solid rgba(204,225,239,.08);border-radius:14px;background:rgba(4,19,29,.17)}
.next-72h-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.next-72h-card-head h3{font:700 14px Manrope,sans-serif;margin:0}
.next-72h-card-head span{font-size:8px;color:var(--muted);white-space:nowrap}
.next-72h-chart{height:190px;width:100%;margin-top:8px;position:relative;min-width:0}
.next-72h-chart svg{display:block;width:100%;height:100%;overflow:visible}
.gfs-point-tooltip{position:absolute;z-index:40;min-width:166px;max-width:min(220px,calc(100% - 12px));padding:10px 11px;border:1px solid rgba(125,211,215,.42);border-radius:12px;background:rgba(3,18,28,.97);box-shadow:0 16px 40px rgba(0,0,0,.35);pointer-events:none}
.gfs-point-tooltip[hidden]{display:none}
.gfs-point-tooltip-head{display:flex;align-items:center;gap:7px;color:#d8f4f0;font-size:10px}
.gfs-point-tooltip-head i{width:7px;height:7px;border-radius:50%;display:block}
.gfs-point-tooltip-time{color:#91aab8;font-size:9px;line-height:1.5;margin-top:5px}
.gfs-point-tooltip-value{font:700 20px Manrope,sans-serif;color:#eff8fb;margin-top:7px}
.gfs-point-tooltip-value small{font:500 10px "DM Sans",sans-serif;color:#9bb1bf}
.gfs-point-tooltip-meta{color:#b5cbd5;font-size:9px;margin-top:5px}
@media(max-width:700px){.next-72h-grid{grid-template-columns:1fr}.next-72h-chart{height:190px}}
@media(max-width:560px){.next-72h-panel{padding:11px;border-radius:16px}.next-72h-head h2{font-size:18px}.next-72h-grid{gap:7px}.next-72h-card{padding:8px 6px 6px}.next-72h-card-head h3{font-size:13px}}
</style>
</head>
<body>
<section class="next-72h-panel" aria-label="Önümüzdeki 72 saatlik hava tahmini">
<div class="next-72h-head"><div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#7dd3d7;font-weight:700">GFS · İSTANBUL</div><h2>Önümüzdeki 72 saat</h2><p>Bant sapmanın büyüklüğü. Kesik çizgi yönü: model sıcak kaçırdıysa istasyon çizginin altında kalmıştır.</p></div><span class="next-72h-badge" id="meta">Model verisi bekleniyor</span></div>
<div class="next-72h-grid">
<article class="next-72h-card"><div class="next-72h-card-head"><h3>Sıcaklık</h3><span>°C</span></div><div class="next-72h-chart" id="temperature"><div style="color:#9bb1bf;font-size:12px;padding:24px 0">Tahmin verisi bekleniyor…</div></div></article>
<article class="next-72h-card"><div class="next-72h-card-head"><h3>Yağış</h3><span>mm / 3 saat</span></div><div class="next-72h-chart" id="precipitation"><div style="color:#9bb1bf;font-size:12px;padding:24px 0">Tahmin verisi bekleniyor…</div></div></article>
</div>
</section>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const num=v=>v==null||v===""||!Number.isFinite(Number(v))?null:Number(v);
const fmt=(v,d=1)=>v==null?"—":Number(v).toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ts=v=>{if(!v)return "—";const d=new Date(v);return Number.isFinite(d.getTime())?new Intl.DateTimeFormat("tr-TR",{timeZone:"Europe/Istanbul",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d)+" TSİ":"—"};
const tsGfsValid=v=>{if(!v)return "—";const d=new Date(v);return Number.isFinite(d.getTime())?new Intl.DateTimeFormat("tr-TR",{timeZone:"UTC",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d)+" TSİ":"—"};
const pointsOf=run=>(run?.forecast_6_hourly||[]).filter(p=>{const h=Number(p.forecast_hour);return Number.isFinite(h)&&h>=3&&h<=72&&h%3===0}).sort((a,b)=>Number(a.forecast_hour)-Number(b.forecast_hour));
const gfsRunLabel=run=>{const d=new Date(run?.run_id_utc||"");if(!Number.isFinite(d.getTime()))return "GFS döngüsü";return ts(d.toISOString())+" · "+String(d.getUTCHours()).padStart(2,"0")+"Z"};
function realizedErrorStats(runs,samples){
 const obs=Array.isArray(samples?.samples)?samples.samples:[];if(!obs.length)return null;
 const errors=[],byHour=new Map(),now=Date.now();
 for(const run of runs||[])for(const p of pointsOf(run)){
  const t=Date.parse(p.valid_time_utc||"");if(!Number.isFinite(t)||t>now)continue;
  let best=null,bestGap=Infinity;
  for(const s of obs){const st=Date.parse(s.observed_at_utc||s.logged_at_utc||"");if(!Number.isFinite(st))continue;const gap=Math.abs(st-t);if(gap<bestGap){best=s;bestGap=gap}}
  if(!best||bestGap>45*60*1000)continue;
  const forecast=num(p.temperature_2m_c),observed=num(best.temperature_2m_c);if(forecast==null||observed==null)continue;
  const e=forecast-observed;errors.push(e);const h=Number(p.forecast_hour);if(!byHour.has(h))byHour.set(h,[]);byHour.get(h).push(e);
 }
 if(errors.length<2)return null;
 const mean=errors.reduce((a,v)=>a+v,0)/errors.length;
 const sigma=Math.sqrt(errors.reduce((a,v)=>a+(v-mean)**2,0)/errors.length);
 const sigmaByHour=new Map();
 for(const [h,vals] of byHour){if(vals.length<2)continue;const m=vals.reduce((a,v)=>a+v,0)/vals.length;sigmaByHour.set(h,Math.sqrt(vals.reduce((a,v)=>a+(v-m)**2,0)/vals.length))}
 return {sigma,count:errors.length,sigmaByHour};
}
function svgLine(run,metric,title,unit,verification){
 const usable=[{run,runIndex:0,points:pointsOf(run).map(p=>({h:Number(p.forecast_hour),v:num(p[metric]),validTime:p.valid_time_utc})).filter(p=>p.v!=null)}].filter(x=>x.points.length);
 if(!usable.length)return '<div style="color:#9bb1bf;font-size:12px;padding:24px 0">Tahmin verisi bekleniyor…</div>';
 const hours=usable[0].points.map(p=>p.h);
 const values=usable[0].points.map(p=>p.v);let lo=Math.min(...values),hi=Math.max(...values);
 if(metric.includes("temperature")){lo=Math.floor((lo-2)/2)*2;hi=Math.ceil((hi+2)/2)*2}else{lo=Math.min(0,lo);hi=Math.max(1,Math.ceil(hi*1.15))}
 if(hi===lo)hi=lo+1;
 const sigma=verification?.sigma||null;if(sigma&&metric.includes("temperature")){lo=Math.min(lo,Math.min(...values)-sigma);hi=Math.max(hi,Math.max(...values)+sigma)}
 const W=760,H=190,L=45,R=12,T=20,B=28,PW=W-L-R,PH=H-T-B;
 const x=h=>L+(h-hours[0])/(hours[hours.length-1]-hours[0]||1)*PW,y=v=>T+(hi-v)*PH/(hi-lo);
 let s='<svg class="koy-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title)+'">';
 for(let j=0;j<=3;j++){const v=lo+(hi-lo)*j/3,yy=y(v);s+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="#294253" stroke-dasharray="3 5"/><text x="'+(L-7)+'" y="'+(yy+3)+'" text-anchor="end" fill="#91aab8" font-size="10">'+fmt(v,0)+'</text>'}
 const first=usable[0].points[0],axisLabel=v=>{const d=new Date(v);if(!Number.isFinite(d.getTime()))return "—";d.setTime(d.getTime()-3*3600000);return new Intl.DateTimeFormat("tr-TR",{timeZone:"Europe/Istanbul",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(d)+" TSİ"};
 hours.forEach(h=>{if(h!==hours[0]&&h%12!==0&&h!==hours[hours.length-1])return;const label=h===hours[0]?axisLabel(first.validTime):"+"+h+"s";s+='<text x="'+x(h)+'" y="'+(H-7)+'" text-anchor="middle" fill="#91aab8" font-size="10">'+esc(label)+'</text>'});
 if(sigma&&metric.includes("temperature")){const upper=[],lower=[];hours.forEach(h=>{const p=usable[0].points.find(q=>q.h===h);if(!p)return;const local=verification.sigmaByHour?.get(h),bandSigma=Number.isFinite(local)&&local>0?local:sigma;upper.push([x(h),y(p.v+bandSigma)]);lower.push([x(h),y(p.v-bandSigma)]);});if(upper.length>1){const band=upper.concat(lower.reverse()).map(p=>p.join(",")).join(" ");s+='<polygon points="'+band+'" fill="#75b9c8" opacity=".16"/>'}s+='<text x="'+(W-R-4)+'" y="'+(T+12)+'" text-anchor="end" fill="#91aab8" font-size="10">Gerçekleşen hata σ ±'+fmt(sigma,1)+'°C · '+verification.count+' doğrulama</text>'}
 const color="#7dd3d7",path=usable[0].points.map((p,j)=>(j?"L":"M")+x(p.h)+" "+y(p.v)).join(" ");s+='<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
 for(const p of usable[0].points){s+='<circle cx="'+x(p.h)+'" cy="'+y(p.v)+'" r="2.5" fill="'+color+'"><title>F'+p.h+' · '+fmt(p.v)+' '+unit+'</title></circle>';s+='<circle class="gfs-point-target" cx="'+x(p.h)+'" cy="'+y(p.v)+'" r="0" data-valid="'+esc(tsGfsValid(p.validTime))+'" data-step="'+esc("F"+p.h+" saat")+'" data-value="'+esc(fmt(p.v,1))+'" data-unit="'+esc(unit)+'" aria-hidden="true"/>'}
 s+='</svg>';return s;
}
function bindTooltip(id){const host=$(id),svg=host?.querySelector("svg"),targets=[...(svg?.querySelectorAll(".gfs-point-target")||[])];if(!host||!svg)return;const tip=document.createElement("div");tip.className="gfs-point-tooltip";tip.hidden=true;host.appendChild(tip);
 const nearest=e=>{const m=svg.getScreenCTM();if(!m)return null;const q=svg.createSVGPoint();let best=null,bd=28;for(const t of targets){q.x=+t.getAttribute("cx");q.y=+t.getAttribute("cy");const p=q.matrixTransform(m),d=Math.hypot(e.clientX-p.x,e.clientY-p.y);if(d<bd){bd=d;best=t}}return best};
 const show=(t,e)=>{if(!t)return;tip.innerHTML='<div class="gfs-point-tooltip-head"><i style="background:#7dd3d7"></i><strong>Güncel GFS tahmini</strong></div><div class="gfs-point-tooltip-time">Geçerlilik · '+esc(t.dataset.valid)+'<br>Kaynak · MeteoPT GFS</div><div class="gfs-point-tooltip-value">'+esc(t.dataset.value)+' <small>'+esc(t.dataset.unit)+'</small></div><div class="gfs-point-tooltip-meta">Tahmin adımı '+esc(t.dataset.step)+'</div>';tip.hidden=false;const b=host.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(6,Math.min(host.clientWidth-w-6,x+14))+"px";tip.style.top=Math.max(6,Math.min(host.clientHeight-h-6,y-h-13))+"px"};
 svg.addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;const t=nearest(e);if(t)show(t,e);else tip.hidden=true});svg.addEventListener("pointerleave",()=>tip.hidden=true);
}
async function load(){
 try{
  const [g,station]=await Promise.all([fetch("./data/meteopt-gfs-first72.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null),fetch("./koy-data/mgm/history.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null)]);
  const run=g&&g.forecast_6_hourly?g:null;if(!run){return}
  $("meta").textContent=g.run_id_utc?ts(g.run_id_utc)+" · sonraki 72 saat":"GFS · sonraki 72 saat";
  const verification=realizedErrorStats([g],station,"temperature_2m_c");
  $("temperature").innerHTML=svgLine(g,"temperature_2m_c","2 m sıcaklık","°C",verification);
  $("precipitation").innerHTML=svgLine(g,"precipitation_6h_mm","6 saatlik yağış","mm / 3 saat",null);
  bindTooltip("temperature");bindTooltip("precipitation");
 }catch(e){}
}
load();setInterval(load,60000);
})();
</script>
</body>
</html>
